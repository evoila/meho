  # would wait for it to be ready before it rolls out a change, and replace
  # it right after someone unlocks it. The field cannot be changed after the
  # first install.
  podManagementPolicy: Parallel
  serviceName: golden-vault-internal
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: golden
  template:
    metadata:
      annotations:
        # The config is read at start. A changed ConfigMap restarts the pod
        # on upgrade.
        checksum/config: 17311b325ab33f36148663019d99b18dce5a822f3a9589796422152345c13a1c
      labels:
        app.kubernetes.io/name: openbao
        app.kubernetes.io/instance: golden
    spec:
      automountServiceAccountToken: false
      # No `<SERVICE>_PORT` variables from other Services in the namespace:
      # a Service named `vault` would otherwise set `VAULT_PORT` here.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bao
          image: "quay.io/openbao/openbao@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf"
          imagePullPolicy: IfNotPresent
          # The image's start script turns off core dumps and adds
          # `-config=<home>/config`.
          args: ["server"]
          env:
            # The pod is not root, so the start script must not try to
            # change file owners.
            - name: SKIP_CHOWN
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BAO_API_ADDR
              value: "http://$(POD_NAME).golden-vault-internal:8200"
            - name: BAO_CLUSTER_ADDR
              value: "https://$(POD_NAME).golden-vault-internal:8201"
            # For `status` in the readiness check and for `kubectl exec`.
            - name: BAO_ADDR
              value: "http://127.0.0.1:8200"
          ports:
            - name: http
              containerPort: 8200
              protocol: TCP
            - name: cluster
              containerPort: 8201
              protocol: TCP
          # `status` exits 2 while the server is locked ("sealed"), so a
          # locked pod is not ready. No liveness check: restarting a locked
          # server would not unlock it.
          readinessProbe:
            exec:
              command: ["bao", "status"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 256Mi
              memory: 512Mi
            requests:
              cpu: 100m
              ephemeral-storage: 64Mi
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /openbao/data
            - name: config
              mountPath: /openbao/config
              readOnly: true
        # Unseals the server after every restart while the Secret
        # `<release>-core-vault-unseal` exists (#4046). Deleting the Secret
        # switches to "keyholder at boot": a person then unseals by hand.
        - name: unseal
          image: "quay.io/openbao/openbao@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf"
          imagePullPolicy: IfNotPresent
