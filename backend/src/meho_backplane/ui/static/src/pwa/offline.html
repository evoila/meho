<!doctype html>

  Offline page of the installed MEHO app. The service worker
  (static/src/app/service-worker.js) shows it when a page cannot be
  loaded because MEHO is not reachable, for example with the VPN off.
  A static file, not a template: it must work with no server at all.
  It names only files the service worker keeps in its cache.
-->
<html lang="en" data-theme="evoila">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MEHO is not reachable</title>
    <link rel="icon" href="/ui/static/src/brand/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/ui/static/dist/tailwind.css" />
    <link rel="stylesheet" href="/ui/static/brand/evoila-daisyui.css" />
    <link rel="stylesheet" href="/ui/static/brand/evoila-fonts.css" />
  </head>
  <body class="min-h-screen">
    <main class="mx-auto flex min-h-screen max-w-md flex-col items-center justify-center gap-4 p-6 text-center">
      <img src="/ui/static/src/brand/icon-192.png" alt="" width="64" height="64" class="rounded-xl" />
      <h1 class="text-xl font-semibold">MEHO is not reachable</h1>
      <p class="text-sm opacity-80">Connect to the VPN and try again.</p>
      <a class="btn btn-primary btn-sm" href="/ui/approvals">Try again</a>
    </main>
  </body>
</html>
