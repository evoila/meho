apiVersion: v2
name: keycloak
description: |
  The built-in login server of the MEHO core: Keycloak on the official image,
  one replica, with the MEHO realm loaded at the first start. Keycloak keeps
  its data in the `keycloak` database of the built-in PostgreSQL. The parent
  chart maps its `coreKeycloak:` values here through a dependency `alias`.
  The Service (`<release>-keycloak`, port 8080) is the address every pod uses;
  browsers reach Keycloak at `https://<host>/auth`.

# Subchart version is independent of the parent chart's calver. Bump on
# breaking subchart-values changes; rev the patch level on image bumps.
type: application
version: 0.1.0
appVersion: "26.8.1"

kubeVersion: ">=1.28.0-0"

sources:
  - https://github.com/evoila/meho
  - https://github.com/keycloak/keycloak

maintainers:
  - name: evoila Group
    url: https://github.com/evoila

keywords:
  - keycloak
  - oidc
  - login
