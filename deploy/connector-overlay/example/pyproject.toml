# A small made-up connector package. CI builds it into an overlay image to
# check that MEHO starts and lists it. It also shows the shape of a
# connector package: its files sit only in its own folder under
# meho_backplane/connectors/.

[project]
name = "example-overlay-connector"
version = "0.1.0"
description = "Made-up connector package for the overlay image build check."
requires-python = ">=3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["meho_backplane/connectors/example_overlay"]
