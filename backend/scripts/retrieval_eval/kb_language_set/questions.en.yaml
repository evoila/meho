# English question file for scripts.retrieval_eval.agent_search.
# Load the pages first (kb_language_set_load.py). All names are made up.
# Per topic: one ticket question (kind: meaning) and one key word question (kind: exact).
# Topics without an English page (gatekeeper, quill logs, relay proxy, tarn db) expect the German page.
questions:
  - id: en-vpn-ticket
    question: Whenever I leave my laptop alone for a few minutes, I lose the company network and must sign in again.
    expect: en/vpn-drops-after-idle.md
    kind: meaning
  - id: en-vpn-keywords
    question: ORB-4012 idle timeout
    expect: en/vpn-drops-after-idle.md
    kind: exact
  - id: en-print-ticket
    question: My document has waited for an hour, the printer does nothing, and nobody else's pages come out either.
    expect: en/print-job-stuck-in-queue.md
    kind: meaning
  - id: en-print-keywords
    question: NP-210 queue
    expect: en/print-job-stuck-in-queue.md
    kind: exact
  - id: en-mail-ticket
    question: People tell me my reply bounced back to them, and nothing new has reached my inbox since this morning.
    expect: en/mailbox-full-quota-exceeded.md
    kind: meaning
  - id: en-mail-keywords
    question: MBX-552 quota bounce
    expect: en/mailbox-full-quota-exceeded.md
    kind: exact
  - id: en-backup-ticket
    question: The nightly backup shows a red error every morning, and the log says it could not read a few files.
    expect: en/backup-fails-on-locked-files.md
    kind: meaning
  - id: en-backup-keywords
    question: snapshot mode HB-0073
    expect: en/backup-fails-on-locked-files.md
    kind: exact
  - id: en-time-ticket
    question: I cannot get in anywhere since this morning although my password is right, and my computer clock is wrong.
    expect: de/anmeldung-scheitert-zeitabweichung.md
