apiVersion: v2
name: result-cache
description: |
  Dedicated Valkey store for MEHO result handles (the full rows behind a
  reduced, set-shaped operation result). Runs Valkey 9.x OSS as a
  single-replica Deployment with no persistence. It is kept apart from the
  `broadcast` store so a burst of large result handles can only fill this
  store, not the one that holds broadcast, rate limits, and approval waits.
  The Service name (`<release>-result-cache`) is the endpoint the backplane
  connects to via `RESULT_CACHE_REDIS_URL`.

# Subchart version is independent of the parent chart's calver. Bump on
# breaking subchart-values changes; rev the patch level on image-tag bumps.
type: application
version: 0.1.0
appVersion: "9.0"

kubeVersion: ">=1.28.0-0"

sources:
  - https://github.com/evoila/meho
  - https://github.com/valkey-io/valkey

maintainers:
  - name: evoila Group
    url: https://github.com/evoila

keywords:
  - valkey
  - redis
  - result-cache
