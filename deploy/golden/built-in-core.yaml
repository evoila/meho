apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: golden-vault
  labels:
    helm.sh/chart: openbao-0.1.0
    app.kubernetes.io/name: openbao
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "2.7.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: secrets
spec:
  # One server. Raft storage lets it grow to three later without a storage
  # change.
  replicas: 1
