# German question file for scripts.retrieval_eval.agent_search.
# Load the pages first (kb_language_set_load.py). All names are made up.
# Per topic: one ticket question (kind: meaning) and one key word question (kind: exact).
# Topics without a German page (beacon, stack share, atlas dns, wavepoint) expect the English page.
questions:
  - id: de-vpn-ticket
    question: Immer wenn ich ein paar Minuten nichts tippe, ist meine Verbindung ins Firmennetz weg und ich muss mich neu anmelden.
    expect: de/vpn-verbindung-bricht-ab.md
    kind: meaning
  - id: de-vpn-keywords
    question: VPN Leerlauf KeepAliveSeconds
    expect: de/vpn-verbindung-bricht-ab.md
    kind: exact
  - id: de-print-ticket
    question: Mein Dokument steht seit einer Stunde auf Warten, der Drucker rührt sich nicht, und bei den anderen kommt auch nichts.
    expect: de/druckauftrag-haengt-in-warteschlange.md
    kind: meaning
  - id: de-print-keywords
    question: NP-210 Warteschlange
    expect: de/druckauftrag-haengt-in-warteschlange.md
    kind: exact
  - id: de-mail-ticket
    question: Seit heute Morgen kommt bei mir keine neue Mail an, und Leute schreiben mir, dass ihre Antwort zurückkam.
    expect: de/postfach-voll-kontingent-ueberschritten.md
