            - name: BAO_ADDR
              value: "http://127.0.0.1:8200"
          resources:
            limits:
              cpu: 100m
              ephemeral-storage: 16Mi
              memory: 64Mi
            requests:
              cpu: 10m
              ephemeral-storage: 8Mi
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: unseal
              mountPath: /unseal
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: golden-vault-config
        # `optional`: the pod also starts without the Secret (keyholder
        # mode). No `subPath`, so the kubelet removes the file when the
        # Secret is deleted and puts it back when the Secret returns.
        - name: unseal
          secret:
            secretName: golden-core-vault-unseal
            optional: true
  # The disk outlives `helm uninstall` on purpose (the default Retain
  # policy): it holds every secret, and it opens only with the unlock key.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: openbao
          app.kubernetes.io/instance: golden
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "10Gi"
