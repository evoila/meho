vmware-rest:
  # Kept on purpose: vm.guest.file.read stays "caution" without approval. It
  # reads a file from a guest; an agent's call waits for approval, a person's
  # call runs at once.
  vmware.composite.vm.guest.file.read:
    - requires_approval
