name: Stage the Tailwind CLI for the image build
description: >-
  Put the pinned Tailwind CLI in backend/.tool-preseed/, so the image build
  makes no download. The binary comes from the cache (keyed by
  scripts/ci/tool-versions.env) and is downloaded with long retries only as
  the last choice. backend/Dockerfile checks its checksum before it uses it.
inputs:
  archs:
    description: Space-separated CPU types to stage (amd64, arm64).
    required: false
    default: amd64

runs:
  using: composite
  steps:
    - name: Restore the Tailwind CLI from the cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/meho-ci-tools/tailwindcss-*
        key: ci-tools-tailwind-${{ runner.os }}-${{ hashFiles('scripts/ci/tool-versions.env') }}

    - name: Stage the Tailwind CLI
      shell: bash
      env:
        ARCHS: ${{ inputs.archs }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        "${GITHUB_WORKSPACE}/scripts/ci/stage_tailwind.sh" ${ARCHS}
