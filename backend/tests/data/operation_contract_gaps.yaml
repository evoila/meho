# Known gaps in the contracts of the hand-written (typed and multi-step)
# operations of every connector.
#
# Read by tests/test_operation_contracts.py. Shape: connector id, then
# operation id, then the rules that operation does not meet yet.
#
# This list may only get shorter:
# - A new gap fails the test. Fix the operation; do not add it here.
# - A fixed gap also fails the test until you remove its entry here.
# The rules are described in docs/codebase/connector-release-readiness.md
# (section "Operation contract check").
#
# A 'requires_approval' or 'write_name' entry is a safety gap. Each one has
# a comment with the reason it is still open. Fixing one changes who must
# approve the operation, so the pull request that fixes it names the operation.

