name: tmp image diagnostics
# Temporary. Removed before the pull request ends.
on:
  pull_request:
    paths:
      - .github/workflows/tmp-image-diag.yml
permissions: {}
jobs:
  diag:
    if: github.repository == 'evoila/meho'
    runs-on: meho-runners-ci
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Read the CI repository secrets
        env:
          CI_IMAGE_PROXY: ${{ secrets.CI_IMAGE_PROXY }}
          REQUIRE_SECRETS: "true"
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/ci/repo_secrets.sh" CI_IMAGE_PROXY <<'IMAGES'
          DIAG_KC: PROXY/keycloak/keycloak:26.8.1
          DIAG_OB: PROXY/openbao/openbao:2.7.1
          DIAG_DEB: PROXY/library/debian:trixie-slim
          DIAG_BB: PROXY/rancher/mirrored-library-busybox:1.36.1
          IMAGES
      - name: Facts about the runner and its Docker daemon
        run: |
          set +e
          echo "user: $(id -un) uid=$(id -u)"
          if sudo -n true 2>/dev/null; then echo "sudo without password: yes"; else echo "sudo without password: no"; fi
          echo "DOCKER_HOST set: $([ -n "${DOCKER_HOST:-}" ] && echo yes || echo no)"
          echo "docker socket file: $([ -S /var/run/docker.sock ] && echo yes || echo no)"
          echo "server version: $(docker info --format '{{.ServerVersion}}')"
          echo "rootless: $(docker info --format '{{.SecurityOptions}}' | grep -c rootless)"
          echo "registry mirrors configured: $(docker info --format '{{len .RegistryConfig.Mirrors}}')"
          echo "daemon.json readable: $([ -r /etc/docker/daemon.json ] && echo yes || echo no)"
          echo "ryuk image already on the daemon: $(docker image ls --format '{{.Repository}}' | grep -c ryuk)"
          echo "images on the daemon: $(docker image ls -q | wc -l)"
          echo "--- direct pull of a tiny Docker Hub image"
          docker pull hello-world >/dev/null 2>&1 && echo "docker hub direct pull: works" || echo "docker hub direct pull: fails"
      - name: Which registries does the proxy serve
        run: |
          set +e
          for name in DIAG_KC DIAG_OB DIAG_DEB DIAG_BB; do
            ref="${!name}"
            if out="$(docker manifest inspect "$ref" 2>&1)"; then
              echo "$name: served ($(printf %s "$out" | grep -c '"digest"') digests listed)"
            else
              echo "$name: NOT served: $(printf %s "$out" | tr -d '\n' | cut -c1-120)"
            fi
          done
          echo "chart digest keycloak: $(grep -o 'sha256:[0-9a-f]*' deploy/charts/meho/charts/keycloak/values.yaml | head -1)"
          echo "chart digest openbao: $(grep -o 'sha256:[0-9a-f]*' deploy/charts/meho/charts/openbao/values.yaml | head -1)"
          for name in DIAG_KC DIAG_OB; do
            echo "$name index digest: $(docker buildx imagetools inspect "${!name}" 2>/dev/null | grep -m1 '^Digest:')"
          done
      - name: Can the daemon be blocked from outside registries
        run: |
          set +e
          if ! sudo -n true 2>/dev/null; then echo "no sudo: cannot edit the hosts file of the daemon host"; exit 0; fi
          printf '0.0.0.0 registry-1.docker.io docker.io index.docker.io auth.docker.io production.cloudflare.docker.com quay.io ghcr.io\n' | sudo tee -a /etc/hosts >/dev/null
          docker pull hello-world:linux >/dev/null 2>&1 && echo "after block, docker hub pull: still works" || echo "after block, docker hub pull: fails (blocked)"
          docker pull "$DIAG_BB" >/dev/null 2>&1 && echo "after block, proxy pull: works" || echo "after block, proxy pull: fails"
