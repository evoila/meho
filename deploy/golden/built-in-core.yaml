                  msg="sealed, the unseal call failed: a wrong key in the Secret, or the server is not set up (output hidden: it could hold the key)"
                fi
                if [ "$msg" != "$last" ]; then echo "unseal: $msg"; last="$msg"; fi
                sleep 5 & wait $!
              done
