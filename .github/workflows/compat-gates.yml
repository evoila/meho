# Compatibility gate for the REST API, the MCP tools and the Helm values.
#
# Compares the committed contract files with the base of the pull
# request and fails on a breaking change:
#   - cli/api/openapi.json (REST API, public paths under /api/v1/ only),
#     with oasdiff;
#   - backend/contracts/mcp-tools-list.json (MCP tool names, surface,
#     input and output schemas), with scripts/ci/check_contract_compat.py;
#   - deploy/charts/meho/values.yaml and values.schema.json (a removed key,
#     a narrower schema), with the same script.
# A breaking change passes only when the pull request has the
# `breaking-change` label and a "## Breaking changes" section in its text.
# So the workflow starts again when a label or the text changes.
#
# Copy instead of a new check (#7105). Most of those events change nothing
# the check reads: a label other than `breaking-change`, or an edit of the
# title only. Then the job `reuse` (GitHub-hosted, scripts/ci/compat_gates_reuse.sh)
# finds the compatibility job of the newest earlier run on the same commit,
# waits for it when it still runs, and the job `compat` copies its result
# (success or failure) on a GitHub-hosted runner. It runs the full check when
# there is no finished result to copy, for example when that job was
# cancelled. The job `compat` is never skipped: a skipped job counts as
# passed and would hide an earlier red result. Such a copy run has its own
# concurrency group, so it does not cancel the check of the commit.
#
# Other checks keep the snapshots equal to the code: the ci.yml job
# `cli-api-snapshot-freshness` and backend/tests/test_mcp_tools_snapshot_drift.py.
#
# Before a release candidate, run it by hand against the previous tag
# (docs/RELEASING.md, "R3 — Before cutting an rc"):
#   gh workflow run compat-gates.yml --ref main -f base=<previous tag> -f head=<candidate sha>
#
# Not in the merge queue: the label is not visible there. Add a
# merge_group path before this becomes a required check.

name: compat-gates

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:
    inputs:
      base:
        description: 'Git ref to compare with (for example the previous tag)'
        required: true
      head:
        description: 'Git ref to check (default: the branch the run starts on)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # A run that can copy a result gets a group of its own (see above).
  group: compat-gates-${{ github.ref }}-${{ github.event_name }}${{ (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'breaking-change') || (github.event.action == 'edited' && github.event.changes.body == null && github.event.changes.base == null)) && format('-copy-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  OASDIFF_VERSION: '1.36.0'
  # sha256 of oasdiff_1.36.0_linux_amd64.tar.gz from the release page.
  OASDIFF_SHA256: 'dba65661f6d0f178a3e4884c309f19527a849388bb9df0e81545db76dbb697d6'

jobs:
  reuse:
    name: Find the result of this commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The script waits at most about 5 minutes for an earlier run.
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.decide.outputs.reuse }}
      conclusion: ${{ steps.decide.outputs.conclusion }}
    steps:
      - name: Check out the script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: scripts/ci/compat_gates_reuse.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Copy the result, or run the check
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          CHANGES_JSON: ${{ toJSON(github.event.changes) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Must match the `name:` of the job `compat` below.
          CHECK_NAME: REST API, MCP tools and Helm values compatibility
          WORKFLOW_FILE: compat-gates.yml
        run: bash scripts/ci/compat_gates_reuse.sh

  compat:
    name: REST API, MCP tools and Helm values compatibility
    needs: reuse
    # Also when `reuse` was skipped (a manual run) or failed: then it runs
    # the full check.
    if: ${{ !cancelled() }}
    # Own pool for the full check, except a fork pull request (hosted
    # runner). A copied result needs no tools, so it runs hosted. The full
    # check needs only git, Python and a public download.
    runs-on: ${{ (needs.reuse.outputs.reuse == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || 'meho-runners-ci' }}
    timeout-minutes: 10
    env:
      REUSE: ${{ needs.reuse.outputs.reuse }}
    steps:
      - name: Copy the result of the last check on this commit
        if: env.REUSE == 'true'
        env:
          CONCLUSION: ${{ needs.reuse.outputs.conclusion }}
        run: |
          if [ "${CONCLUSION}" = "success" ]; then
            echo "The last check on this commit passed. Nothing it reads has changed."
            exit 0
          fi
          echo "::error title=Compatibility check::The last check on this commit failed (${CONCLUSION}). Nothing it reads has changed, so it still fails. Its log has the details."
          exit 1

      - name: Checkout
        if: env.REUSE != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head || '' }}
          # A pull request checks out its merge commit; HEAD^1 is the base.
          # A manual run compares with any tag, so it needs the full history.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '2' }}

      - name: Set up Python
        if: env.REUSE != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Install PyYAML
        if: env.REUSE != 'true'
        # The check reads values.yaml of the Helm chart.
        run: python -m pip install 'PyYAML==6.0.3'

      - name: Install oasdiff
        if: env.REUSE != 'true'
        run: |
          set -euo pipefail
          TAR="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/${TAR}" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${TAR}"
          echo "${OASDIFF_SHA256}  /tmp/${TAR}" | sha256sum -c -
          mkdir -p /tmp/oasdiff
          tar -xzf "/tmp/${TAR}" -C /tmp/oasdiff oasdiff
          /tmp/oasdiff/oasdiff --version

      - name: Check for breaking changes
        if: env.REUSE != 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_INPUT: ${{ inputs.base }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            python scripts/ci/check_contract_compat.py \
              --base "$BASE_INPUT" --oasdiff /tmp/oasdiff/oasdiff
          else
            printf '%s' "$PR_BODY" > /tmp/pr-body.md
            python scripts/ci/check_contract_compat.py \
              --base HEAD^1 --oasdiff /tmp/oasdiff/oasdiff \
              --labels "$PR_LABELS" --pr-body-file /tmp/pr-body.md
          fi
