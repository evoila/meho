  - slug: orbit-backup-retention
    language: en
    status: current
    body: |
      # Orbit backup agent retention

      This page explains how long the Orbit backup agent keeps restore
      points and how to change it.

      ## Scope

      The rules apply to every Orbit agent from release 4 onward. Older
      agents are no longer supported.

      ## Schedules

      The agent takes one full backup per week and one incremental backup
      per day. Schedules are set per backup job in the job file.

      ## Retention policy

      Restore points are kept for 30 days by default. Change the period
      with the setting retention_days in the job file, then restart the
      agent. The agent deletes expired restore points during the nightly
      cleanup run.

      ## Storage use

      Expect the backup store to hold about five full backups per job at
      the default retention. Watch free space on the backup store weekly.

  - slug: orbit-backup-retention-2024
    language: en
    status: stale
    body: |
      # Orbit backup agent retention (old release)

      Notes for release 3 of the Orbit backup agent.

      ## Retention policy

      Restore points are kept for 7 days by default. Change the period with
      the command line flag --keep-days and restart the agent. The agent
      deletes expired restore points at once.

