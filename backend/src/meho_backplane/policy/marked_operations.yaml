#
# Marked operations: the risk level of each one for when the switch
# CUSTOM_POLICY is on (docs/decisions/2026-11-25-custom-policy-model.md,
# decisions 5 and 10).
#
# Nothing reads this file yet. A later step reads it when CUSTOM_POLICY is
# on. Until then every operation below behaves as today.
#
# One row for each built-in typed operation in one of three groups:
#   1. caution, with the plain "always ask" mark (requires_approval) and no
#      reason that blocks a grant. With the switch on, each one becomes
#      dangerous by default.
#   2. "approve each call" (declare_per_call_approval). These are proposals
#      only; the owner decides later.
#   3. dangerous, with the plain mark and no reason that blocks a grant.
#      These are proposals only; the owner decides later.
#
# Each row:
#   op_id, connector_id   the operation.
#   group                 1, 2 or 3, as above.
#   level_today           the risk level in the code today.
#   mark_today            plain (requires_approval) or per_call.
#   does                  what the operation changes, in one line.
#   level_with_switch     the risk level when the switch is on. Never lower
#                         than level_today.
#   applies               "yes" (group 1) or proposed (groups 2 and 3).
#   fixed_rules           the fixed rules that also cover the operation
#                         today, by the ids of decision 5. Empty when none.
#   approves_today        which default roles may approve another person's
#   approves_with_switch  request, today and with the switch on. A Platform
#                         Admin may always approve what an Admin may.
#   loses                 group 3 only: what a call loses for good, so that
#                         no later call can bring it back: nothing, deletes,
#                         stops or overwrites.
#   delete_sign_proposed  group 3 only: true when we propose a delete sign.
#   why                   the reason for the level. Needed for groups 2 and
#                         3, and for a group 1 row that is not dangerous.
#
# backend/tests/test_marked_operations_table.py checks this file against the
# registered operations.

