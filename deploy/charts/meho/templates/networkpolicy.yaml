{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "meho.fullname" . }}
  labels:
    {{- include "meho.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "meho.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller's namespace may reach the backplane.
    # The selector matches RKE2's `ingress-nginx` namespace by default;
    # override `networkPolicy.ingressControllerNamespace` per environment.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - port: 8000
          protocol: TCP
    {{- with .Values.networkPolicy.ingestAllowedNamespaces }}
    # In-cluster webhook senders (Alertmanager, Grafana, Harbor, VCF
    # Operations, ...) delivering to the inbound event-ingest endpoint
    # (`POST /api/v1/events/ingest/{source_slug}`, #2881) from another
    # namespace of the same cluster. Default empty → this rule is omitted
    # and the backplane stays default-deny; only namespaces listed in
    # `networkPolicy.ingestAllowedNamespaces` are admitted to tcp/8000.
    # Each entry matches a namespace by the `kubernetes.io/metadata.name`
    # label kube-apiserver stamps on every namespace (Kubernetes ≥ 1.22),
    # the same label the ingress-controller rule above matches on. The
    # peers are OR-ed, so any listed namespace is admitted. SaaS-origin
    # senders and the satellite-runner inbound listener are out of scope —
    # they reach the endpoint through the ingress hostname.
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: 8000
          protocol: TCP
    {{- end }}
  egress:
    # PostgreSQL — locked to the operator-supplied CIDR. Defaults to a /32
    # placeholder so the chart fails-closed on a misconfigured value rather
    # than silently allowing a wide subnet.
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.postgresCIDR }}
      ports:
        - port: 5432
          protocol: TCP
    # Vault — operator-supplied CIDR; default-deny otherwise.
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.vaultCIDR }}
      ports:
        - port: 8200
          protocol: TCP
    {{- if .Values.coreKeycloak.enabled }}
    # Built-in Keycloak (#4591): the backplane calls its Service for
    # discovery, keys, tokens and the Admin REST API. A NetworkPolicy
    # matches the pod's port, which is always 8080 (the Service's
    # `targetPort: http`). Selectors match `coreKeycloak.selectorLabels`.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 8080
          protocol: TCP
    {{- else }}
    # Keycloak — typically reached over HTTPS through the cluster ingress
    # or an external load balancer; CIDR is operator-supplied.
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.keycloakCIDR }}
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
    {{- if .Values.broadcast.enabled }}
    # Activity-broadcast subchart (`charts/broadcast/` — Valkey per ADR
    # 0005). Selectors match the broadcast subchart's `_helpers.tpl`
    # `broadcast.selectorLabels` exactly so this rule lines up with the
    # Pods the subchart renders. Egress is conditional on
    # `broadcast.enabled` — when the operator points at an external
    # endpoint the rule disappears and no in-cluster port-6379 traffic
    # is permitted.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: broadcast
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: {{ .Values.broadcast.service.port }}
          protocol: TCP
    {{- end }}
    {{- if .Values.resultCache.enabled }}
    # Dedicated result-cache subchart (`charts/result-cache/`). Selectors
    # match that subchart's `resultCache.selectorLabels`. Without this rule
    # the backplane cannot reach the store and every result read misses.
    # The port is the Pod port (Valkey always listens on 6379), not
    # `resultCache.service.port`: the policy is checked after the Service
    # forwards the connection to the Pod.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: result-cache
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 6379
          protocol: TCP
    {{- end }}
    # DNS — UDP/53 to kube-dns / CoreDNS. Without this rule every other
    # egress rule above fails on name resolution. The selector matches the
    # standard `k8s-app: kube-dns` label CoreDNS ships with by default.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- range $i, $rule := . }}
    {{- /* Also guarded by the schema; this check holds under --skip-schema-validation. */}}
    {{- if not $rule.to }}
    {{- fail (printf "networkPolicy.extraEgress[%d] has no 'to' list. Kubernetes reads a rule without 'to' as 'allow every destination'. Add a 'to' list with the networks MEHO must reach." $i) }}
    {{- end }}
    {{- end }}
    # Operator egress rules, added exactly as written (#3516): the
    # systems MEHO manages, the AI service, and anything the fixed rules
    # above cannot express (Vault / Keycloak behind an ingress, whose
    # traffic is redirected to the ingress Pod port before the rule is
    # checked). Default empty — nothing is added.
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
