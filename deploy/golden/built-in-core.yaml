        app.kubernetes.io/component: vault-init
    spec:
      # `Never`: a failed pod keeps its log, which says what to fix.
      restartPolicy: Never
      serviceAccountName: golden-vault-init
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
