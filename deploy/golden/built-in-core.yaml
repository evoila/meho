        # also run core.sql on its own, without the password variables.
        - name: initdb
          configMap:
            name: golden-postgres-config
            defaultMode: 0555
            items:
              - key: apply.sh
                path: 10-core.sh
        - name: superuser
          secret:
            secretName: golden-core-postgres-superuser
            defaultMode: 0440
            items:
              - key: password
                path: password
        - name: meho
          secret:
            secretName: golden-core-postgres-meho
            defaultMode: 0440
            items:
              - key: password
                path: password
        - name: meho-app
          secret:
            secretName: golden-core-postgres-meho-app
            defaultMode: 0440
            items:
              - key: password
                path: password
        - name: keycloak
          secret:
            secretName: golden-core-postgres-keycloak
            defaultMode: 0440
            items:
              - key: password
                path: password
  # The disk outlives `helm uninstall` on purpose (the default Retain
  # policy). Delete the PVC and the generated Secrets together, or neither.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/instance: golden
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "10Gi"
