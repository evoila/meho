    - response_schema
    - llm_instructions
    - examples
  sddc.domain.list:
    - summary
    - response_schema
    - llm_instructions
    - examples
  sddc.domain.status:
    - summary
    - response_schema
    - llm_instructions
    - examples
  sddc.domain.validate:
