{{- if not .Values.hostname }}
{{- fail "coreKeycloak.hostname is empty. Set it to MEHO's public DNS name (the same value as ingress.host)." }}
{{- end }}
{{- if not .Values.firstTenantId }}
{{- fail "coreKeycloak.firstTenantId is empty. Set it to a UUID: pick one per install (for example with uuidgen) and keep it." }}
{{- end }}
# The MEHO realm, imported by Keycloak at its first start (`--import-realm`).
# No secret is in this file: every `${...}` is filled by Keycloak from the
# pod's environment during the import (see the StatefulSet).
#
# With the company login on, the bootstrap Job sets up the identity provider
# as meho-admin, which then needs two more realm-management roles. They are
# added here, so the realm file itself stays the one of an install without
# the company login (docs/codebase/core-bootstrap.md).
{{- $realm := .Files.Get "files/meho-realm.json" }}
{{- if .Values.companyLogin.enabled }}
{{- $doc := fromJson $realm }}
{{- $account := index $doc.users 0 }}
{{- $roles := index $account.clientRoles "realm-management" }}
{{- $_ := set $account.clientRoles "realm-management" (concat $roles (list "manage-identity-providers" "manage-realm")) }}
{{- $realm = toPrettyJson $doc }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coreKeycloak.fullname" . }}-realm
  labels:
    {{- include "coreKeycloak.labels" . | nindent 4 }}
data:
  meho-realm.json: |
    {{- $realm | nindent 4 }}
