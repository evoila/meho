{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coreVault.fullname" . }}
  labels:
    {{- include "coreVault.labels" . | nindent 4 }}
spec:
  # Selects the OpenBao pod and admits port 8200 only from the backplane
  # pods of this release, the release's `vault-init` Job (it sets OpenBao
  # up) and the peers in `extraFrom`. Egress is not limited here.
  podSelector:
    matchLabels:
      {{- include "coreVault.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.backplanePodLabels | nindent 14 }}
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: vault-init
      ports:
        - port: http
          protocol: TCP
{{- end }}
