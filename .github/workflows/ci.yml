# PR-level CI workflow — the central per-PR test harness for all three
# in-tree toolchains.
#
# Locked matrix (Goal #11 DoD bullet 4 — every PR runs lint + tests on
# every toolchain that has source code in the repo):
#
#   python-lint-test  : ruff check + ruff format --check + mypy + pytest on backend/
#   go-lint-test      : golangci-lint + go build + go test on cli/
#   helm-lint-template: helm lint + helm template + kubeconform on deploy/charts/meho/
#
# Each job runs on its own meho-runners-ci runner in parallel; total wall
# clock for a green PR is well below the 10-minute Goal #11 budget
# because the three jobs never block each other. Per-job
# `timeout-minutes` caps a runaway gate at twice its observed cost.
#
# Out of scope (deliberately delegated to existing workflows; do not
# duplicate here):
#   * Backplane image build / push  -> .github/workflows/image.yml
#     (builds without pushing on PRs that touch `backend/**` or
#     `.github/workflows/image.yml` — path-filtered, see image.yml's
#     `on.pull_request.paths`). PRs that don't touch backend skip the
#     image build by design — the Dockerfile + dep-resolution gate only
#     needs to run when its inputs change. Repeating the build here
#     would double the cost for backend PRs and add zero signal for
#     non-backend PRs.
#   * Alembic backward-compat guard -> .github/workflows/migration-compat.yml
#     (path-scoped to backend/alembic/versions/**, runs only when
#     migrations change).
#   * Chart publish / sign          -> .github/workflows/chart.yml
#     (publish runs only on main + tag pushes; chart.yml's `validate`
#     job runs on PRs too as a path-scoped gate. This workflow's
#     helm job exercises the same lint+template+kubeconform pass
#     unconditionally so a chart-touching regression also fails the
#     central CI check operators see in branch protection.)
#   * Dependency license scan       -> .github/workflows/dependency-license-check.yml
#     (path-scoped to manifest changes).
#   * Secret + supply-chain scans   -> secret-scan.yml + security-scan.yml.
#
# The workflow name is `CI` so it satisfies the `workflow_run:
# workflows: ["CI"]` dependency in quality-gate.yml (SonarCloud's
# Clean-as-You-Code gate). The dedicated `python-coverage` job (push to
# main only) uploads `coverage.xml` as a `python-coverage` artifact so
# the downstream SonarCloud scan can ingest it — quality-gate.yml's
# `actions/download-artifact` step references that exact name. The
# required unit lane (`python-lint-test`) is intentionally NO-cov: see
# that job and #1982 — running the unit suite under coverage OOM-kills
# the memory-limited heavy runner, so coverage was split into its own
# push-only, non-required, continue-on-error job (#1987).
#
# Fail-loud posture (per Goal #11 + devops_best_practices "no
# continue-on-error on linters or tests"): every step that asserts a
# contract is allowed to fail the job. The continue-on-error in this
# file is confined to coverage: the whole `python-coverage` job is
# job-level continue-on-error (a coverage OOM degrades to "no
# coverage for this push" and never fails the CI run conclusion —
# which would otherwise also suppress quality-gate.yml's
# workflow_run), and the artifact-upload step inside it is
# step-level continue-on-error. SonarCloud already guards its own
# download with continue-on-error.
#
# All third-party actions pinned to immutable SHAs with the
# human-readable tag in a trailing comment (devops_best_practices:
# SHA-pin every action). Same SHAs as the publish workflows where the
# action overlaps, so a single supply-chain audit covers all of CI.
#
# Merge queue (#769): the `merge_group` event fires when a PR is admitted
# to the GitHub merge queue. Required checks configured in the merge-queue
# ruleset run against the actual merge result (PR head + current main +
# any ahead-in-queue PRs), so a semantically-broken combination is caught
# before it reaches main — ending the inherited-red episodes from
# 2026-05-20/21. The concurrency group is intentionally NOT set to
# cancel-in-progress on merge_group runs: a cancelled queue check fails
# the merge attempt and defeats the queue's purpose. cancel-in-progress
# is scoped to pull_request / push refs only so PR force-pushes and rapid
# main pushes still cancel their predecessors cleanly.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Fires when a PR enters the merge queue. Runs the full check matrix
  # against the synthesised merge commit (PR + current main tip +
  # any ahead-in-queue PRs). This is the gate that prevents a
  # stale-but-green PR from landing a broken combination on main.
  merge_group:

permissions:
  contents: read

concurrency:
  # On push to main: one in-flight CI run per ref so a fast follow-up
  # commit cancels its predecessor. On PRs: scoped per PR ref so an
  # author force-push cancels its own prior CI run cleanly. Mirrors
  # the pattern used by image.yml, chart.yml, and cli-release.yml.
  #
  # IMPORTANT: already-running merge_group jobs must NEVER be cancelled.
  # A cancelled queue check causes the merge attempt to fail and the PR
  # falls out of the queue — defeating the whole point of the merge queue.
  # The conditional below restricts cancel-in-progress to pull_request /
  # push contexts only. Queued (not-yet-started) merge_group runs can
  # still be displaced by newer queue entries; that is expected behaviour.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  changes:
    name: Detect migration-related changes
    # Emits `migrations=true` when a PR touches migration-related files,
    # so the required `python-migration-tests` job runs only then. On
    # push / merge_group it emits `true` unconditionally, so the required
    # check is never left Pending on a non-PR event.
    #
    # WHY a `changes`-job + job-level `if:` and NOT `on.paths` (#2140):
    # GitHub treats a job skipped by its own `if:` as **Success** (it
    # satisfies a required status check), whereas a whole workflow
    # skipped by a path filter stays **Pending** and blocks merge. For a
    # *required* test check the `if:` gate is the only shape that skips
    # cleanly. There is no in-repo precedent — chart.yml uses
    # `on.pull_request.paths` (fine for a publish workflow, wrong here).
    #
    # Same fork-PR guard as the other jobs; the dependent test job's
    # `if:` re-checks head.repo too.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: meho-runners-ci
    timeout-minutes: 5
    outputs:
      migrations: ${{ steps.detect.outputs.migrations }}
    steps:
      - name: Checkout
        # fetch-depth: 0 so the PR base commit is present for the
        # three-dot diff below (the default shallow fetch would not
        # reach the merge-base).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect migration-related changes
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "non-PR event (${{ github.event_name }}) -> migrations=true"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          # Files that make the migration suite meaningful to run: the
          # alembic tree, the relocated migration test suite, the db
          # migrate/migrations modules under test, the compat script, and
          # the workflows that define this gate.
          changed="$(git diff --name-only "${base}"...HEAD)"
          if printf '%s\n' "${changed}" | grep -qE '^(backend/alembic/|backend/tests/migrations/|backend/src/meho_backplane/db/(migrations|migrate)\.py$|scripts/ci/check_migration_compat\.py$|\.github/workflows/(ci|migration-compat)\.yml$)'; then
            echo "migration-related change detected -> migrations=true"
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "no migration-related change -> migrations=false"
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

  python-lint-test:
    name: Python (ruff + mypy + pytest)
    # Fork-PR guard: never execute project code from a fork on the
    # self-hosted runner pool. Mirrors image.yml + chart.yml's stance —
    # `runs-on: meho-runners-ci` is internal infra, so fork PRs skip
    # entirely. Push events (main) short-circuit the OR via
    # github.event_name != 'pull_request'. Job-level (not step-level)
    # so no step ever starts on a fork PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Dedicated heavy ARC scale set (6000m requests=limits, max 5 pods)
    # for the unit suite only — #761. The other jobs (Go, Helm,
    # integration) stay on the 4-core `meho-runners-ci` pool; only the
    # pytest sweep is CPU-bound enough to want the extra cores. Heavy
    # pool scales from 0, so an idle period costs one cold-start on the
    # next run. Provisioned RDC-side in rdc-gitops#55.
    runs-on: meho-runners-ci-heavy
    # 25-min cap (raised from 20): the unit lane was OOM-killed on the heavy
    # runner near end-of-run (null Pytest step, no log, `failure`, ~17-21 min,
    # NOT reproducible locally, worker-count-independent). Root cause + fix are
    # detailed in the perf-budget `run:` block: coverage's combine peaked the
    # pytest tree at 13.67 GiB (vs 7.86 GiB without), over the pod's memory
    # limit; the fix drops `--cov` from this gate and keeps -n 3 (lower base
    # memory). No-cov -n 3 wall is ~13-18 min, so 25 min keeps a hang-backstop
    # margin above the budget_s early-warning gate. ~8m33s with --cov+sysmon was
    # the pre-growth -n 4 wall (run 26245676016).
    # History: the combined serial sweep once blew the 10→20→40→50-min caps
    # (runs 25910787068, 25970564527, 25972807988, 25987329377,
    # 25992737115) before the integration split (#570), xdist
    # (#585/#603), and the #799 re-embed fix landed; the 50-min cap was
    # generous headroom from that era. Job name is intentionally unchanged so
    # the existing branch-protection required check stays satisfied.
    timeout-minutes: 25
    env:
      # Surfaced as a job-level env var purely so the Docker Hub login
      # step can test it in an `if:`. The `secrets` context is NOT
      # available in a step-level `if:` (GitHub's context-availability
      # table allows it in `with:` / `env:` / `run:` only), so reading
      # the secret through `env` is what makes the guard evaluatable.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # Route testcontainers pulls through the in-cluster Harbor proxy
      # cache (claude-rdc-hetzner-dc#463; project `dockerhub-proxy` public,
      # anonymous consumer auth, wired into runner DinD via
      # meho-internal#75). The test code reads these env vars with a
      # docker.io short-name default — see backend/tests/test_db_engine.py
      # `MEHO_TEST_PGVECTOR_IMAGE`, backend/tests/test_broadcast_client.py
      # `MEHO_TEST_VALKEY_IMAGE`, backend/tests/integration/
      # test_connectors_vmware_rest_vcsim.py `MEHO_TEST_VCSIM_IMAGE` —
      # so the env-only swap requires no source-code changes.
      # `docker/login-action` below stays load-bearing until #78's Half
      # B sees a green cache-hit week and retires it.
      MEHO_TEST_PGVECTOR_IMAGE: harbor.evba.lab/dockerhub-proxy/pgvector/pgvector:pg16
      MEHO_TEST_VALKEY_IMAGE: harbor.evba.lab/dockerhub-proxy/valkey/valkey:8
      # vcsim pinned to an explicit release tag (same rule as the
      # pgvector/valkey/Vault rows — never `:latest`) so the
      # vmware-rest acceptance tests are reproducible and an upstream
      # image push can't break or silently alter CI without a commit.
      # v0.55.1 is what `:latest` resolved to at pin time
      # (digest sha256:fcca7b87bfb16c3f7b8c8aa94d9d95855891c86fcb216bd6d8dc7b27af385085).
      MEHO_TEST_VCSIM_IMAGE: harbor.evba.lab/dockerhub-proxy/vmware/vcsim:v0.55.1
      # Vault dev-mode container for the G3.3-T7 kv/sys/auth e2e suite
      # (backend/tests/integration/test_connectors_vault_dev_e2e.py).
      # Same env-knob shape as the rows above: the test reads this with
      # a docker.io short-name default (`hashicorp/vault:1.18`), so the
      # Harbor-proxy swap is config-only — no source change. Pinned to
      # the 1.18 LTS minor (not `:latest`) so an upstream Vault release
      # never breaks an unrelated PR.
      MEHO_TEST_VAULT_IMAGE: harbor.evba.lab/dockerhub-proxy/hashicorp/vault:1.18
      # #2949 — vendor vCenter spec-shelf wiring (see the checkout step
      # below + docs/decisions/vendor-spec-ci-provisioning.md).
      # SPEC_SHELF_TOKEN_PRESENT surfaces *presence* of the
      # SPEC_SHELF_TOKEN secret as a job-level boolean so the shelf
      # checkout step can gate on it — the `secrets` context is NOT
      # available in a step-level `if:` (same constraint the
      # DOCKERHUB_USERNAME row above works around). Unlike that row,
      # only the presence flag is surfaced, never the token value, so
      # the secret is not exported into every step's environment.
      SPEC_SHELF_TOKEN_PRESENT: ${{ secrets.SPEC_SHELF_TOKEN != '' }}
      # Points the vCenter spec resolvers (tests/acceptance/
      # _vcenter_spec.py + tests/integration/test_operations_ingest_
      # vcenter.py) at the spec-shelf checkout. Set UNCONDITIONALLY:
      # when the shelf checkout was skipped (secret absent — fork PRs,
      # Dependabot runs, not-yet-provisioned repos) the directory does
      # not exist, the resolvers return None, and the spec-backed lanes
      # pytest.skip exactly as they did before #2949. When the checkout
      # ran, the seconds-cheap reconcile lanes run for real in this job;
      # the G0.7 canary's full-ingest tests are opted out here and run
      # armed in python-integration instead (#2980 — see this job's
      # MEHO_SKIP_SPEC_INGEST_TESTS env row). The docs-root form (not
      # MEHO_VCENTER_OPENAPI_VCENTER / _VI_JSON) is deliberate: it is
      # the only single setting that lights every spec lane, because
      # test_operations_ingest_vcenter.py predates the explicit
      # per-file env vars and reads only the legacy var or this root.
      MEHO_CONSUMER_DOCS_ROOT: ${{ github.workspace }}/spec-shelf/docs
    defaults:
      run:
        # backend/ is the only Python project today; pyproject.toml
        # and uv.lock both live here.
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout vendor vCenter spec-shelf (secret-gated, #2949)
        # The vSphere OpenAPI specs (vcenter.yaml ~961 paths,
        # vi-json.yaml ~2,195 paths) are Broadcom/VMware
        # vendor-licensed and deliberately NOT committed to this public
        # repo — they live in the operator's private spec-shelf repo.
        # This step fetches ONLY the pinned vcenter-9.0 shelf directory
        # into the ephemeral runner workspace so the real-spec
        # ingest/reconcile lanes stop skipping. Licensing record +
        # provisioning runbook (secret scope, signoff gate):
        # docs/decisions/vendor-spec-ci-provisioning.md. The specs are
        # never committed, never uploaded as artifacts (the
        # upload-artifact steps in this workflow enumerate exact
        # coverage files only), and never printed to logs.
        #
        # SPEC_SHELF_TOKEN is a fine-grained PAT: Contents read-only on
        # the single private shelf repo, nothing else. Secret absent →
        # this step skips → the spec lanes pytest.skip exactly as
        # before this step existed. Fork PRs never reach this step (the
        # job-level fork guard skips the whole job) and would not see
        # the secret anyway (GitHub withholds secrets from fork-PR
        # runs). Dependabot runs read the Dependabot secret store,
        # where this secret is deliberately not mirrored, so they skip
        # too.
        if: env.SPEC_SHELF_TOKEN_PRESENT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: evoila-bosnia/claude-rdc-hetzner-dc
          token: ${{ secrets.SPEC_SHELF_TOKEN }}
          path: spec-shelf
          # Cone-mode sparse checkout of the shelf directories only +
          # lazy blob filter: the runner materialises just the pinned
          # spec files (~20 MB), not the whole consumer repo. No `ref:`
          # pin — the shelf's default branch IS the operator-curated
          # pin (the directories are version-named, e.g. vcenter-9.0/),
          # matching the local-dev contract documented in
          # tests/acceptance/_vcenter_spec.py. Keep the list sorted.
          sparse-checkout: |
            docs/sddc-manager-9.0
            docs/vcenter-9.0
          filter: blob:none
          # Read-only consumer; never pushes. Don't leave the token in
          # the shelf clone's local git config after checkout.
          persist-credentials: false

      - name: Verify spec-shelf provisioned the pinned vCenter specs
        # Fail-loud layout guard: once the secret exists, a shelf
        # layout move (or a sparse-checkout typo here) must fail THIS
        # job — otherwise the resolvers would return None and the spec
        # lanes would silently go back to skipping, undetected (the
        # exact regression #2949 closes). Without the secret this step
        # skips and lane-skip stays the documented degraded mode.
        # Prints file *presence* only — never spec content.
        if: env.SPEC_SHELF_TOKEN_PRESENT == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for f in spec-shelf/docs/sddc-manager-9.0/sddc-manager-openapi.json spec-shelf/docs/vcenter-9.0/vcenter.yaml spec-shelf/docs/vcenter-9.0/vi-json.yaml; do
            if [ ! -f "$f" ]; then
              echo "::error title=Spec-shelf layout drift::${f} missing after the spec-shelf checkout — the real-spec lanes would silently skip. Fix the shelf layout or this workflow's sparse-checkout path."
              exit 1
            fi
          done
          echo "spec-shelf OK: sddc-manager-openapi.json + vcenter.yaml + vi-json.yaml present under spec-shelf/docs/"

      - name: Docker Hub login (for testcontainers pulls)
        # Pulls inside the DinD daemon (testcontainers PostgresContainer
        # spinning up pgvector/pgvector:pg16 for test_db_engine.py /
        # test_migration_rollback.py / tests/integration/*, plus
        # vmware/vcsim for the G3.1-T8 vmware-rest acceptance tests
        # under tests/acceptance/test_vmware_rest_*.py) share the
        # ARC cluster's NAT egress IP, which exhausts Docker Hub's
        # 100/6h anonymous bucket. Authenticated Personal-tier doubles
        # it to 200/6h
        # (https://docs.docker.com/docker-hub/usage/pulls/). Same
        # org-level secrets security-scan.yml uses, provisioned at
        # the evoila org level (visibility `all`) with 1Password
        # vault custody — see meho-internal#74 for the regression
        # context this addresses, and meho-internal
        # `docs/dockerhub-ci-credential-custody.md` for where the
        # credential actually lives and how to rotate it (the vault
        # and item names stay in the internal repo; this one is
        # public). Long-term, the in-cluster proxy cache from
        # claude-rdc-hetzner-dc#463 retires this step.
        #
        # The `if:` guard is what keeps Dependabot PRs green. A
        # Dependabot-triggered run reads the *Dependabot* secret store,
        # not the Actions one, so `secrets.DOCKERHUB_USERNAME` is empty
        # there — and `docker/login-action` hard-fails with "Username and
        # password required" instead of no-opping, which failed this job
        # (and every other job carrying this step) on all 19 open
        # Dependabot PRs. Skipping the login is safe: every image above
        # resolves through the harbor.evba.lab proxy cache, so an
        # unauthenticated run still pulls — it only gives up the Docker
        # Hub rate-limit headroom the login buys.
        #
        # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN have since been mirrored
        # into the *org-level* Dependabot secret store (visibility
        # `all`, 2026-07-30), so on a Dependabot run this guard now
        # evaluates true and the login proceeds as it does anywhere
        # else. Keep the guard regardless: it is what stops a missing
        # or rotated secret from hard-failing an entire job instead of
        # degrading to unauthenticated pulls. If this step starts
        # *skipping* on Dependabot PRs again, the org Dependabot secret
        # is gone or expired — check there before touching the workflow.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install uv
        # uv is the project's canonical Python toolchain (pyproject.toml
        # locks a uv.lock, not a requirements.txt). enable-cache: true
        # opts into the action's built-in cache for the uv download
        # cache directory, keyed by uv.lock — repeat installs on the
        # same lockfile are near-instant. version unset -> latest, which
        # is fine because uv ships a strict resolver and the lockfile
        # pins every transitive dep.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Sync Python environment (locked)
        # --locked refuses to update uv.lock; if pyproject.toml drifted
        # from the lock, CI fails here rather than silently bumping
        # deps. --all-groups pulls dev tools (ruff, mypy, pytest, etc.)
        # declared in [dependency-groups.dev].
        run: uv sync --locked --all-groups

      - name: Ruff check (lint)
        # ruff config lives in backend/pyproject.toml [tool.ruff.lint].
        # Targets the src/ + tests/ trees the project ships.
        run: uv run ruff check src/ tests/

      - name: Ruff format --check
        # Format gate — non-zero exit if any file would be reformatted.
        # Authors run `uv run ruff format` locally before pushing.
        run: uv run ruff format --check src/ tests/

      - name: Mypy (strict)
        # [tool.mypy] in pyproject.toml is `strict = true` against
        # files = ["src"]. Per-dep ignores (authlib, hvac, requests)
        # are already declared there.
        run: uv run mypy src/

      - name: Cache fastembed model (drift-guard + slow-lane)
        # The drift-guard below downloads the ~67 MB default ONNX model
        # from HuggingFace. Without this cache every run re-fetches it
        # unauthenticated over the cluster's shared NAT egress (HF
        # rate-limits anonymous pulls) — pure repeated cost on the
        # slowest required job. Key on uv.lock: fastembed's version is
        # pinned there, so a fastembed bump (which can remap the HF
        # source/filename) misses the cache and the model re-downloads
        # exactly once, then re-saves. restore-keys lets an unrelated
        # lock change still reuse the prior model blob.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.fastembed-cache
          key: fastembed-model-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            fastembed-model-${{ runner.os }}-

      - name: Embedding-model drift guard (evoila/meho#574)
        # Regression guard for #574: actually instantiate
        # TextEmbedding(DEFAULT_EMBEDDING_MODEL) + run one real embed,
        # so a fastembed<->model-repo drift (the model repo dropping
        # `model_optimized.onnx`, fastembed remapping the HF source,
        # an incompatible fastembed bump, …) fails THIS PR instead of
        # CrashLooping in production on a clean deploy. Green ci.yml on
        # a runtime-fetched model cannot catch this; this step does.
        # The image build runs the same module to BAKE the model
        # (backend/Dockerfile); here we only assert, into the cached
        # workspace dir (the runner sandbox can't write `/opt`).
        # HF_TOKEN (if the secret is configured) authenticates the
        # download for higher HF rate limits + faster pulls; absent →
        # empty → anonymous (current behaviour, no regression).
        env:
          MEHO_WARM_CACHE_DIR: ${{ github.workspace }}/.fastembed-cache
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python -m meho_backplane.retrieval.warm

      - name: Provision spaCy NLP model for Presidio Tier-2 (#1072)
        # G11.4-T3 (#1072) ships the Tier-2 Presidio NER adapter
        # (capability-flagged per policy). The acceptance gate
        # (``Tier-2 redacts a free-text field containing a person
        # name / IP / FQDN``) requires a spaCy model on the host;
        # spaCy ships no model out of the box and Presidio's
        # AnalyzerEngine raises ``Tier2NotAvailableError`` without one.
        # ``en_core_web_sm`` (~12 MB) is the fast-CI choice; production
        # Docker images bake ``en_core_web_lg`` (~560 MB, the Presidio
        # documented default for higher NER recall). The acceptance
        # tests in tests/test_redaction_presidio.py and the Tier-2
        # middleware test gate on ``spacy.util.is_package(...)``,
        # accepting either model -- so this step suffices for the
        # unit lane's correctness signal without paying the ``lg``
        # download wall every run.
        #
        # ``MEHO_REDACTION_SPACY_MODEL`` is the runtime override the
        # presidio.py adapter reads; setting it here pins the unit
        # job's engine to the ``sm`` model regardless of the
        # adapter's default. Production deployments leave the env
        # unset and let the adapter pick the documented default.
        run: |
          uv run python -m spacy download en_core_web_sm
          # Smoke-test the import path so a presidio<->spacy model-
          # version mismatch fails THIS PR, not the integration lane.
          MEHO_REDACTION_SPACY_MODEL=en_core_web_sm \
            uv run python -c "from meho_backplane.redaction import get_engines; get_engines('en')"

      - name: Pytest (unit + coverage)
        env:
          # Pin Tier-2's spaCy model to the unit-lane choice so the
          # acceptance tests in test_redaction_presidio.py + the
          # tier2 path in test_redaction_middleware.py exercise the
          # real engine path instead of skipping. The integration
          # lane stays on the adapter's documented default
          # (en_core_web_lg) once that lane provisions the heavier
          # model.
          MEHO_REDACTION_SPACY_MODEL: en_core_web_sm
          # Lane placement (#2980): opt this sweep out of the G0.7
          # canary's full-ingest spec tests. With the spec shelf armed
          # (#2949/#2966) each of those tests re-runs the full two-spec
          # ingest (~3,470 ops through parse + register + embedding +
          # grouping — the fixture is function-scoped by design), which
          # took the whole sweep from 478 s (2026-08-17 16:57Z, canary
          # still erroring fast) past this job's 25-min cap (four
          # consecutive timeout kills on head eaccb895, the last on a
          # quiet cluster with pytest at 81% and progressing). Per this
          # workflow's perf-budget discipline (#898/#793/#827): the slow
          # path is relocated, not the cap raised. The canary's
          # full-ingest tests run armed in the python-integration job
          # (which selects the file explicitly, see its Pytest step);
          # its fixture-less self-checks and every seconds-cheap
          # reconcile lane stay in this sweep. Honored by a
          # collection-time skipif marker in tests/acceptance/
          # test_g07_vsphere_canary.py (fixture-level backstop in
          # vcenter_spec_path); rule of record in
          # docs/decisions/spec-reconcile-guards-standard.md.
          MEHO_SKIP_SPEC_INGEST_TESTS: "1"
        # PARALLELIZED via pytest-xdist (#585 unblocked this). The
        # serial sweep was the job's dominant cost (~49 min in CI vs
        # ~5 min local). #585 added process-wide global-registry
        # snapshot/restore + deterministic MCP-module import in
        # tests/conftest.py, eliminating the cross-module isolation
        # leaks that previously made `-n auto` red on
        # test_mcp_registry / test_audit_middleware. Controlled
        # same-commit proof (acceptance of #585): serial 2007/0/0 and
        # `-n auto --dist loadscope` 2007/0/0 — identical, empty
        # failure set; local wall-clock serial 10:18 → xdist 6:14
        # (limited by core count; CI multi-core gets the ~49→~10 min).
        # Worker count is -n 3 (lowered -n 6 → -n 4 per #1901 for CPU starvation,
        # then -n 4 → -n 3 for MEMORY headroom when the lane OOM-killed the pod —
        # see the root-cause analysis in the perf-budget `run:` block below; fewer
        # workers => lower base memory). The original -n 6 reasoning, kept
        # for context: pinned, matched to the dedicated `meho-runners-ci-heavy`
        # scale set's 6000m guaranteed cores (#761). History: -n auto
        # was inconsistent on the shared 4-core pool (run 26164020459
        # reported 4 workers, a later same-day push reported 8 — cgroup
        # detection drift), so #726 pinned -n 3 (N-1, leaving a core for
        # the coordinator + DinD on the burstable 4-core pool). The heavy
        # pool is QoS Guaranteed (requests=limits=6000m), so the
        # host-core-detection ambiguity is gone and the headroom math
        # changes: 6 workers fully subscribe the pod. The xdist
        # coordinator is mostly IPC-blocked and DinD is near-idle during
        # pure-CPU test execution (testcontainers pgvector/valkey only
        # burst at spin-up — see MEHO_TEST_PGVECTOR_IMAGE env above), so
        # full subscription is the intended trade. If the #761 wall/
        # variance measurement shows oversubscription symptoms (high
        # variance, wall not improving vs -n 3), drop to -n 5 (N-1) as
        # the fallback.
        # RULE — pytest-xdist -n vs runner CPU (#1983): -n must stay BELOW
        # the runner container's usable cores, leaving at least one core for
        # the GHA agent + xdist coordinator. The fix for "runner lost
        # communication" / heartbeat starvation is burst headroom on the
        # pod's CPU *limit* (rke2-ci heavy pool target: request 4000m /
        # limit 7000m, pending evoila-bosnia/rdc-gitops#70 — currently
        # 6000m requests=limits), not a smaller -n. That is why
        # -n 6 → 4 → 3 never fixed the heartbeat failures against the hard
        # 6-core cap: the pod had no burst slack, and with requests=limits
        # the kernel enforces the cap via cgroup CPU quota (100% throttle),
        # so the GHA agent misses its heartbeat and GitHub kills the job
        # even though the nodes were at ~0% CPU. Until rdc-gitops#70 lands,
        # do not raise -n above the current value to chase wall-clock
        # improvements — the symptom will return. Raise the CPU *limit*
        # instead.
        # --dist loadscope: a module's
        # tests stay on one worker so module-/session-scoped fixtures
        # (testcontainers PG, embedding service) instantiate per
        # worker, not per test. --maxfail=1 preserves the old `-x`
        # fast-fail (xdist ignores `-x`). --ignore=tests/integration →
        # the container-heavy subtree runs in the sibling
        # `python-integration` job.
        # COVERAGE REMOVED from this required gate (was `COVERAGE_CORE=sysmon
        # ... --cov=meho_backplane --cov-report=xml`). The xdist coverage combine
        # peaked the pytest tree at 13.67 GiB (vs 7.86 GiB without — measured via
        # cgroup memory.peak at -n 3, 8243 passed), OOM-killing the heavy runner
        # pod near end-of-run and leaving the lane red on main for every PR. The
        # +5.8 GiB is coverage's session-end merge (all workers' data + the
        # controller's combine, co-resident); the coverage config has no
        # per-test contexts to trim (only `[tool.coverage.run] relative_files`).
        # Coverage was non-blocking anyway — quality-gate.yml is whole-job
        # continue-on-error and a missing/late artifact never blocks merge — so
        # dropping it to keep this gate GREEN is the right priority over the
        # SonarCloud Clean-as-You-Code decoration it fed. FOLLOW-UP: restore that
        # decoration memory-safely (offline `coverage combine`+`xml` after the
        # xdist workers exit; a push-only serial-cov job; or a larger-memory
        # pool). History (for whoever restores it): cov on PR+push came from
        # #726/#771/#793/#799 after the #799 re-embed fix made --cov ~+1 min, and
        # COVERAGE_CORE=sysmon (PEP 669, coverage.py 7.4+, lock 7.14) halved the
        # tracer tax with line counts matching the C tracer (2913/11832).
        run: |
          # Perf-budget guard — early warning for CI-perf creep (the #898 / G3.6
          # timeout class). The Goal #11 unit budget is 10 min, but it was
          # aspirational (comment-only): the G3.6 batch crept 9.3 -> 19 min and
          # nothing failed until the 20-min `timeout-minutes` cliff, blocking a
          # release. This step measures the pytest wall, always prints it (trend
          # visibility), and FAILS at the budget — well below the hard cap, so a
          # regression is caught at the PR that causes it, not at release time.
          # `timeout-minutes` stays as the hang backstop.
          # MEASURE before raising budget_s (see #793/#827/#898): re-run with
          #   MEHO_FIXTURE_TIMING_FILE=/tmp/fixt MEHO_LIFESPAN_TIMING=/tmp/lifespan
          # then `uv run python tests/_perf_timing_report.py` to attribute the wall.
          # ROOT CAUSE (corrected): the unit lane died with a null Pytest step,
          # no log, `failure`, at ~17-21min on the heavy runner — NOT reproducible
          # locally and worker-count-INDEPENDENT (it recurred identically after
          # -n 4 → -n 3, just ~3min later in wall-clock). That rules out the #1901
          # CPU-starvation class and points at an OOM kill of the runner pod near
          # end-of-run. Measured peak memory of the pytest tree (cgroup memory.peak,
          # -n 3, 8243 passed): 13.67 GiB WITH `--cov`+sysmon vs 7.86 GiB WITHOUT —
          # coverage's combine (all xdist workers' data + the controller's merge,
          # co-resident at session end) adds ~5.8 GiB and tips the pod over its
          # memory limit (<13.67 GiB; the lane passes on a 62 GiB dev box). The
          # alembic migration round-trip cluster (schema 0048+, each reversibility
          # test replays the whole upgrade→downgrade chain — ~45 of the slowest 60
          # tests) plus the new /ui console wave grew both wall AND peak until cov
          # pushed it over. FIX: drop `--cov` from this required gate (peak 13.67 →
          # 7.86 GiB) and keep -n 3 (fewer workers => lower base memory: ~7.86 GiB
          # vs ~10 GiB at -n 4) for headroom. Coverage is non-blocking by design
          # (quality-gate.yml is whole-job continue-on-error; a missing artifact only
          # degrades the SonarCloud signal, never blocks merge) — so dropping it to
          # keep the gate GREEN is the right priority. FOLLOW-UP: restore SonarCloud
          # coverage memory-safely (offline `coverage combine`+`xml` after workers
          # exit, a push-only serial-cov job, or a larger-memory pool). budget_s set
          # to 1320 for the no-cov -n 3 wall (local 816s/13:34; runner expected
          # ~15-18min) with creep-detection headroom, under the 25-min timeout.
          budget_s=1320
          start=$(date +%s)
          uv run pytest -n 3 --dist loadscope --maxfail=1 --ignore=tests/integration --ignore=tests/migrations tests/
          dur=$(( $(date +%s) - start ))
          echo "::notice title=Unit pytest wall::${dur}s (budget ${budget_s}s = no-cov -n 3 wall; hard cap = job timeout-minutes)"
          if [ "$dur" -gt "$budget_s" ]; then
            echo "::error title=Unit perf budget exceeded::unit pytest ${dur}s > budget ${budget_s}s. Early-warning gate for CI-perf creep (#898 / G3.6 class). MEASURE the slow path before raising budget_s: MEHO_FIXTURE_TIMING_FILE + MEHO_LIFESPAN_TIMING + tests/_perf_timing_report.py (#793/#827). Amortize the cost; do not just bump the budget."
            exit 1
          fi
        # NOTE: this required lane no longer uploads a coverage artifact —
        # #1982 dropped `--cov` here (OOM) and the dead `hashFiles(coverage.xml)`-
        # guarded upload step was removed in #1987. The SonarCloud coverage
        # artifact is now produced by the dedicated `python-coverage` job below.

  python-coverage:
    name: Python coverage (SonarCloud)
    # Restores the SonarCloud Clean-as-You-Code coverage artifact that #1982
    # had to drop from the required unit lane to stop the OOM kill. This job
    # is deliberately:
    #   * PUSH-TO-MAIN ONLY by default (`github.event_name == 'push'`) — PRs
    #     stay fast/no-cov; SonarCloud decoration updates "one merge late" (the
    #     pre-#771 behaviour, the accepted trade in #1987). Not run on PRs
    #     (no per-PR suite double-run) and not in the merge queue. The ONE
    #     exception is an opt-in `ci-coverage-validate` PR label: a PR carrying
    #     that label also runs this job, so a change to the coverage path
    #     itself can be proven green + artifact-producing on the real
    #     `meho-runners-ci-heavy` pod (where the OOM reproduces) BEFORE it
    #     merges — without paying the double-suite cost on every other PR.
    #     Remove the label once validated; routine PRs never carry it.
    #   * NON-REQUIRED + whole-job continue-on-error (#1987 AC5) — it is NOT
    #     in branch protection's required contexts, AND continue-on-error
    #     means a coverage-job FAILURE (OOM, red tests, step timeout) is
    #     absorbed: the job itself still reports conclusion `failure` (jobs
    #     API, observed on run 30925197316), but it never fails the overall
    #     CI run conclusion. That matters twice: a red coverage job must not
    #     block merge (it can't — push runs after merge — but defence in
    #     depth), and it must not flip the CI run's `conclusion` to
    #     `failure`, which would suppress quality-gate.yml's `workflow_run`
    #     (it only runs on `conclusion == 'success'`).
    #     CAUTION (#2800): continue-on-error absorbs *failure* only —
    #     cancellation leaks through. A JOB-level `timeout-minutes` expiry
    #     CANCELS the job, and the `cancelled` conclusion propagated to the
    #     whole run (observed three times on 2026-08-04, run 30902356757),
    #     suppressing quality-gate.yml exactly like a `failure` would and
    #     tripping docs/RELEASING.md's "cancelled ≠ green" pre-flight.
    #     Hence the hang backstop lives on the pytest STEP (step timeout →
    #     step failure → job failure → absorbed); the job-level cap is only
    #     the outer backstop — see the timeout-minutes comment below.
    #
    # WHY OFFLINE COMBINE + LOW PARALLELISM (the memory story, measured for
    # #1987; methodology = #1982's: systemd-run --user --scope, cgroup
    # memory.peak, full unit suite, 8306 passed):
    #   | config                   | peak       | wall   |
    #   | no-cov -n 3 (#1982)      | 7.86 GiB   | 13:34  |
    #   | offline-cov -n 3        | 14.03 GiB  | 15:19  |
    #   | offline-cov -n 2        | 13.17 GiB  | 20:42  |
    #   | offline-cov -n 1        | 12.48 GiB  | 35:32  |
    # The coverage tax (~4.6 GiB even fully serial) is INTRINSIC — the
    # in-memory line-coverage map over the whole meho_backplane package
    # across 8306 tests — and barely shrinks with xdist worker count, so the
    # session-end combine is NOT the peak (offline combine alone did not
    # avoid the OOM at -n 3). The lever that actually fits the pod is dropping
    # base suite memory via low parallelism: -n 1 peaks at 12.48 GiB, ~1.2 GiB
    # under the <13.67 GiB pod limit that #1982's --cov run (13.67 GiB) tripped.
    # The "offline" shape (per-worker parallel data + `coverage combine`/`xml`
    # AFTER pytest exits, pytest invoked with `-p no:cov` so pytest-cov's
    # in-process combine never runs) keeps the combine memory-cheap regardless.
    # If the suite grows enough to push -n 1 over the limit, the durable fix is
    # a larger-memory runner pool (infra, out of band) — this job is
    # non-blocking so an OOM merely skips one coverage upload until then.
    # Runs on push to main, OR on a PR explicitly opted in via the
    # `ci-coverage-validate` label (the on-runner validation escape hatch
    # described above). The fork-PR guard still applies on the PR path so
    # fork code never executes on the self-hosted pool.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'ci-coverage-validate'))
    runs-on: meho-runners-ci-heavy
    # TODO(ops): the durable fix for the recurring ~47-min OOM / runner-loss on
    # this pool (which silently killed coverage on every main push from
    # 2026-06-20, collapsing SonarCloud coverage 65.8% -> ~24%; see the memory
    # table above and docs/codebase/sonarcloud.md) is a larger-memory runner pool
    # — a gha-runner-scale-set on the rke2-ci cluster (ops-owned, out of band).
    # Move this `runs-on:` to the new pool once provisioned. Until then an OOM
    # skips one coverage upload; quality-gate.yml now makes that skip
    # fail-visible via an error annotation (#2513).
    # Two-layer timeout (#2800). The hang backstop is the pytest step's own
    # `timeout-minutes: 45` (~36-min serial wall + creep headroom): a step
    # timeout is a step FAILURE (the runner kills the process and annotates
    # "timed out after 45 minutes"), which the whole-job continue-on-error
    # absorbs — run conclusion stays `success`. This job-level cap is
    # strictly the OUTER backstop for a wedged non-pytest step (checkout /
    # uv sync / model warm — never observed; both 2026-08-04 hangs were in
    # pytest). It must stay comfortably above step cap + pre-pytest setup
    # (35–75 s observed) + combine/upload (~15 s) so the step timeout
    # always fires first for a pytest hang — a job-level expiry CANCELS
    # the job, and `cancelled` leaks past continue-on-error into the run
    # conclusion. Neither cap is a perf budget: the job is push-only and
    # non-blocking, so a long wall never gates a PR.
    timeout-minutes: 55
    continue-on-error: true
    env:
      # Surfaced as a job-level env var purely so the Docker Hub login
      # step can test it in an `if:`. The `secrets` context is NOT
      # available in a step-level `if:` (GitHub's context-availability
      # table allows it in `with:` / `env:` / `run:` only), so reading
      # the secret through `env` is what makes the guard evaluatable.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      MEHO_TEST_PGVECTOR_IMAGE: harbor.evba.lab/dockerhub-proxy/pgvector/pgvector:pg16
      MEHO_TEST_VALKEY_IMAGE: harbor.evba.lab/dockerhub-proxy/valkey/valkey:8
      # vcsim release-tag pin — see the comment on the first
      # MEHO_TEST_VCSIM_IMAGE occurrence (backend-tests job) for why.
      MEHO_TEST_VCSIM_IMAGE: harbor.evba.lab/dockerhub-proxy/vmware/vcsim:v0.55.1
      MEHO_TEST_VAULT_IMAGE: harbor.evba.lab/dockerhub-proxy/hashicorp/vault:1.18
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Docker Hub login (for testcontainers pulls)
        # Empty-secret guard — see the python-tests job's login step for
        # why Dependabot runs need it.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Sync Python environment (locked)
        run: uv sync --locked --all-groups

      - name: Cache fastembed model (drift-guard + slow-lane)
        # Same shared model cache the required lane uses — the unit suite this
        # job re-runs instantiates the embedding model, so it must be warm here
        # too. Keyed identically so the two jobs share one cache entry.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.fastembed-cache
          key: fastembed-model-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            fastembed-model-${{ runner.os }}-

      - name: Embedding-model drift guard (evoila/meho#574)
        env:
          MEHO_WARM_CACHE_DIR: ${{ github.workspace }}/.fastembed-cache
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python -m meho_backplane.retrieval.warm

      - name: Provision spaCy NLP model for Presidio Tier-2 (#1072)
        # Same model the unit lane provisions — the Tier-2 redaction tests in
        # the unit sweep need it, and this job re-runs that sweep.
        run: |
          uv run python -m spacy download en_core_web_sm
          MEHO_REDACTION_SPACY_MODEL=en_core_web_sm \
            uv run python -c "from meho_backplane.redaction import get_engines; get_engines('en')"

      - name: Pytest (unit) with offline coverage data
        # Hang backstop ON THE STEP (#2800): a step timeout kills the
        # process and marks the step FAILED, which the job's
        # continue-on-error absorbs. A job-level timeout would instead
        # cancel the job and flip the whole run conclusion to `cancelled`
        # (see the job-level timeout-minutes comment above).
        timeout-minutes: 45
        env:
          MEHO_REDACTION_SPACY_MODEL: en_core_web_sm
          # Same lane-placement opt-out as the required unit lane's
          # Pytest step (#2980) — this job re-runs that sweep, serially
          # and under a 45-min step cap, so the canary's full-ingest
          # tests are opted out here for the same budget reason. Today
          # this is belt-and-suspenders (this job has no spec-shelf
          # checkout, so those tests skip on shelf absence anyway);
          # it keeps a future shelf-arming of this job from silently
          # re-importing the multi-minute ingest wall.
          MEHO_SKIP_SPEC_INGEST_TESTS: "1"
          # Each xdist worker is a subprocess; coverage's a1_coverage.pth hook
          # calls coverage.process_startup() when COVERAGE_PROCESS_START points
          # at a config, so every worker writes its OWN parallel data file
          # (.coverage.<host>.<pid>.<rand>). pytest itself runs with -p no:cov
          # below, so pytest-cov's memory-spiking in-process session-end combine
          # never runs — the combine is deferred to a standalone step after
          # this one, by which point all workers are dead and their memory freed.
          COVERAGE_PROCESS_START: .coveragerc.ci
          # sysmon (PEP 669) is the faster tracer; line counts match the C
          # tracer exactly (SonarCloud parity), and it does not raise the peak
          # vs the C tracer in measurement.
          COVERAGE_CORE: sysmon
        # Same unit sweep as the required lane (--ignore=tests/integration), but
        # -n 1 (serial) to keep the coverage-inflated peak under the pod limit
        # (see the memory table in this job's header). --dist loadscope keeps a
        # module's tests on one worker so session-scoped fixtures instantiate
        # once. No --maxfail: a coverage run wants the whole suite measured even
        # if one test is flaky; redness here is non-blocking anyway.
        run: |
          uv run pytest -n 1 --dist loadscope -p no:cov \
            --ignore=tests/integration tests/

      - name: Combine coverage + write XML (offline, workers exited)
        # Runs AFTER the pytest step above fully returned — every xdist worker
        # process is gone, so `coverage combine` merges the per-worker parallel
        # data files standalone (cheap), not co-resident with live workers.
        # Uses .coveragerc.ci (relative_files=true) so paths are repo-relative
        # for SonarCloud cross-job mapping (#1987 AC6).
        #
        # `if: always()` so a non-zero pytest exit (a single flaky test in a
        # 8.3k-test sweep) still combines + uploads whatever coverage the run
        # DID produce, rather than GitHub skipping this step and silently
        # dropping all coverage for the push. Partial coverage beats none here
        # — this whole job is non-blocking, and SonarCloud merging slightly
        # incomplete new-code coverage is far better than a "no data" gap on
        # every push that happens to hit a flake. The `[ -f .coverage* ]` guard
        # keeps the step from erroring with "No data to combine" when pytest
        # crashed before any worker wrote a data file (genuine no-coverage case
        # → the upload step's hashFiles guard then skips cleanly).
        if: always()
        run: |
          if ! ls .coverage.* >/dev/null 2>&1; then
            echo "::warning::no per-worker coverage data files — pytest produced no coverage (crash before first test?); skipping combine"
            exit 0
          fi
          uv run coverage combine --rcfile=.coveragerc.ci
          uv run coverage xml --rcfile=.coveragerc.ci -o coverage.xml
          # Sanity: the file must exist and carry the empty <source></source>
          # that quality-gate.yml's sed rewrites to <source>backend</source>.
          test -f coverage.xml
          grep -q '<source></source>' coverage.xml \
            || echo "::warning::coverage.xml has no empty <source> — SonarCloud path mapping may not resolve"

      - name: Upload Python coverage artifact
        # Consumed by quality-gate.yml (`workflow_run` -> SonarCloud) under this
        # exact name. Lossy: a missing upload degrades the SonarCloud signal to
        # "no coverage for this push" but never invalidates anything.
        # continue-on-error here is belt-and-suspenders on top of the whole-job
        # continue-on-error.
        if: always() && hashFiles('backend/coverage.xml') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-coverage
          path: backend/coverage.xml
          retention-days: 7
          if-no-files-found: warn

  python-integration:
    name: Python (integration testcontainers)
    # Sibling of python-lint-test. Holds the container-heavy
    # tests/integration/ subtree (pgvector/valkey/k3d/vcsim
    # testcontainers) that made the combined serial sweep blow every
    # timeout cap (see python-lint-test comment). Separated so the
    # required lint+mypy+unit gate stays fast and deterministic while
    # integration runs on every PR.
    # **Required merge gate as of 2026-05-20 (#698).** This job's
    # context ("Python (integration testcontainers)") is in
    # ``branches/main/protection.required_status_checks.contexts``;
    # promoting it was the structural corrective to the v0.2 / G3.4
    # green-but-hollow incidents (#634 / #697) — the lane that
    # exercises real connector dispatch, k3d / bind9-container /
    # vcsim / federated-write acceptance, must be merge-blocking so
    # red integration cannot ship to ``main`` again.
    # 60-min cap: container pulls + DinD spin-up + the serial
    # integration sweep. pytest-xdist loadgroup parallelization to
    # bring this well under cap is tracked in #564.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: meho-runners-ci
    timeout-minutes: 60
    env:
      # Surfaced as a job-level env var purely so the Docker Hub login
      # step can test it in an `if:`. The `secrets` context is NOT
      # available in a step-level `if:` (GitHub's context-availability
      # table allows it in `with:` / `env:` / `run:` only), so reading
      # the secret through `env` is what makes the guard evaluatable.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      MEHO_TEST_PGVECTOR_IMAGE: harbor.evba.lab/dockerhub-proxy/pgvector/pgvector:pg16
      MEHO_TEST_VALKEY_IMAGE: harbor.evba.lab/dockerhub-proxy/valkey/valkey:8
      # vcsim release-tag pin — see the comment on the first
      # MEHO_TEST_VCSIM_IMAGE occurrence (backend-tests job) for why.
      MEHO_TEST_VCSIM_IMAGE: harbor.evba.lab/dockerhub-proxy/vmware/vcsim:v0.55.1
      MEHO_TEST_VAULT_IMAGE: harbor.evba.lab/dockerhub-proxy/hashicorp/vault:1.18
      # G3.2-T6 (#326) — k3s container fixture for the K8s typed-connector
      # E2E acceptance harness (tests/integration/test_connectors_k8s_e2e.py
      # and the existing tests/integration/test_connectors_k8s_k3d.py).
      # Pinned to the same minor the k3d/k3s fixture's in-code default
      # uses (rancher/k3s:v1.32.5-k3s1) so the Harbor proxy serves the
      # exact tag the testcontainers fixture asks for, without a docker.io
      # round-trip.
      MEHO_TEST_K3S_IMAGE: harbor.evba.lab/dockerhub-proxy/rancher/k3s:v1.32.5-k3s1
      # G11.2-T7 (#1098) — Keycloak 26.x container fixture for the
      # live-IdP integration test
      # (backend/tests/integration/test_auth_keycloak_client_credentials.py).
      # Unlike the rows above this one has **no docker.io short-name
      # default** in the fixture: the Keycloak image is ~600 MB and an
      # unauthenticated docker.io pull would reliably exhaust the
      # cluster's shared NAT egress bucket, so the fixture skips when
      # MEHO_TEST_KEYCLOAK_IMAGE is unset rather than falling back. The
      # Harbor-proxied tag is the only path that runs the suite to
      # pass; everywhere else (local dev sandboxes, agent sandboxes,
      # any future fork PR job that doesn't see this env) the test
      # skips cleanly with a clear remediation message.
      MEHO_TEST_KEYCLOAK_IMAGE: harbor.evba.lab/dockerhub-proxy/keycloak/keycloak:26.0
      # #2949 — vendor vCenter spec-shelf wiring; this job runs the
      # tests/integration real-spec ingest lanes
      # (test_operations_ingest_vcenter.py / _vi_json.py). See the
      # comment on the python-lint-test job's occurrence of these two
      # rows for the full rationale (presence-flag gating; the
      # unconditional docs-root that degrades to lane-skip when the
      # shelf checkout was skipped).
      SPEC_SHELF_TOKEN_PRESENT: ${{ secrets.SPEC_SHELF_TOKEN != '' }}
      MEHO_CONSUMER_DOCS_ROOT: ${{ github.workspace }}/spec-shelf/docs
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout vendor vCenter spec-shelf (secret-gated, #2949)
        # Same secret-gated sparse checkout as the python-lint-test
        # job's spec-shelf step — see that step's comment for the
        # licensing pointer (docs/decisions/vendor-spec-ci-
        # provisioning.md), the secret scope, and the fork/Dependabot
        # degrade-to-skip analysis.
        if: env.SPEC_SHELF_TOKEN_PRESENT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: evoila-bosnia/claude-rdc-hetzner-dc
          token: ${{ secrets.SPEC_SHELF_TOKEN }}
          path: spec-shelf
          sparse-checkout: |
            docs/sddc-manager-9.0
            docs/vcenter-9.0
          filter: blob:none
          persist-credentials: false

      - name: Verify spec-shelf provisioned the pinned vCenter specs
        # Fail-loud layout guard — same rationale as the
        # python-lint-test job's occurrence.
        if: env.SPEC_SHELF_TOKEN_PRESENT == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for f in spec-shelf/docs/sddc-manager-9.0/sddc-manager-openapi.json spec-shelf/docs/vcenter-9.0/vcenter.yaml spec-shelf/docs/vcenter-9.0/vi-json.yaml; do
            if [ ! -f "$f" ]; then
              echo "::error title=Spec-shelf layout drift::${f} missing after the spec-shelf checkout — the real-spec lanes would silently skip. Fix the shelf layout or this workflow's sparse-checkout path."
              exit 1
            fi
          done
          echo "spec-shelf OK: sddc-manager-openapi.json + vcenter.yaml + vi-json.yaml present under spec-shelf/docs/"

      - name: Docker Hub login (for testcontainers pulls)
        # Same rationale as python-lint-test's login step — the
        # integration subtree is the heaviest testcontainers consumer
        # (pgvector/valkey/k3d/vcsim), so authenticated pulls are
        # load-bearing here in particular.
        # Empty-secret guard — see the python-tests job's login step for
        # why Dependabot runs need it. This job pulls the most images, so
        # it is the likeliest to feel the lost rate-limit headroom; that
        # is an argument for mirroring the Dependabot secrets, not for
        # letting the step hard-fail.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Sync Python environment (locked)
        run: uv sync --locked --all-groups

      - name: Pytest (integration testcontainers)
        # The tests/integration/ subtree plus the G0.7 vSphere canary
        # module. No --cov here: coverage is emitted by the unit job
        # (see its NOTE); combined coverage is a #564 follow-up. -x for
        # fast-fail on the first broken integration case. Deliberately
        # NOT parallelized: the unit job is the ~49min bottleneck (now
        # split-parallelized); this job is ~6min and its
        # container-heavy fixtures under xdist are unverified — out of
        # scope for the perf change.
        #
        # The canary module is selected here (#2980) because its
        # armed-shelf full-ingest tests need the container-heavy
        # budget: the ~164 s two-spec ingest runs ONCE per module
        # (module-scoped _canary_corpus fixture, amortised in PR #2995
        # after per-test ingests — 25 x ~164 s — timeout-killed this
        # job's 60-min cap on the first armed run; per-test ingests
        # had already blown the unit lane's 25-min cap the day the
        # shelf was armed). This job is the canary's single armed
        # lane; the unit sweep opts out via
        # MEHO_SKIP_SPEC_INGEST_TESTS (see its Pytest step's env
        # comment). Shelf absent (fork/Dependabot/unprovisioned) → the
        # canary skips exactly as it always did; its fixture-less
        # self-checks also run (again) here — seconds, harmless. Lane
        # placement rule + amortisation pattern:
        # docs/decisions/spec-reconcile-guards-standard.md.
        run: uv run pytest -x tests/integration/ tests/acceptance/test_g07_vsphere_canary.py

  python-migration-tests:
    name: Python (database migrations)
    # Runs the relocated backend/tests/migrations/ suite: per-migration
    # data-transform assertions, the alembic upgrade/downgrade round-trip,
    # and the 3 pgvector-container forward-compat rollback tests. The
    # required unit lane (python-lint-test) now --ignore=tests/migrations,
    # so this job carries the deep per-migration coverage — but only on
    # migration-touching PRs, gated by the `changes` job.
    #
    # Safety net: the unit lane's session-scoped `_schema_template_db`
    # fixture still runs `alembic upgrade head` on every PR, so a broken
    # migration chain still fails every PR via fixture setup; only the
    # deep per-migration behavioural assertions defer to this job.
    #
    # REQUIRED CHECK: register the check context "Python (database
    # migrations)" in branches/main branch protection (manual ops step,
    # not code — #2140 acceptance item B.3).
    needs: changes
    # Run on any non-PR event (push / merge_group — never leave a required
    # check Pending), OR a same-repo PR that touched migration files. A
    # no-migration same-repo PR (and every fork PR) skips this job via
    # `if:`, which reports Success and satisfies the required check.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       needs.changes.outputs.migrations == 'true')
    runs-on: meho-runners-ci
    timeout-minutes: 30
    env:
      # Surfaced as a job-level env var purely so the Docker Hub login
      # step can test it in an `if:`. The `secrets` context is NOT
      # available in a step-level `if:` (GitHub's context-availability
      # table allows it in `with:` / `env:` / `run:` only), so reading
      # the secret through `env` is what makes the guard evaluatable.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # The 3 forward-compat rollback tests spin up pgvector via
      # testcontainers; route the pull through the Harbor proxy cache like
      # the sibling jobs (never `:latest`).
      MEHO_TEST_PGVECTOR_IMAGE: harbor.evba.lab/dockerhub-proxy/pgvector/pgvector:pg16
      MEHO_TEST_VALKEY_IMAGE: harbor.evba.lab/dockerhub-proxy/valkey/valkey:8
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Docker Hub login (for testcontainers pulls)
        # Authenticated pulls avoid the shared-NAT Docker Hub anonymous
        # rate limit when the rollback tests spin up pgvector/pgvector:pg16.
        # Empty-secret guard — see the python-tests job's login step for
        # why Dependabot runs need it.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Sync Python environment (locked)
        run: uv sync --locked --all-groups

      - name: Pytest (database migrations)
        run: uv run pytest tests/migrations/

  go-lint-test:
    name: Go (golangci-lint + go test)
    # Fork-PR guard mirrors the Python job — same rationale.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: meho-runners-ci
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        # Same version + cache shape as cli-release.yml so a single
        # supply-chain audit covers both. cache-dependency-path keys
        # the Go module cache off cli/go.sum, the only Go module in
        # the tree today.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Tracks `cli/go.mod`'s `go 1.25.8` directive. golangci-lint
          # invokes `go/packages` which honors the go.mod-required Go
          # version; running an older Go than go.mod requires fails with
          # `go.mod requires go >= X` (CI run 25680051917).
          # Bumped from 1.23 → 1.25 because charm.land/huh/v2 v2.0.3's
          # transitive deps raised the minimum to go 1.25.8 (PR #640).
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      - name: golangci-lint
        # v9.2.0: cli/.golangci.yml was migrated from v1 to v2 schema in
        # PR #640 (alongside the go 1.25 bump) so the action major upgrade
        # is now safe. golangci-lint v2.12.2 is compiled with Go 1.25,
        # resolving the "go language version used to build golangci-lint
        # is lower than the targeted Go version" failure that v1.64.8
        # (built with Go 1.24) produced once go-version was bumped to 1.25.
        # golangci-lint-action v7+ refuses v1.x binaries; v9.2.0 requires
        # golangci-lint >= v2.x and fully supports the v2 config schema.
        # SHA pinned to v9.2.0 commit (devops_best_practices: pin to
        # immutable SHA). Dependabot ignore list updated to track v9.x
        # minor/patch bumps rather than the now-retired v6 pin.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.12.2
          working-directory: cli

      - name: Go build
        # Smoke build of every package — fails fast on a broken import
        # graph or a typo before the test gate touches anything. cwd is
        # cli/ so `./...` resolves to the CLI module's packages only.
        working-directory: cli
        run: go build ./...

      - name: govulncheck (Go dependency CVE scan)
        # Surfaces known CVEs in the CLI's Go dependency graph.
        # govulncheck does reachability analysis against the Go vuln DB
        # (https://vuln.go.dev): it exits non-zero only when a
        # vulnerable symbol is actually reachable from this module's
        # call graph, so the gate fails on real exposure instead of on
        # every transitive advisory. Placed after `go build` so a
        # broken import graph fails on the cheaper, clearer step first.
        # The tool version is pinned (same supply-chain rule as the
        # SHA-pinned actions above); Dependabot doesn't track
        # `go install` pins, so bump it deliberately alongside Go
        # toolchain bumps.
        working-directory: cli
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

      - name: Ensure C toolchain is available (for cgo race runtime)
        # `go test -race` links the cgo-based race runtime, which needs
        # a working C toolchain — both `gcc` (or any cc) AND libc
        # development headers (`<stdlib.h>` etc.). The `meho-runners-ci`
        # self-hosted pool ships a minimal image without either, so
        # the race test would fail with one of:
        #   - `cgo: C compiler "gcc" not found` (no gcc), or
        #   - `_cgo_export.c:3:10: fatal error: stdlib.h: No such file
        #     or directory` (gcc installed, no libc6-dev — caught
        #     after the first iteration of this PR's CI).
        #
        # Install both as a unit. We check `<stdlib.h>` (not just
        # `gcc`) because a half-provisioned runner (gcc, no headers)
        # is exactly the state the previous fix iteration produced.
        # The probe compiles a one-liner via `cpp` so a future runner
        # with a non-gcc cc (e.g. clang) still passes the check.
        #
        # `sudo -n` keeps the step fail-fast on a runner that doesn't
        # grant passwordless sudo — that's a runner-pool config gap
        # better surfaced loudly here than buried in a confusing
        # later `cgo:` error. `--no-install-recommends` keeps the
        # install fast and minimal: gcc + libc6-dev only, no
        # editors/manpages/etc. The proper long-term fix is to bake
        # the C toolchain into the meho-runners-ci base image; until
        # then this step keeps PR CI green without expanding the
        # workflow's blast radius.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          have_cc=0
          if command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1; then
            have_cc=1
          fi
          have_headers=0
          if echo '#include <stdlib.h>' | cpp -E - >/dev/null 2>&1; then
            have_headers=1
          fi
          if [ "${have_cc}" = "1" ] && [ "${have_headers}" = "1" ]; then
            echo "C toolchain ready: $(gcc --version 2>/dev/null | head -1 || cc --version | head -1)"
            exit 0
          fi
          echo "C toolchain incomplete (cc=${have_cc} headers=${have_headers}); installing gcc + libc6-dev via apt..."
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc libc6-dev

      - name: Go test (race + coverage)
        # -race catches data races the CLI may hit when the
        # async-token-refresh code (internal/auth) is exercised from
        # parallel tests. -coverprofile writes a merged profile consumed
        # by the downstream SonarCloud scan (sonar.go.coverage.reportPaths)
        # so the Clean-as-You-Code new-code-coverage gate sees Go coverage,
        # not 0%. -covermode=atomic is required under -race.
        #
        # CGO_ENABLED=1 is required: `go test -race` is implemented in
        # the cgo-based race runtime and refuses to run otherwise
        # (`go: -race requires cgo; enable cgo by setting CGO_ENABLED=1`).
        # The `meho-runners-ci` self-hosted pool defaults to CGO_ENABLED=0,
        # so the flag must be set explicitly here. The preceding step
        # ensures `gcc` is on PATH so the race runtime can actually
        # link. Scoped to this step only — the build/lint steps work
        # fine with cgo off and don't need the C toolchain dependency.
        working-directory: cli
        env:
          CGO_ENABLED: '1'
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload Go coverage artifact
        # Consumed by quality-gate.yml (`workflow_run` -> SonarCloud).
        # Lossy like the Python sibling: a missing upload degrades the
        # SonarCloud signal to "no Go coverage for this run" but never
        # invalidates the test outcome. continue-on-error is appropriate
        # ONLY for this step.
        if: always() && hashFiles('cli/coverage.out') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: go-coverage
          path: cli/coverage.out
          retention-days: 7

  cli-api-snapshot-freshness:
    name: CLI API snapshot freshness
    # Fork-PR guard mirrors the other jobs — needs the internal runner pool.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: meho-runners-ci
    timeout-minutes: 10
    steps:
      - name: Checkout
        # persist-credentials: false — this job only does a read-only
        # checkout + a working-tree `git diff`; it never pushes, so it
        # has no need for the checkout token persisted in local git config.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        # `make generate` runs the pinned oapi-codegen (installed by the
        # Makefile `tools` target) which needs Go. Same version + cache
        # shape as the go-lint-test lane.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      - name: Ensure make is available
        # The minimal meho-runners-ci image ships no `make` (the Go lane
        # never needed it — it calls `go` directly). Install it via apt so
        # this job can drive the canonical Makefile targets rather than
        # duplicating their commands (which would drift from the Makefile).
        # Same `sudo -n apt-get` pattern as the go-lint-test C-toolchain
        # step; baking make into the base image is the long-term fix.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if command -v make >/dev/null 2>&1; then
            echo "make ready: $(make --version | head -1)"
            exit 0
          fi
          echo "make missing; installing via apt..."
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends make

      - name: Install uv
        # `make snapshot-openapi` drives the backplane FastAPI app via
        # `uv run` (cli/api/snapshot-openapi.py imports meho_backplane.main
        # and calls app.openapi()), so the backend env must resolve. Same
        # action + cache shape as the Python lanes.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Sync backend environment (locked)
        working-directory: backend
        run: uv sync --locked --all-groups

      - name: Regenerate OpenAPI snapshot + Go client
        # Run the same Make targets the maintainer runs so the drift check
        # compares like-for-like. snapshot-openapi writes cli/api/openapi.json
        # (downgrading OpenAPI 3.1->3.0 for oapi-codegen v2, see the script
        # header); generate (which depends on `tools`) rebuilds
        # cli/internal/api/client.gen.go from it. The regen is idempotent,
        # so a clean tree means the committed artifacts are already current.
        working-directory: cli
        run: |
          make snapshot-openapi
          make generate

      - name: Fail if the committed snapshot / client are stale
        # The snapshot + generated client are checked-in artifacts derived
        # from the backend OpenAPI document. If a backend route changed
        # without re-running the two targets above, the working tree now
        # differs from HEAD — fail with the remediation command. Same
        # rationale as a `go mod tidy` / `uv.lock --locked` drift gate.
        run: |
          if ! git diff --exit-code -- cli/api/openapi.json cli/internal/api/client.gen.go; then
            echo "::error title=CLI API snapshot stale::cli/api/openapi.json and/or cli/internal/api/client.gen.go are out of date relative to the backend OpenAPI document. Run 'cd cli && make snapshot-openapi && make generate' and commit the result."
            exit 1
          fi

  helm-lint-template:
    name: Helm (lint + template + kubeconform)
    # Fork-PR guard mirrors the other jobs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: meho-runners-ci
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Helm
        # Same version pin as chart.yml's validate + publish jobs so
        # the central CI check exercises the same Helm binary the
        # publish pipeline uses. >=3.8 ships OCI helm push (irrelevant
        # here — this job never pushes — but kept aligned).
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.16.4

      - name: Install kubeconform
        # kubeconform validates rendered manifests against Kubernetes
        # JSON Schemas offline. Pin to v0.6.7 by SHA256 — same shape
        # chart.yml uses (devops_best_practices: no `curl|sh` of
        # unpinned binaries). Install to $HOME/.local/bin because the
        # self-hosted meho-runners-ci pool runs as a non-root user that
        # cannot write to /usr/local/bin (regression caught in PR #173
        # / CI run 25644668781). Appending to $GITHUB_PATH surfaces
        # the binary to subsequent steps without relying on the install
        # step's frozen PATH.
        run: |
          set -euo pipefail
          KC_VER=v0.6.7
          KC_SHA=95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KC_VER}/kubeconform-linux-amd64.tar.gz"
          echo "${KC_SHA}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp/ kubeconform
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 /tmp/kubeconform "${HOME}/.local/bin/kubeconform"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/kubeconform" -v

      - name: Helm lint
        # The chart ships safe-by-default empty fields that
        # values.schema.json rejects at lint time on purpose; the same
        # override set chart.yml uses keeps the lint exercising the
        # typed schema end-to-end. Any drift between the CI override
        # set and chart.yml means one of the two is wrong — kept in
        # sync intentionally.
        run: |
          helm lint deploy/charts/meho/ \
            --set image.tag=test \
            --set ingress.host=meho.test \
            --set ingress.tls.secretName=meho-tls \
            --set postgres.credentialsSecret=meho-postgres \
            --set vault.address=https://vault.test \
            --set keycloak.issuer=https://keycloak.test/realms/meho \
            --set config.keycloakIssuerUrl=https://keycloak.test/realms/meho \
            --set config.keycloakAudience=meho-backplane \
            --set config.vaultAddr=https://vault.test \
            --set networkPolicy.postgresCIDR=10.0.1.0/24 \
            --set networkPolicy.vaultCIDR=10.0.2.0/24 \
            --set networkPolicy.keycloakCIDR=10.0.3.0/24

      - name: Helm template + kubeconform
        # Render then validate. -strict rejects unknown fields;
        # -kubernetes-version 1.28.0 matches the chart's kubeVersion
        # floor (also matches chart.yml). CRDs (ExternalSecret etc.)
        # are not validated upstream so -ignore-missing-schemas keeps
        # the gate from failing on missing CRD schemas while still
        # catching every core API drift.
        run: |
          helm template test deploy/charts/meho/ \
            --set image.tag=test \
            --set ingress.host=meho.test \
            --set ingress.tls.secretName=meho-tls \
            --set postgres.credentialsSecret=meho-postgres \
            --set vault.address=https://vault.test \
            --set keycloak.issuer=https://keycloak.test/realms/meho \
            --set config.keycloakIssuerUrl=https://keycloak.test/realms/meho \
            --set config.keycloakAudience=meho-backplane \
            --set config.vaultAddr=https://vault.test \
            --set networkPolicy.postgresCIDR=10.0.1.0/24 \
            --set networkPolicy.vaultCIDR=10.0.2.0/24 \
            --set networkPolicy.keycloakCIDR=10.0.3.0/24 \
            > /tmp/rendered.yaml

          kubeconform \
            -strict \
            -kubernetes-version 1.28.0 \
            -ignore-missing-schemas \
            -summary \
            /tmp/rendered.yaml
