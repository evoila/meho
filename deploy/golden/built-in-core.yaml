    app.kubernetes.io/component: database
spec:
  # Selects the PostgreSQL pod itself, so its port is closed to every pod
  # this policy does not name, whatever the parent chart's policy says.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: golden
  policyTypes:
    - Ingress
  ingress:
    - from:
        # The backplane pods. The migration step and the helm test pod carry
        # the same labels.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: meho
              app.kubernetes.io/instance: golden
        # The built-in Keycloak pods (database `keycloak`).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
              app.kubernetes.io/instance: golden
      ports:
        - port: 5432
          protocol: TCP
