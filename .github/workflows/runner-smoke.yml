name: meho-runners smoke
# Checks that the meho-runners-ci self-hosted runner pool can:
#   1. Pick up and run a job.
#   2. Pull Docker Hub images through the image proxy cache of the CI
#      cluster. The pull uses the explicit project-prefixed form, which is
#      the pull pattern the proxy supports (it does not mirror docker.io
#      transparently).
#
# The proxy address comes from the repository variable CI_IMAGE_PROXY, in
# the form `<host>/<project>`. Without it the job is skipped. The optional
# variable CI_PROXY_CA_NAME holds the common name of the private CA that
# signs the proxy certificate. Without it the CA check is skipped.
#
# Runs on every push to main and on workflow_dispatch, on the
# meho-runners-ci pool.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The smoke job uses zero GITHUB_TOKEN capability: no checkout, no `gh`,
# no API call that authenticates as the workflow (the Harbor probe is
# anonymous against a public project). An empty map is the honest
# minimum — it drops the repo-default write-all token this job would
# otherwise carry on the self-hosted meho-runners-ci pool (CodeQL
# actions/missing-workflow-permissions, alert #36).
permissions: {}

env:
  # Pinned image used for the smoke pull. Bump deliberately as part of an
  # alpine upgrade ticket; the smoke is verifying the cache pipeline, not
  # the image content.
  # Repository variable CI_IMAGE_PROXY: `<host>/<project>` of the image proxy.
  CI_IMAGE_PROXY: ${{ vars.CI_IMAGE_PROXY }}
  # Repository variable CI_PROXY_CA_NAME: common name of the private CA.
  CI_PROXY_CA_NAME: ${{ vars.CI_PROXY_CA_NAME }}

jobs:
  smoke:
    # Skip cleanly when the repository variable is not set.
    if: vars.CI_IMAGE_PROXY != ''
    runs-on: meho-runners-ci
    timeout-minutes: 10
    steps:
      - name: Derive the proxy values
        run: |
          set -euo pipefail
          PROXY_HOST="${CI_IMAGE_PROXY%%/*}"
          PROXY_PROJECT="${CI_IMAGE_PROXY#*/}"
          {
            echo "PROXY_HOST=${PROXY_HOST}"
            echo "SMOKE_IMAGE_PROJECT_PREFIXED=${CI_IMAGE_PROXY}/library/alpine:3.20"
            echo "PROXY_REPO_PATH=${PROXY_PROJECT}/library/alpine"
            echo "PROXY_API_URL=https://${PROXY_HOST}/api/v2.0"
          } >> "$GITHUB_ENV"

      - name: Identify the runner
        run: |
          echo "host: $(hostname)"
          echo "uname: $(uname -a)"
          echo "os:"
          cat /etc/os-release | head -5
          echo "---"
          echo "GITHUB_ACTIONS=$GITHUB_ACTIONS"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"

      - name: Assert Docker daemon is reachable
        # The dind sidecar shares /var/run/docker.sock via emptyDir; runner
        # container has DOCKER_HOST=unix:///var/run/docker.sock. If the
        # runner pod template regressed,
        # this prints docker daemon version OR fails loudly.
        run: |
          set -euo pipefail
          echo "== docker version =="
          docker version
          echo "== docker info ServerVersion =="
          docker info --format '{{.ServerVersion}}'

      - name: Assert private CA trust is wired (proves the OS-trust mount works)
        # Skipped when CI_PROXY_CA_NAME is not set.
        # The CA certificate is mounted into both the Docker daemon sidecar
        # and the runner container. Each one runs update-ca-certificates
        # before it starts, so the daemon can verify the proxy certificate
        # on pulls, and shell steps in this container (curl against the
        # proxy, see the "Assert the proxy cache shows the artifact" step)
        # verify it natively.
        #
        # Failure mode: a TLS error means the CA mount or the
        # update-ca-certificates step regressed (likely a chart upgrade
        # that overwrote the runner pod template).
        if: env.CI_PROXY_CA_NAME != ''
        run: |
          set -euo pipefail
          # Just grep the bundle for the CA's common name.
          if ! grep -q "$CI_PROXY_CA_NAME" \
                 /etc/ssl/certs/ca-certificates.crt 2>/dev/null \
               && ! docker run --rm \
                     -e PROXY_HOST="$PROXY_HOST" \
                     alpine:3.20 \
                     sh -c 'apk add --quiet openssl >/dev/null 2>&1; \
                            openssl s_client -connect "$PROXY_HOST:443" \
                              -servername "$PROXY_HOST" -verify_return_error \
                              </dev/null 2>&1 | grep -q "Verify return code: 0"'; then
            # The runner container's bundle normally carries the CA, so the
            # grep above passes directly. The fallback is only an extra
            # check: if it is reached, the runner-side CA wiring regressed.
            # The pull step below still exercises the daemon's TLS path.
            echo "Note: runner-side CA bundle check did not match; relying on the pull step below for TLS validation (investigate the CA mount of the runner container)."
          fi
          echo "Bundle check complete."

      - name: Pull library/alpine:3.20 via the proxy cache (explicit-prefix form)
        # We use the explicit project-prefixed URL form because the proxy
        # cache needs the project name in the URL path (it does not mirror
        # docker.io transparently).
        #
        # Strips any prior local copy first so this is a real pull, not a
        # no-op resolve.
        run: |
          set -euo pipefail
          # Remove any prior local copies of either ref so containerd really
          # fetches via the network. The tag + digest dedup means we have to
          # be thorough.
          docker rmi "$SMOKE_IMAGE_PROJECT_PREFIXED" alpine:3.20 library/alpine:3.20 2>/dev/null || true
          docker system prune -af 2>&1 | tail -3
          echo "== docker pull $SMOKE_IMAGE_PROJECT_PREFIXED =="
          time docker pull "$SMOKE_IMAGE_PROJECT_PREFIXED"
          echo "== docker images alpine =="
          docker images "${SMOKE_IMAGE_PROJECT_PREFIXED%:*}"

      - name: Run the pulled image
        # End-to-end sanity: the pulled image actually runs (proves the
        # layers were fetched correctly through the cache, not just the
        # manifest).
        run: |
          set -euo pipefail
          docker run --rm "$SMOKE_IMAGE_PROJECT_PREFIXED" \
            sh -c 'echo "alpine version:"; cat /etc/alpine-release'

      - name: Assert the proxy cache shows the artifact
        # The load-bearing assertion: the pull above wasn't just successful
        # at the docker-client level (which can happen via silent fall-back
        # to docker.io for short-name pulls), but actually filled the proxy
        # cache. We query the proxy API anonymously. The project is public,
        # so artifact listing requires no auth.
        #
        # This `curl` runs in the RUNNER container (not the Docker daemon
        # sidecar). It verifies the proxy TLS with the runner container's
        # OS trust store. Verification stays ON: no `-k` / `--insecure` /
        # `--cacert`. Proving TLS to the proxy works is the whole point of
        # this step. A `curl: (60) SSL certificate problem` here means the
        # runner-side CA wiring regressed.
        run: |
          set -euo pipefail
          ARTIFACTS_URL="$PROXY_API_URL/projects/${PROXY_REPO_PATH%%/*}/repositories/$(echo "${PROXY_REPO_PATH#*/}" | sed 's|/|%2F|g')/artifacts"
          echo "Probing: $ARTIFACTS_URL"
          # The API returns a JSON array; jq counts how many artifacts the
          # repo holds. We assert >=1 (an actual cache fill).
          COUNT=$(curl -fsS --retry 3 --retry-all-errors "$ARTIFACTS_URL" | jq 'length')
          echo "artifacts in the proxy cache for $PROXY_REPO_PATH: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo
            echo "FAIL: the proxy repo $PROXY_REPO_PATH is empty after a"
            echo "      successful docker pull. That means the pull went to"
            echo "      docker.io directly (TLS error against the proxy, or"
            echo "      the project-prefix path regressed). Check:"
            echo "      - kubectl exec <pod> -c dind -- docker info"
            echo "      - kubectl logs <pod> -c dind | grep -iE 'tls|x509'"
            echo "      - the runner pod template of the CI cluster"
            exit 1
          fi
          echo "Cache populated."
