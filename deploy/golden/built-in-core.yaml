apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: golden-keycloak
  labels:
    helm.sh/chart: keycloak-0.1.0
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "26.8.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: login
spec:
  # One replica. Keycloak keeps its state in PostgreSQL and runs with the
  # `local` cache, so a second pod would not share sessions. High
  # availability is a later step.
  replicas: 1
  serviceName: golden-keycloak
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: golden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: golden
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Keycloak does not retry a failed database connection at start.
        # Wait here until PostgreSQL accepts connections. `-U` and `-d` are
        # needed: without them pg_isready looks up the name of the current
        # user, which fails under a user id that has no passwd entry (as on
        # OpenShift), and then it never reports ready. The names are plain
        # words; the schema allows nothing else.
        - name: wait-for-database
          image: "pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -q -h "$DB_HOST" -p "$DB_PORT" -U keycloak -d keycloak; do
                echo "waiting for PostgreSQL at $DB_HOST:$DB_PORT"
                sleep 2
              done
          env:
            - name: DB_HOST
              value: "golden-postgres"
            - name: DB_PORT
              value: "5432"
          resources:
            limits:
              cpu: 100m
              ephemeral-storage: 64Mi
              memory: 64Mi
            requests:
              cpu: 10m
              ephemeral-storage: 16Mi
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 999
            runAsUser: 999
      containers:
        - name: keycloak
          image: "quay.io/keycloak/keycloak@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244"
          imagePullPolicy: IfNotPresent
          args:
            - start
            - --import-realm
          env:
            # Database: the `keycloak` database and role of the built-in
            # PostgreSQL, or the ones named in `database` for your own
            # PostgreSQL. The pool stays at 20 so Keycloak and the backplane
            # fit PostgreSQL's 100 connections together.
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: "golden-postgres"
            - name: KC_DB_URL_PORT
              value: "5432"
            - name: KC_DB_URL_DATABASE
              value: "keycloak"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: golden-core-postgres-keycloak
                  key: "password"
            - name: KC_DB_POOL_INITIAL_SIZE
              value: "2"
            - name: KC_DB_POOL_MIN_SIZE
              value: "2"
            - name: KC_DB_POOL_MAX_SIZE
              value: "20"
            # Address. Browsers, the CLI and the `iss` claim use the public
            # URL; pods call the Service. With the dynamic back channel, the
            # discovery document fetched at the Service URL names the public
            # issuer and Service-URL endpoints for keys and tokens.
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_HOSTNAME
              value: "https://meho.test/auth"
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_CACHE
              value: local
            # The temporary admin service account Keycloak creates in the
            # master realm at the first start. The realm stage of the
            # bootstrap Job uses it once and then removes it.
            - name: KC_BOOTSTRAP_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: golden-core-keycloak-bootstrap
                  key: client_id
            - name: KC_BOOTSTRAP_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: golden-core-keycloak-bootstrap
                  key: client_secret
            # Values for the `${...}` placeholders in the realm file. Keycloak
            # reads them only while it imports the realm.
            - name: MEHO_REALM_PUBLIC_URL
              value: "https://meho.test"
            - name: MEHO_REALM_TENANT_ID
              value: "00000000-0000-4000-8000-000000000001"
            - name: MEHO_REALM_TENANT_NAME
              value: "main"
            - name: MEHO_REALM_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: golden-core-keycloak-admin
                  key: client_secret
            - name: MEHO_REALM_WEB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: golden-core-ui-auth
                  key: client_secret
            - name: MEHO_REALM_CHECK_RUNNER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: golden-core-check-runner
                  key: client_secret
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          # The first start builds the server, creates the schema and
          # imports the realm, so the start probe allows 5 minutes.
          startupProbe:
            httpGet:
              path: /auth/health/started
              port: management
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: management
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /auth/health/live
              port: management
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: 1Gi
              memory: 2Gi
            requests:
              cpu: 250m
              ephemeral-storage: 256Mi
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: golden-keycloak-realm
