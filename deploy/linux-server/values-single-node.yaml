#
# Helm values for MEHO on one Linux server with RKE2 (install form 2). The
# download ships this file as chart/values-single-node.yaml, and install.sh
# passes it to Helm before /etc/meho/values-place.yaml, the answers of the
# place (form-2 design, sections 5 and 6).
#
# RKE2 runs Traefik in kube-system. The storage class stays empty in every
# built-in part, so the volumes use the default class (local-path).
ingress:
  className: traefik
  tls:
    # The self-signed certificate the install makes for the host name.
    # `meho-host certificate` replaces it with the customer's own.
    secretName: meho-core-tls
networkPolicy:
  ingressControllerNamespace: kube-system
corePostgres:
  enabled: true
coreKeycloak:
  enabled: true
coreVault:
  enabled: true
# The web console. The chart's secrets Job makes its Secret (#4041); these
# keys only wire it into the backplane. Without them, the console login
# answers 503. The approval hand-off key needs no lines: with the built-in
# core the chart turns it on with the Secret the install makes (#4047).
# When #4766 lets the chart fill in the names for the built-in Keycloak,
# only the "enabled: true" line stays.
uiConsole:
  enabled: true
  secretName: meho-core-ui-auth
config:
  # The schema requires the client of the console when uiConsole is on. With
  # the built-in Keycloak the chart uses meho-web either way (#4766).
  uiKeycloakClientId: meho-web
