# Source: meho-chart/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: golden-meho
  labels:
    helm.sh/chart: meho-chart-0.2.0
    app.kubernetes.io/name: meho
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: meho
      app.kubernetes.io/instance: golden
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller's namespace may reach the backplane.
    # The selector matches RKE2's `ingress-nginx` namespace by default;
    # override `networkPolicy.ingressControllerNamespace` per environment.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
          protocol: TCP
  egress:
    # Built-in PostgreSQL (#4047). Selectors match
    # `corePostgres.selectorLabels`; `postgresCIDR` is not used.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
              app.kubernetes.io/instance: golden
      ports:
        - port: 5432
          protocol: TCP
    # Built-in OpenBao (#4047). Selectors match `coreVault.selectorLabels`;
    # the pod listens on 8200 whatever the Service port. `vaultCIDR` is not
    # used.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              app.kubernetes.io/instance: golden
      ports:
        - port: 8200
          protocol: TCP
    # Built-in Keycloak (#4591): the backplane calls its Service for
    # discovery, keys, tokens and the Admin REST API. A NetworkPolicy
    # matches the pod's port, which is always 8080 (the Service's
    # `targetPort: http`). Selectors match `coreKeycloak.selectorLabels`.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
              app.kubernetes.io/instance: golden
      ports:
        - port: 8080
          protocol: TCP
    # Activity-broadcast subchart (`charts/broadcast/` — Valkey per ADR
    # 0005). Selectors match the broadcast subchart's `_helpers.tpl`
    # `broadcast.selectorLabels` exactly so this rule lines up with the
    # Pods the subchart renders. Egress is conditional on
    # `broadcast.enabled` — when the operator points at an external
    # endpoint the rule disappears and no in-cluster port-6379 traffic
    # is permitted.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: broadcast
              app.kubernetes.io/instance: golden
      ports:
        - port: 6379
          protocol: TCP
    # DNS — UDP/53 to kube-dns / CoreDNS. Without this rule every other
    # egress rule above fails on name resolution. The selector matches the
    # standard `k8s-app: kube-dns` label CoreDNS ships with by default.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
