  - slug: orbit-sicherung-aufbewahrung
    language: de
    status: current
    body: |
      # Orbit Sicherungsagent Aufbewahrung

      Diese Seite erklärt, wie lange der Orbit Sicherungsagent
      Wiederherstellungspunkte aufbewahrt und wie man das ändert.

      ## Geltungsbereich

      Die Regeln gelten für alle Orbit Agenten ab Version 4.

      ## Zeitpläne

      Der Agent erstellt pro Woche eine Vollsicherung und pro Tag eine
      inkrementelle Sicherung.

      ## Aufbewahrungsrichtlinie

      Wiederherstellungspunkte werden standardmäßig 30 Tage aufbewahrt.
      Ändern Sie die Dauer mit der Einstellung retention_days in der
      Auftragsdatei und starten Sie den Agenten neu.

      ## Speicherbedarf

      Rechnen Sie mit etwa fünf Vollsicherungen pro Auftrag.

