{{- /*
The Secret that holds the metrics token (`metricsAuth`). The backplane
reads it as `METRICS_AUTH_TOKEN` (templates/deployment.yaml) and the
ServiceMonitor sends it as a bearer token (templates/servicemonitor.yaml),
both by Secret name and key, so the value never lands in a ConfigMap, an
env `value:` or the rendered manifest history.

Rendered only when `metricsAuth.enabled` is true and the operator has not
named their own `metricsAuth.existingSecret`. Same pattern as the broadcast
subchart's password Secret: a value already stored in this Secret on a
prior release is looked up and kept, so a `helm upgrade` does not rotate
the token out from under the running pod; a first install gets a fresh
32-character alphanumeric token. `lookup` returns an empty map during
`helm template` / `--dry-run`, so a bare render always makes a new token.
*/}}
{{- define "meho.metricsAuthSecretName" -}}
{{- .Values.metricsAuth.existingSecret | default (printf "%s-metrics-auth" .Release.Name) -}}
{{- end }}
{{- if and .Values.metricsAuth.enabled (not .Values.metricsAuth.existingSecret) }}
{{- $secretName := include "meho.metricsAuthSecretName" . -}}
{{- $key := .Values.metricsAuth.secretKey -}}
{{- $token := randAlphaNum 32 -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if and $existing $existing.data (index $existing.data $key) -}}
{{- $token = index $existing.data $key | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "meho.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $token | b64enc | quote }}
{{- end }}
