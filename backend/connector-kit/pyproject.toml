# The connector kit: the MEHO names a connector package may import.
# See docs/codebase/connector-packages.md, "The connector kit".
#
# The version is the kit version, not the MEHO release number. Do not edit
# it by hand: `uv run python -m scripts.write_connector_kit_names` (in
# backend/) writes it, together with kit-names.json.
#
# The kit ships only with MEHO's own image. It is never published on a
# package index. It has no dependencies of its own: it only works next to
# the meho-backplane package of the same image or checkout.
[project]
name = "meho-connector-kit"
version = "1.0"
description = "The MEHO names a connector package may import."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meho_connector_kit"]
