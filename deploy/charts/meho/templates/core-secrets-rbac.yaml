{{- if include "meho.core.enabled" . }}
{{- /*
Rights of the built-in core's hook Jobs (#4041; core design §3): the
`secrets` Job here and the `bootstrap` Job (#4043). The `vault-init` Job
(#4044) is not a hook and has its own account (core-vault-init.yaml).
Hooks at weight -40 on all four phases, so the account exists before every
Job that names it (#2391) and is created first in each phase.
The default delete policy (`before-hook-creation`) applies. Hook objects
are not part of the release, so `helm uninstall` leaves them.
*/}}
{{- $plan := include "meho.core.secretsPlan" . | fromJson }}
{{- $named := list }}
{{- range $plan.check }}
{{- $named = append $named .name }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "meho.core.hookName" . }}
  labels:
    {{- include "meho.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,post-install,post-upgrade
    helm.sh/hook-weight: "-40"
# The token is mounted only on the Job pods that set
# `automountServiceAccountToken: true` themselves.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "meho.core.hookName" . }}
  labels:
    {{- include "meho.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,post-install,post-upgrade
    helm.sh/hook-weight: "-40"
rules:
  # Kubernetes cannot limit `create` to names. Creating a Secret whose name
  # already exists fails with 409 and changes nothing, so an operator's
  # Secret is never overwritten.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Read and patch exactly the `<release>-core-*` Secrets. No `list`, no
  # `watch`, nothing cluster-wide.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames:
      {{- range splitList "\n" (include "meho.core.secretNames" . | trim) }}
      - {{ . | quote }}
      {{- end }}
  {{- with $named | uniq }}
  # Read the Secrets the operator named in values, only to check that they
  # hold the keys MEHO reads.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      {{- range . }}
      - {{ . | quote }}
      {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "meho.core.hookName" . }}
  labels:
    {{- include "meho.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,post-install,post-upgrade
    helm.sh/hook-weight: "-40"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "meho.core.hookName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "meho.core.hookName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
