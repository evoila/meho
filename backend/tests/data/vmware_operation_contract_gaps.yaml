# Known gaps in the contracts of the VMware and Broadcom operations.
#
# Read by tests/test_vmware_operation_contracts.py. Shape: connector id,
# then operation id, then the rules that operation does not meet yet.
#
# This list may only get shorter:
# - A new gap fails the test. Fix the operation; do not add it here.
# - A fixed gap also fails the test until you remove its entry here.
# The rules are described in docs/codebase/connector-release-readiness.md
# (section "Operation contract check").

installer-rest:
  installer.sddc.spec.validate:
    - requires_approval
sddc-rest:
  sddc.cluster.list:
    - response_schema
    - llm_instructions
    - examples
  sddc.credential.list:
    - summary
    - response_schema
    - llm_instructions
    - examples
  sddc.domain.create:
