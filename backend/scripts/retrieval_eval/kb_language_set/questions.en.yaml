  - id: en-share-keywords
    question: SS-SCAN-08 antivirus scan
    expect: en/file-share-slow-monday-morning.md
    kind: exact
  - id: en-dns-ticket
    question: Since the website moved servers, some of us land on the old one and others on the new one.
    expect: en/dns-old-address-after-change.md
