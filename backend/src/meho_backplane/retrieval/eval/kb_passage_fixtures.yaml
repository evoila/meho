# MEHO retrieval eval — synthetic KB passage benchmark fixtures (#3765).
#
# Every product, command, error code and number below is made up.
# Nothing here comes from a real knowledge base, ticket, or prompt.
#
# Schema: meho_backplane.retrieval.eval.corpus.KbPassageFixtures.
#
# Editing rules:
# * Bump `version` when you change an entry body, a query, or an
#   expected reference. Reports carry the version, so two reports are
#   only comparable when the version matches.
# * Each query has one `scenario` and one `language`. Reports group by
#   both, so add queries in pairs (one `en`, one `de`) per scenario.
# * `expected_slugs` lists the entries that hold the answer. The first
#   is preferred; any listed entry is a correct source.
# * `expected_heading` is the last heading above the answer. The
#   passage an agent would cite must sit under this heading.
# * `answer_terms` must appear in the answer passage. They stand in for
#   "the agent could answer the task from this passage".
# * `harmful_slugs` are stale or conflicting entries. Ranking one above
#   the first correct passage (an expected entry under the expected
#   heading) counts as harm. Without any correct passage in the results,
#   any harmful entry counts as harm.
# * `no_match` queries have no answer in the corpus.

