# Source: meho-chart/charts/broadcast/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-broadcast
  labels:
    helm.sh/chart: broadcast-0.1.0
    app.kubernetes.io/name: broadcast
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "9.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: broadcast
spec:
  # Hard-capped at 1 for v0.1: streams are ephemeral, no Sentinel sidecar
  # ships in this chart, and the parent values.schema.json rejects any
  # value > 1. HA via Sentinel/Cluster lands at v0.2+ (ADR 0005).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: broadcast
      app.kubernetes.io/instance: golden
  strategy:
    # Single-replica + ephemeral data → Recreate is safer than RollingUpdate.
    # A RollingUpdate would briefly run two pods, both binding port 6379;
    # the second would fail readiness and the first would still be torn down
    # by the rollout controller. Recreate avoids the dance.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: broadcast
        app.kubernetes.io/instance: golden
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broadcast
          image: "valkey/valkey@sha256:2d04268dfa26ab31cfa3fdc538866e76438b2d00e41db41b8cb86d780ac5a416"
          imagePullPolicy: IfNotPresent
          # With auth on, the Secret-sourced password must reach Valkey
          # without landing in the ConfigMap OR on the process command line
          # (a `--requirepass "$VAR"` arg would be visible in `ps` /
          # /proc/<pid>/cmdline). So the entrypoint copies the ConfigMap
          # config into the writable emptyDir at `dir /data` and appends
          # `requirepass <password>` from the env var (sourced via
          # secretKeyRef below), then execs Valkey against that runtime
          # file. readOnlyRootFilesystem stays true — only the /data
          # emptyDir is written.
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cat /etc/valkey/valkey.conf > /data/valkey-runtime.conf
              printf '\nrequirepass %s\n' "$VALKEY_REQUIREPASS" >> /data/valkey-runtime.conf
              exec valkey-server /data/valkey-runtime.conf
          env:
            # Valkey `requirepass` password, sourced from the chart-managed
            # (or operator-supplied `existingSecret`) Secret. Consumed by the
            # start-up command above; the same Secret + key is referenced by
            # the backplane client (umbrella chart Deployment) so both sides
            # authenticate with one value.
            - name: VALKEY_REQUIREPASS
              valueFrom:
                secretKeyRef:
                  name: golden-broadcast-auth
                  key: requirepass
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          # TCP liveness keeps the probe surface minimal — a successful TCP
          # accept on 6379 is sufficient evidence that the server loop is up.
          # `redis-cli PING` would be more thorough but couples the probe to
          # the existence of `redis-cli` in the image, which Valkey OSS does
          # ship but not under that exact binary name in every variant.
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 512Mi
              memory: 512Mi
            requests:
              cpu: 50m
              ephemeral-storage: 128Mi
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
              readOnly: true
            # Valkey writes to its data directory even with persistence
            # disabled (PID file, ephemeral working state). With
            # readOnlyRootFilesystem: true we mount an emptyDir at the
            # configured `dir` path so the server can start.
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: golden-broadcast-config
        - name: data
          emptyDir: {}
---
# Source: meho-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-meho
  labels:
    helm.sh/chart: meho-chart-0.2.0
    app.kubernetes.io/name: meho
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  # Kubernetes marks a rollout failed when the new pod is not Ready after
  # this many seconds. Keep it above the startup probe budget (#5812).
  # An upgrade with --reuse-values from an older release has no value: use
  # the chart default then. The schema already refuses 0.
  progressDeadlineSeconds: 1200
  # Recreate by default (#5024): the old pod has stopped before the new one
  # starts, so old and new code never share the database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: meho
      app.kubernetes.io/instance: golden
  template:
    metadata:
      annotations:
        # Roll the pod whenever the ConfigMap the backplane reads via
        # `envFrom` (below) changes. Helm updates the ConfigMap object on a
        # `config.*`-only upgrade, but the pod template is otherwise
        # byte-identical, so without this the new environment never reaches
        # the running pod until a manual `kubectl rollout restart` (#2586).
        # Hashing the fully rendered configmap.yaml (the Helm howto pattern)
        # means any change to what the pod consumes — config.*, memory.*,
        # topology.*, or the derived MCP/backplane values — forces a rollout,
        # while an unchanged render leaves the checksum stable (no churn).
        checksum/config: e658d44876cd0f62b8cca0c7fc65c0ca79cb375d0716fce9b265b03ec3816093
        # Roll the pod when the chart-made metrics token changes, so the
        # token the pod checks is the one the Secret holds. On a cluster
        # `lookup` keeps the value and the checksum stays stable.
        checksum/metrics-auth: <random>
      labels:
        app.kubernetes.io/name: meho
        app.kubernetes.io/instance: golden
    spec:
      serviceAccountName: golden-meho
      # The pre-stop wait, the drain and 30 seconds for the rest of the
      # shutdown (#5024). Kubernetes kills the pod when this time is over.
      terminationGracePeriodSeconds: 95
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The database migration, with the built-in PostgreSQL (#5233).
        # The pre-install hook Job (templates/migration-job.yaml) would run
        # before Helm creates the database, so in this mode the Job is not
        # rendered and every backplane pod migrates before it starts. The
        # runner waits for the database (`MIGRATION_DB_WAIT_SECONDS`,
        # default 300 s) and holds a PostgreSQL advisory lock while it
        # migrates, so a second replica waits and then changes nothing. A
        # failed migration keeps the pod out of Ready: `helm --wait` fails.
        # With the default Recreate strategy the old pod has already stopped,
        # so MEHO is down until `helm rollback` (docs/acceptance/rollback.md).
        # An older image after
        # `helm rollback` leaves a newer schema alone (rollback contract,
        # docs/codebase/migrations.md). Same container as the Job: image
        # and digest pin, command, environment, security context, volumes
        # and `migrationJob.resources`.
        - name: migrate
          image: "ghcr.io/evoila/meho:test"
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "meho_backplane.db.migrate"]
          envFrom:
            - configMapRef:
                name: golden-meho-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: golden-core-postgres-meho
                  key: url
            - name: DATABASE_RUNTIME_ROLE
              value: "meho_app"
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 256Mi
              memory: 512Mi
            requests:
              cpu: 50m
              ephemeral-storage: 64Mi
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backplane
          # Image reference deliberately offers no `default .Chart.AppVersion`
          # fallback: the values schema rejects empty `image.tag` so every
          # install pins the tag explicitly. Goal #11's deploy discipline
          # forbids any moving reference (including a chart-appVersion shadow).
          #
          # When `image.digest` is set (#284 / F15b), pin by the immutable
          # manifest digest (`repository@sha256:...`) — the exact,
          # content-addressed, scanned+signed digest the image pipeline
          # promoted, and the reference a `cosign verify` / admission gate
          # checks the signature against. `tag` stays the human-readable label
          # of that release; the digest takes precedence in the rendered
          # reference. With no digest set, fall back to the schema-required tag.
          image: "ghcr.io/evoila/meho:test"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: golden-meho-config
          env:
            # Surfaces the deployed chart's version to the backplane so
            # GET /version reports a real `chart_version` (#631). chart.yml
            # stamps `.Chart.Version` to the calver at package time; this
            # is the only path that carries that value into the running
            # container (the image build does not know its chart release).
            - name: CHART_VERSION
              value: "0.2.0"
            # How long running operations may take to finish after the stop
            # signal (#5024). uvicorn reads its own limit for open requests
            # from UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN; both get the same value.
            - name: SHUTDOWN_DRAIN_SECONDS
              value: "60"
            - name: UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN
              value: "60"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: golden-core-postgres-meho-app
                  key: url
            # The metrics token (`metricsAuth`): `/metrics` and the
            # `features` block of `/ready` answer only a caller that sends
            # it. `secretKeyRef` only, never plaintext.
            - name: METRICS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "golden-metrics-auth"
                  key: "token"
            # BROADCAST_REDIS_URL points the backplane at the in-cluster
            # broadcast store. The name must match the env var the
            # backplane actually reads (`Settings.broadcast_redis_url`
            # resolves from `BROADCAST_REDIS_URL` in
            # backend/src/meho_backplane/settings.py); an unset var falls
            # back to `redis://localhost:6379`, so the readiness probe's
            # broadcast leg dials localhost inside the Pod and the healthy
            # Service is never contacted. ADR 0005 locks the
            # wire-protocol-compatible store as Valkey 9.x; `redis-py`
            # (locked driver) parses the `redis://` scheme unchanged.
            - name: BROADCAST_REDIS_URL
              value: "redis://golden-broadcast:6379/0"
            # BROADCAST_REDIS_PASSWORD carries the Valkey `requirepass` the
            # broadcast subchart enforces (charts/broadcast). Sourced from the
            # same Secret + key the store reads, so the URL above stays
            # password-free (no secret in a plaintext env `value:`) and the
            # client authenticates via `Settings.broadcast_redis_password`.
            - name: BROADCAST_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: golden-broadcast-auth
                  key: requirepass
            # Other operator-supplied secrets (Keycloak client secret, Vault
            # role bindings) come via ESO-synced Kubernetes Secrets; G2.6
            # wires the references when each surface lands.
            # G11.2 (#803) — Keycloak Admin REST API credentials gating
            # agent-principal registration. All three render together
            # (schema requires `url` + `clientId` + `clientSecret` refs
            # under `enabled: true`). `KEYCLOAK_ADMIN_CLIENT_SECRET` is the
            # only confidential value and uses `secretKeyRef`; the other
            # two are plain operator config and render as `value:`.
            # Unset → `POST /api/v1/agent-principals` returns
            # `503 keycloak_admin_not_configured` (see
            # `meho_backplane.features._agent_runtime_block`).
            - name: KEYCLOAK_ADMIN_URL
              value: "http://golden-keycloak:8080/auth/admin/realms/meho"
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              value: "meho-admin"
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "golden-core-keycloak-admin"
                  key: "client_secret"
            - name: APPROVAL_HANDOFF_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: "golden-core-approval-handoff"
                  key: "approval_handoff_encryption_key"
            - name: PARAMS_HASH_KEY
              valueFrom:
                secretKeyRef:
                  name: "golden-core-params-hash"
                  key: "params_hash_key"
          # Probes target the backplane's chassis health endpoints (Task #19,
          # `backend/src/meho_backplane/health.py`): `/healthz` for liveness
          # (returns 200 unconditionally; failure → pod restart) and `/ready`
          # for readiness (registry of dependency probes — 503 until G2.2 /
          # G2.3 register concrete probes; failure → pod removed from Service
          # endpoints, no restart). Probes always render — disabling them
          # would mask startup deadlocks and let an unready Pod accept
          # traffic. Every probe field is operator-tunable via
          # `.Values.probes.<kind>.<field>`.
          #
          # `startupProbe` gates liveness/readiness until first boot succeeds
          # (Issue #2393). First boot runs the full typed-op catalog
          # registration plus the fastembed model preload before the app binds
          # :8000. On an empty database every operation also gets its
          # embedding: about 5 min at the 1-CPU limit (#4102), and since #5019
          # a stopped start keeps none of it. Without this probe the kubelet
          # starts liveness-checking mid-registration and CrashLoopBackOffs a
          # slow-but-healthy pod. The default budget is
          # `failureThreshold × periodSeconds` = 90 × 10s = 900s (15 min); the
          # kubelet disables liveness/readiness until it passes, then the
          # short-delay liveness probe takes over for fast hang detection. The
          # `with` guard lets an operator opt out on a fast cluster by clearing
          # `.Values.probes.startup`.
          startupProbe:
            failureThreshold: 90
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          # Keep serving for a few seconds after Kubernetes decided to stop
          # the pod, so the Service and the ingress stop sending it requests
          # before it closes (#5024). Without it, a request can still reach
          # the closing pod and the caller gets a short 502.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            limits:
              cpu: 1000m
              ephemeral-storage: 1Gi
              memory: 1Gi
            requests:
              cpu: 100m
              ephemeral-storage: 256Mi
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The scheduler's OpenBao token (#4047). VAULT_SCHEDULER_TOKEN_FILE
            # in the ConfigMap points here; the backplane reads the file at
            # every use, so a token the setup Job makes later needs no restart.
            - name: vault-scheduler
              mountPath: /var/run/meho/vault-scheduler
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Made by the OpenBao setup Job, which may finish after the pod
        # starts; `optional` lets the pod start without it.
        - name: vault-scheduler
          secret:
            secretName: "golden-core-vault-scheduler"
            optional: true
            items:
              - key: token
                path: token
