# Builds the MEHO appliance OVA, meho-appliance-<version>.ova (#4811), on
# the lab's vSphere 8 cluster: deploy/appliance/build.sh. See
# docs/codebase/appliance-build.md.
#
# Runs by hand (workflow_dispatch) with a release tag. It fetches the
# signed form-2 download of that tag from the GitHub release, checks the
# signature and the checksum, builds the OVA, and keeps the OVA and
# SHA256SUMS as workflow artifacts. Publishing is #4814. A run on every
# release tag comes once the release test exists (#4816).
#
# Runner: the lab's self-hosted pool, which must reach the lab's vCenter
# and the build VM's address. The lab's test place is an internal ticket.
# The vCenter login is in repository secrets
# GOVC_URL, GOVC_USERNAME and GOVC_PASSWORD; where the build VM goes and
# its network are repository variables (below). The job log of a public
# repository is public, so the build step masks the variables, and there is
# no build log file: a mask does not reach a file. The build SSH key is
# made new for every run and never stored.
#
# Permissions: read-only. The job runs no pull-request code.

name: appliance-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose form-2 download to build from, for example v0.38.0.
        required: true
        type: string

permissions:
  contents: read

# One build at a time: the build VM has one name per version, and the lab
# has room for one build.
concurrency:
  group: appliance-build
  cancel-in-progress: false

jobs:
  build:
    name: Build the appliance OVA on the lab cluster
    runs-on: meho-runners-ci
    # The form-2 install on the build VM takes up to 30 minutes, the clean
    # and the export about as long again.
    timeout-minutes: 180
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install govc
        # Pinned version and checksum: the sha256 from checksums.txt of the
        # govmomi release.
        run: |
          set -euo pipefail
          GOVC_VER=v0.56.2
          GOVC_SHA=12889f30e42e868487041f6628e9789606c80e13a194fb37c099abffc92d5a59
          GOVC_TAR="${RUNNER_TEMP}/govc.tar.gz"
          curl -fsSL -o "${GOVC_TAR}" \
            "https://github.com/vmware/govmomi/releases/download/${GOVC_VER}/govc_Linux_x86_64.tar.gz"
          echo "${GOVC_SHA}  ${GOVC_TAR}" | sha256sum -c -
          tar -xzf "${GOVC_TAR}" -C "${RUNNER_TEMP}" govc
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${RUNNER_TEMP}/govc" "${HOME}/.local/bin/govc"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/govc" version

      - name: Install cosign
        # Same pin as linux-download.yml.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Fetch and check the form-2 download of the tag
        # The same check as docs/RELEASING.md: the signature first, then
        # the checksum.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag '${TAG}' is not like v0.36.0."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/download"
          cd "${RUNNER_TEMP}/download"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "meho-linux-${TAG#v}-amd64.tar" \
            --pattern SHA256SUMS-linux \
            --pattern SHA256SUMS-linux.cosign.bundle
          cosign verify-blob \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/linux-download.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle SHA256SUMS-linux.cosign.bundle \
            SHA256SUMS-linux
          sha256sum -c SHA256SUMS-linux
          echo "MEHO_DOWNLOAD=${RUNNER_TEMP}/download/meho-linux-${TAG#v}-amd64.tar" >> "${GITHUB_ENV}"

      - name: Make the build-only SSH key
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -C "meho-appliance-build-${GITHUB_RUN_ID}" -f "${RUNNER_TEMP}/build-key"
          echo "MEHO_BUILD_SSH_KEY=${RUNNER_TEMP}/build-key" >> "${GITHUB_ENV}"

      - name: Build the OVA
        env:
          # The pool does not clean HOME between jobs, so govc must not keep
          # its vCenter session in ~/.govmomi/sessions.
          GOVC_PERSIST_SESSION: "false"
          GOVC_URL: ${{ secrets.GOVC_URL }}
          GOVC_USERNAME: ${{ secrets.GOVC_USERNAME }}
          GOVC_PASSWORD: ${{ secrets.GOVC_PASSWORD }}
          MEHO_LAB_GOVC_INSECURE: ${{ vars.MEHO_LAB_GOVC_INSECURE }}
          GOVC_DATASTORE: ${{ vars.MEHO_LAB_DATASTORE }}
          GOVC_FOLDER: ${{ vars.MEHO_LAB_FOLDER }}
          GOVC_RESOURCE_POOL: ${{ vars.MEHO_LAB_RESOURCE_POOL }}
          GOVC_NETWORK: ${{ vars.MEHO_LAB_NETWORK }}
          MEHO_BUILD_HOSTNAME: ${{ vars.MEHO_BUILD_HOSTNAME }}
          MEHO_BUILD_ADDRESS: ${{ vars.MEHO_BUILD_ADDRESS }}
          MEHO_BUILD_GATEWAY: ${{ vars.MEHO_BUILD_GATEWAY }}
          MEHO_BUILD_DNS: ${{ vars.MEHO_BUILD_DNS }}
        run: |
          set -euo pipefail
          # The lab's names and addresses stay out of the job log. The
          # secrets are masked already.
          IFS=, read -ra dns <<<"${MEHO_BUILD_DNS}"
          for value in "${GOVC_DATASTORE}" "${GOVC_FOLDER}" "${GOVC_RESOURCE_POOL}" "${GOVC_NETWORK}" \
            "${MEHO_BUILD_HOSTNAME}" "${MEHO_BUILD_HOSTNAME%%.*}" "${MEHO_BUILD_ADDRESS%/*}" \
            "${MEHO_BUILD_GATEWAY}" "${dns[@]// /}"; do
            [[ -z "${value}" ]] || echo "::add-mask::${value}"
          done
          # A lab vCenter with its own certificate: set the variable to 1.
          [[ -z "${MEHO_LAB_GOVC_INSECURE}" ]] || export GOVC_INSECURE="${MEHO_LAB_GOVC_INSECURE}"
          mkdir -p "${RUNNER_TEMP}/ova"
          deploy/appliance/build.sh "${TAG#v}" "${RUNNER_TEMP}/ova"

      - name: Write the summary
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ova"
          cd "${RUNNER_TEMP}/ova"
          {
            echo "## Appliance OVA"
            echo ""
            if [[ -f SHA256SUMS ]]; then
              echo "- File: \`meho-appliance-${TAG#v}.ova\` ($(stat -c %s "meho-appliance-${TAG#v}.ova") bytes)"
              echo "- sha256: \`$(cut -d ' ' -f 1 SHA256SUMS)\`"
            else
              echo "- The build failed. Read the log of the step \"Build the OVA\"."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Keep the OVA and the checksums as artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: meho-appliance-ova
          path: |
            ${{ runner.temp }}/ova/meho-appliance-*.ova
            ${{ runner.temp }}/ova/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
          # The disk in the OVA is already compressed (stream-optimized).
          compression-level: 0
