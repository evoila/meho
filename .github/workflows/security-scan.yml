# Semgrep static analysis.
#
# Runs on every push and PR. Uses Semgrep's curated registry packs
# (p/python, p/typescript, p/security-audit, p/owasp-top-ten) rather
# than vendored rules. The registry-packs trade-off — registry-side
# changes can silently move suppression behavior — does not bite yet
# because the codebase has no suppressions to break. When suppressions
# accumulate, vendor a curated rule set under .semgrep/rules/ and
# switch the --config flag.
#
# The job runs Semgrep twice, with the same four packs:
#
# 1. "Report all findings" runs every rule (error, warning and info)
#    and writes a SARIF file (the standard file format for scan
#    results). Findings never fail this step. The file goes to GitHub
#    code scanning, so all findings show on the Security tab, and new
#    ones show as annotations on the changed lines of a pull request.
# 2. "Fail on error-level findings" runs only the error rules, with
#    --error. So this job, the required "Semgrep SAST" check, fails
#    only on an error-level finding. This is the same gate as before.
#
# Why not one run plus a count of errors in the SARIF file: in
# Semgrep's SARIF the level sits on each rule, not on each result. A
# simple count of results with "level: error" is always 0, so it would
# quietly turn the gate off. The second run uses only documented
# Semgrep flags. It costs one more, smaller scan.
#
# The upload keeps the category GitHub gives this job by default
# (.github/workflows/security-scan.yml:semgrep), so the results stay in
# the same code scanning entry as before. A new category name would
# start a second entry and leave the old one behind, to be deleted by
# hand. Both upload steps have continue-on-error: true, so an upload
# problem never blocks the workflow.
#
# Per evoila-bosnia/MEHO.X#712: pip-audit and npm-audit jobs deferred
# until pyproject.toml / package.json exist (their suppression lists
# are deeply tied to MEHO.X's specific dependency graph; carrying
# them over to an empty repo is signal decay).

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Fires when a PR enters the GitHub merge queue. Required so the
  # `Semgrep SAST` status context — a required check in branch
  # protection — reports against the synthesised merge commit, not
  # just the PR head. Without this, merge-queue runs would never
  # receive the SAST signal and queued PRs would hang on the missing
  # required context. Same rationale as ci.yml's merge_group trigger
  # (#769).
  merge_group:

concurrency:
  # Mirrors ci.yml's pattern (#769): event-suffixed group key so
  # pull_request / push / merge_group runs don't collide, and
  # cancel-in-progress is scoped OFF for merge_group because a
  # cancelled queue check fails the merge attempt and defeats the
  # queue. Workflow-name-specific group prefix so this workflow's
  # cancellation domain stays distinct from ci.yml's.
  group: security-scan-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read
  security-events: write  # required for SARIF upload to Code Scanning

jobs:
  semgrep:
    name: Semgrep SAST
    # Fork-PR guard (F06, meho-internal#268): never execute PR-controlled
    # code from a fork on the internal `meho-runners-ci` pool. Unlike the
    # other PR workflows, this job runs inside a container pulled from
    # the internal Harbor proxy (harbor.evba.lab, see below), which a
    # disposable GitHub-hosted runner cannot reach — so untrusted fork
    # PRs are skipped here rather than relocated. The required `Semgrep
    # SAST` context still runs for real on the trusted merge_group
    # (queue-admission) and push refs. Same stance as ci.yml.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: meho-runners-ci
    timeout-minutes: 15
    # Pulled through the in-cluster Harbor proxy cache
    # (claude-rdc-hetzner-dc#463; project `dockerhub-proxy` is public,
    # anonymous consumer auth — no `credentials:` block needed).
    # Harbor preserves Docker Hub's namespace, so the `semgrep/semgrep`
    # path appears verbatim under the cache prefix. The cache itself
    # authenticates upstream against Docker Hub via the credential
    # provisioned by claude-rdc-hetzner-dc#472, so cache-miss fetches
    # don't share MEHO's anonymous bucket either.
    #
    # The earlier iteration of this workflow (evoila/meho#447 + #507)
    # used GHA `container.credentials:` with the `evoila` org-level
    # `DOCKERHUB_USERNAME` + `DOCKERHUB_TOKEN` secrets to authenticate
    # directly against Docker Hub. That mechanism cannot coexist with
    # the cache prefix: GHA's runner interprets `credentials:` as
    # "log into the registry hosting this image", which is now
    # `harbor.evba.lab`, not `docker.io` — and Docker Hub creds don't
    # authenticate to Harbor (which is anonymous anyway). The
    # `credentials:` block is therefore removed in the same edit as
    # the prefix swap; the org-level secrets stay provisioned
    # (Harbor's upstream uses them via #472), and `ci.yml`'s pytest
    # job still uses them via `docker/login-action`.
    #
    # If Harbor is ever unreachable (cluster outage, cert rotation,
    # etc.), this job fails fast at "Initialize containers" with a
    # clear connection error — that's the intended loud-failure
    # signal, not a silent fall-back to docker.io.
    #
    # Bump cadence: monthly review or on advisory.
    container:
      image: harbor.evba.lab/dockerhub-proxy/semgrep/semgrep:1.160.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Report all findings
        # All rules and all severities. No --error, so findings do not
        # fail this step. A scan error (for example a rule pack that
        # cannot be downloaded) still fails it.
        run: >
          semgrep scan
          --config p/python
          --config p/typescript
          --config p/security-audit
          --config p/owasp-top-ten
          --sarif
          -o semgrep-results.sarif

      - name: Upload SARIF as job artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        continue-on-error: true  # tolerate org artifact-storage quota; SARIF goes to Code Scanning regardless
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
          retention-days: 14

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v3
        if: always()
        continue-on-error: true  # graceful fallback if Code Scanning not enabled
        with:
          sarif_file: semgrep-results.sarif

      - name: Fail on error-level findings
        # The gate: only the error rules, and --error exits with 1 on
        # any finding. The findings are listed in this step's log.
        run: >
          semgrep scan
          --config p/python
          --config p/typescript
          --config p/security-audit
          --config p/owasp-top-ten
          --error
          --severity ERROR
