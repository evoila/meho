# Source: meho-chart/charts/corePostgres/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-postgres-config
  labels:
    helm.sh/chart: postgres-0.1.0
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "17"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: database
data:
  # The one SQL file for both paths. It runs once from
  # /docker-entrypoint-initdb.d on an empty disk, and again from the
  # reconcile sidecar at every pod start and whenever a mounted Secret
  # changes. Every statement is safe to run twice. Passwords reach SQL only
  # as psql variables, never written into a statement. No role is a
  # superuser; `meho` and `keycloak` each own their own database and
  # nothing else. `meho_app` is the login of the running backplane: it
  # owns nothing and may only connect here; the migration, which runs as
  # the owner `meho`, grants it its rights on the tables. The superuser
  # creates `vector`, so MEHO's migrations never need a superuser.
  core.sql: |
    \getenv meho_pw MEHO_DB_PASSWORD
    \getenv meho_app_pw MEHO_APP_DB_PASSWORD
    \getenv keycloak_pw KEYCLOAK_DB_PASSWORD
    SELECT 'CREATE ROLE meho' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'meho')\gexec
    SELECT 'CREATE ROLE meho_app' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'meho_app')\gexec
    SELECT 'CREATE ROLE keycloak' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'keycloak')\gexec
    ALTER ROLE meho LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 60 PASSWORD :'meho_pw';
    ALTER ROLE meho_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 60 PASSWORD :'meho_app_pw';
    ALTER ROLE keycloak LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 25 PASSWORD :'keycloak_pw';
    SELECT 'CREATE DATABASE meho OWNER meho ENCODING ''UTF8''' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'meho')\gexec
    SELECT 'CREATE DATABASE keycloak OWNER keycloak ENCODING ''UTF8''' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')\gexec
    REVOKE CONNECT, TEMPORARY ON DATABASE meho FROM PUBLIC;
    REVOKE CONNECT, TEMPORARY ON DATABASE keycloak FROM PUBLIC;
    GRANT CONNECT ON DATABASE meho TO meho_app;
    \c meho
    CREATE EXTENSION IF NOT EXISTS vector;
    -- After a new image brings a newer pgvector, this moves the extension
    -- in the database to it. It does nothing when it is already current.
    ALTER EXTENSION vector UPDATE;

  # Runs core.sql once over the local socket as the image superuser
  # (initdb's `local all all trust` line), with the three role passwords
  # read from the mounted Secret files. Used by both paths: the server
  # container runs it from /docker-entrypoint-initdb.d, the sidecar from
  # its loop.
  apply.sh: |
    #!/bin/sh
    set -eu
    secrets=/etc/core-postgres/secrets
    MEHO_DB_PASSWORD=$(cat "$secrets/meho/password")
    MEHO_APP_DB_PASSWORD=$(cat "$secrets/meho-app/password")
    KEYCLOAK_DB_PASSWORD=$(cat "$secrets/keycloak/password")
    if [ -z "$MEHO_DB_PASSWORD" ] || [ -z "$MEHO_APP_DB_PASSWORD" ] || [ -z "$KEYCLOAK_DB_PASSWORD" ]; then
      echo "core-postgres: a mounted password file is empty; nothing changed" >&2
      exit 1
    fi
    export MEHO_DB_PASSWORD MEHO_APP_DB_PASSWORD KEYCLOAK_DB_PASSWORD
    export PGOPTIONS="-c client_min_messages=warning"
    exec psql -X -q -v ON_ERROR_STOP=1 -h /var/run/postgresql -U postgres -d postgres \
      -f /etc/core-postgres/config/core.sql

  # The reconcile sidecar. It checks whether the SQL file or a mounted
  # password changed since its last good run, and if so runs apply.sh. So a
  # new or restored Secret never drifts from the live role. It checks every
  # 2 s until the server first answers, then every 30 s. It waits for the
  # server on TCP, not on the socket: the temporary server that runs the
  # initdb script listens on the socket only, and the two must not run
  # core.sql at the same time.
  reconcile.sh: |
    #!/bin/sh
    set -u
    # As PID 1, sh ignores SIGTERM unless it traps it; without this the pod
    # would wait the full grace period on every stop.
    trap 'exit 0' TERM INT
    config=/etc/core-postgres/config
    secrets=/etc/core-postgres/secrets
    applied=""
    interval=2
    while :; do
      if pg_isready -q -h 127.0.0.1 -p 5432 -U postgres; then
        current=$(cat "$config/core.sql" "$secrets/meho/password" "$secrets/meho-app/password" "$secrets/keycloak/password" | sha256sum)
        if [ "$current" != "$applied" ]; then
          if "$config/apply.sh"; then
            applied=$current
            echo "core-postgres: roles and databases match the mounted Secrets"
          else
            echo "core-postgres: reconcile failed; retrying in 30 s" >&2
          fi
        fi
        interval=30
      fi
      sleep "$interval" &
      wait $!
    done
---
# Source: meho-chart/charts/coreVault/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-vault-config
  labels:
    helm.sh/chart: openbao-0.1.0
    app.kubernetes.io/name: openbao
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "2.7.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: secrets
data:
  # The server's addresses come from the environment (the StatefulSet sets
  # `<prefix>_API_ADDR` and `<prefix>_CLUSTER_ADDR` from the pod's DNS name).
  server.hcl: |
    ui = false

    storage "raft" {
      path = "/openbao/data"
    }

    # Plain HTTP inside the namespace. TLS on this port is #4050's.
    listener "tcp" {
      address         = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_disable     = 1
    }

    # Audit lines go to the container log. OpenBao refuses audit devices
    # made through the API, so it is declared here.
    audit "file" "stdout" {
      options {
        file_path = "stdout"
      }
    }
---
# Source: meho-chart/templates/core-vault-init.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: golden-vault-init-policies
  labels:
    helm.sh/chart: meho-chart-0.2.0
    app.kubernetes.io/name: meho
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: vault-init
data:
  meho-admin.hcl: |
    # meho-admin: day-2 work by a person, through the `meho-admin` login role
    # (members of the Keycloak group MEHO-Platform-Admins). Everything: more
    # keyholders (`bao operator rotate-keys`), new cluster keys for the setup
    # Job's login after a key rotation, policy changes. No root token is kept,
    # so this login is the admin path.
    path "*" {
      capabilities = ["create", "read", "update", "patch", "delete", "list", "sudo"]
    }
  meho-configurator.hcl: |
    # meho-configurator: the setup Job's own login after the first install
    # (role `vault-init` on the `kubernetes-sa` login, bound to the Job's
    # service account). Exactly what a later run changes. It can write
    # policies, so treat this login as an admin login.
    path "sys/mounts" {
      capabilities = ["read"]
    }
    path "sys/mounts/secret" {
      capabilities = ["create", "read", "update", "sudo"]
    }
    path "sys/auth" {
      capabilities = ["read"]
    }
    path "sys/auth/jwt" {
      capabilities = ["create", "read", "update", "sudo"]
    }
    path "sys/auth/kubernetes-sa" {
      capabilities = ["create", "read", "update", "sudo"]
    }
    path "sys/policies/acl/*" {
      capabilities = ["create", "read", "update", "list"]
    }
    path "auth/jwt/*" {
      capabilities = ["create", "read", "update", "list"]
    }
    path "auth/kubernetes-sa/*" {
      capabilities = ["create", "read", "update", "list"]
    }
    path "identity/group/name/*" {
      capabilities = ["create", "read", "update"]
    }
    path "identity/group-alias" {
      capabilities = ["create", "update"]
    }
    path "identity/group-alias/id/*" {
      capabilities = ["create", "read", "update"]
    }
    path "auth/token/roles/meho-periodic" {
      capabilities = ["create", "read", "update"]
    }
    path "auth/token/create/meho-periodic" {
      capabilities = ["create", "update"]
    }
    path "secret/data/meho/test/*" {
      capabilities = ["create", "read", "update"]
    }
  meho-mcp.hcl: |
    # meho-mcp: every login through the `meho-mcp` role gets this policy. Read on
    # MEHO's own subtree, which holds the health check's test secret
    # (docs/cross-repo/vault-provisioning.md §3). Tenant secrets come from the
    # three per-tenant policies, given through the login's tenant_role group.
    path "secret/data/meho/*" {
      capabilities = ["read"]
    }
    path "secret/metadata/meho/*" {
      capabilities = ["read"]
    }
  meho-scheduler.hcl: |
    # meho-scheduler: the scheduler's own token, stored in the Secret
    # <release>-core-vault-scheduler (docs/cross-repo/vault-provisioning.md §6).
    path "secret/data/agents/+/credentials" {
      capabilities = ["create", "read", "update"]
    }
    path "secret/metadata/agents/+/credentials" {
      capabilities = ["read"]
    }
    # The object storage keys of the agent session store
    # (config.sessionStore.credentialsVaultPath). Read only.
    path "secret/data/services/session-store" {
      capabilities = ["read"]
    }
    # The dead-token check reads lookup-self after a refused write.
    path "auth/token/lookup-self" {
      capabilities = ["read"]
    }
  meho-snapshot.hcl: |
    # meho-snapshot: the backup token, stored in the Secret
    # <release>-core-vault-snapshot (#3960). Taking a raft snapshot needs sudo.
    path "sys/storage/raft/snapshot" {
      capabilities = ["read", "sudo"]
    }
  meho-tenant-admin.hcl: |
    # meho-tenant-admin (tenant_role tenant_admin): everything on the secrets of
    # the login's own tenant, including the privileged path that only this
    # policy names (docs/cross-repo/connector-vault-tenant-policy.md §2.3). The
    # setup Job replaces JWT_ACCESSOR with the accessor of the `jwt` login.
    path "secret/data/tenants/{{identity.entity.aliases.JWT_ACCESSOR.metadata.tenant_id}}/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    path "secret/metadata/tenants/{{identity.entity.aliases.JWT_ACCESSOR.metadata.tenant_id}}/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    path "secret/data/tenants/{{identity.entity.aliases.JWT_ACCESSOR.metadata.tenant_id}}/privileged/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    # The version soft-delete (vault.kv.delete) posts to secret/delete/<path>,
    # which OpenBao checks on that path, not on data/.
    path "secret/delete/tenants/{{identity.entity.aliases.JWT_ACCESSOR.metadata.tenant_id}}/*" {
      capabilities = ["update"]
    }
  meho-tenant-operator.hcl: |
    # meho-tenant-operator (tenant_role operator): read_only's rights, plus
    # writing new versions under the rotation path
    # (docs/cross-repo/connector-vault-tenant-policy.md §2.2). The setup Job
    # replaces JWT_ACCESSOR with the accessor of the `jwt` login.
    path "secret/data/tenants/{{identity.entity.aliases.JWT_ACCESSOR.metadata.tenant_id}}/*" {
      capabilities = ["read"]
    }
    path "secret/metadata/tenants/{{identity.entity.aliases.JWT_ACCESSOR.metadata.tenant_id}}/*" {
      capabilities = ["read", "list"]
    }
    path "secret/data/tenants/{{identity.entity.aliases.JWT_ACCESSOR.metadata.tenant_id}}/rotation/*" {
      capabilities = ["create", "read", "update"]
    }
    # The break-glass path privileged/ is for tenant admins only. The wildcards
    # above cover it too, so deny it here: the more specific path wins.
    path "secret/data/tenants/{{identity.entity.aliases.JWT_ACCESSOR.metadata.tenant_id}}/privileged/*" {
      capabilities = ["deny"]
    }
    path "secret/metadata/tenants/{{identity.entity.aliases.JWT_ACCESSOR.metadata.tenant_id}}/privileged/*" {
      capabilities = ["deny"]
    }
  meho-tenant-read-only.hcl: |
    # meho-tenant-read-only (tenant_role read_only): read and list the secrets of
    # the login's own tenant (docs/cross-repo/connector-vault-tenant-policy.md
    # §2.1). The tenant comes from the login's metadata, which the `meho-mcp`
    # role copies from the token's tenant_id claim. The setup Job replaces
    # JWT_ACCESSOR with the accessor of the `jwt` login.
    path "secret/data/tenants/{{identity.entity.aliases.JWT_ACCESSOR.metadata.tenant_id}}/*" {
      capabilities = ["read"]
    }
    path "secret/metadata/tenants/{{identity.entity.aliases.JWT_ACCESSOR.metadata.tenant_id}}/*" {
      capabilities = ["read", "list"]
    }
    # The break-glass path privileged/ is for tenant admins only. The wildcards
    # above cover it too, so deny it here: the more specific path wins.
    path "secret/data/tenants/{{identity.entity.aliases.JWT_ACCESSOR.metadata.tenant_id}}/privileged/*" {
      capabilities = ["deny"]
    }
    path "secret/metadata/tenants/{{identity.entity.aliases.JWT_ACCESSOR.metadata.tenant_id}}/privileged/*" {
      capabilities = ["deny"]
    }
