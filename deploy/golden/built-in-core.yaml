        - name: vault-init
          # The backplane image, with the same digest pin as the Deployment.
          image: "ghcr.io/evoila/meho:test"
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "meho_backplane.core.vault_init"]
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MEHO_CORE_VAULT_PLAN
              value: "{\"audience\":\"meho-backplane\",\"bound_issuer\":\"https://meho.test/auth/realms/meho\",\"init_secret\":\"golden-core-vault-init\",\"jwks_url\":\"http://golden-keycloak:8080/auth/realms/meho/protocol/openid-connect/certs\",\"keycloak_url\":\"http://golden-keycloak:8080/auth\",\"openbao_url\":\"http://golden-vault:8200\",\"policy_dir\":\"/opt/meho/openbao-policies\",\"sa_token_file\":\"/var/run/secrets/openbao/token\",\"scheduler_secret\":\"golden-core-vault-scheduler\",\"service_account\":\"golden-vault-init\",\"snapshot_secret\":\"golden-core-vault-snapshot\",\"unseal_secret\":\"golden-core-vault-unseal\"}"
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 256Mi
              memory: 512Mi
            requests:
              cpu: 50m
              ephemeral-storage: 64Mi
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: policies
              mountPath: /opt/meho/openbao-policies
              readOnly: true
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: policies
          configMap:
            name: golden-vault-init-policies
        # The Job's login to OpenBao on later runs: a token for the audience
        # `openbao`, which the API server does not accept and OpenBao does.
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: openbao
                  expirationSeconds: 600
                  path: token
