  Broadcast filter bar (Task #868 work item #3). Two controls:

    * principal -- free-text, exact-match on the announcement's
      ``principal_sub``.
    * target    -- <select> of the tenant's target names (G0.3 registry);
      matches an announcement's ``target`` or any of its ``targets``.

  Broadcast shows only agent announcements (#3762), so the bar has no
  operation filters. Both filters are server-side: they ``hx-get`` to
  ``/ui/broadcast/feed`` and swap the ``#broadcast-feed`` fragment so the
  re-rendered fragment's ``sse-connect`` URL carries them -- the server
  drops non-matching announcements before they reach the browser.

  Phone layout (#6000)
  --------------------
  Below the ``md`` width the two fields fold away behind a "Filters"
  button, so the newest announcements sit at the top of the screen. The
  button opens and closes them (Alpine ``filtersOpen``). From ``md`` up
  the button is hidden and the fields always show, as before. Without
  JavaScript the fields stay visible.
-#}
{% from "_icons.html" import icon %}
<form
  class="card bg-base-100 border-base-300 border shadow-sm"
  x-data="{ filtersOpen: false }"
  hx-get="/ui/broadcast/feed"
  hx-target="#broadcast-feed"
  hx-swap="outerHTML"
  hx-trigger="change from:find select[name=target], input changed delay:300ms from:find input[name=principal]"
  hx-include="[name=principal], [name=target]"
  hx-push-url="true"
  role="search"
  aria-label="Filter agent announcements"
  onsubmit="return false;"
>
  <button
    type="button"
    class="btn btn-ghost btn-md justify-between md:hidden"
    aria-controls="broadcast-filter-fields"
    aria-expanded="false"
    :aria-expanded="filtersOpen.toString()"
    x-on:click="filtersOpen = !filtersOpen"
  >
    Filters
    {{ icon("chevron-down", class="size-4") }}
  </button>
  <div
    id="broadcast-filter-fields"
    class="card-body grid gap-3 md:grid-cols-2"
    :class="filtersOpen ? '' : 'max-md:hidden'"
  >
    {# ---------- principal ---------- #}
    <label class="form-control">
      <span class="label-text">Principal</span>
      <input
        type="search"
        name="principal"
        value="{{ principal_filter }}"
        placeholder="Exact sub match"
        class="input input-bordered input-sm"
        aria-label="Filter announcements by principal sub"
      />
    </label>

    {# ---------- target ---------- #}
    <label class="form-control">
      <span class="label-text">Target</span>
      <select
        name="target"
        class="select select-bordered select-sm"
        aria-label="Filter announcements by target"
      >
        <option value="" {% if not target_filter %}selected{% endif %}>All targets</option>
        {% for option in target_options %}
          <option value="{{ option }}" {% if option == target_filter %}selected{% endif %}>
            {{ option }}
          </option>
        {% endfor %}
      </select>
    </label>
  </div>
</form>
