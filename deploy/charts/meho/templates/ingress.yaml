{{- if .Values.ingress.enabled -}}
{{- $fullName := include "meho.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "meho.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      {{- /* Empty with a built-in part on: the certificate the install makes (#4047). */}}
      secretName: {{ .Values.ingress.tls.secretName | default (ternary (printf "%s-core-tls" .Release.Name) "" (eq (include "meho.core.enabled" .) "true")) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- if .Values.coreKeycloak.enabled }}
          {{- include "meho.coreKeycloakIngressPaths" . | nindent 10 }}
          {{- end }}
{{- end }}
