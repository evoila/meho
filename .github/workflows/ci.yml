# PR-level CI workflow — the central per-PR test harness for all three
# in-tree toolchains.
#
# Locked matrix (Goal #11 DoD bullet 4 — every PR runs lint + tests on
# every toolchain that has source code in the repo):
#
#   Python (ruff + mypy + pytest) on backend/ — SHARDED (#3251) into:
#     python-lint       : ruff check + ruff format --check + mypy (once)
#     python-unit-shard : the pytest unit sweep as a 5-way matrix; test files
#                         are split by measured time (#4809)
#     python-unit-lane  : fan-in carrying the branch-protection required
#                         context `Python (ruff + mypy + pytest)`
#   go-lint-test      : golangci-lint + go build + go test on cli/
#   helm-lint-template: helm lint + helm template + kubeconform on deploy/charts/meho/
#
# Each job runs on its own runner in parallel; total wall clock for a green PR
# is the slowest job's elapsed time because the jobs never block each other.
# Sharding the unit lane (#3251) turned its ~19-min serial pytest wall into
# ~6-8-min parallel shards, cutting the dominant PR-wall contributor. Per-job
# `timeout-minutes` caps a runaway gate at roughly twice its observed cost.
#
# Runner placement (#4626, step 1): the six small jobs — `changes`,
# `python-lint`, `python-unit-lane`, `go-lint-test`,
# `cli-api-snapshot-freshness` and `helm-lint-template` — run on GitHub-
# hosted `ubuntu-latest` runners. They need only public toolchains and
# public-registry egress. Before the move they queued on the internal
# `meho-runners-ci` pool (8 slots) behind the big test jobs: a median wait of
# about 14 minutes for jobs that run for seconds to two minutes, and the
# detect job at the start plus the fan-in at the end put that wait on the
# critical path of every run twice. The jobs that pull test images from the
# internal mirror or read the private spec shelf stay on the internal pools:
# `python-unit-shard` (heavy pool), `python-integration-shard`,
# `python-migration-tests` and the nightly coverage jobs. Every moved job
# keeps its name, `if:` guard and triggers, so the required checks are
# unchanged.
#
# Docs-only fast path (#3252): the `changes` detector also classifies a PR
# whose diff is PURELY documentation (every path under `docs/` or ending in
# `.md`). On such a PR the heavy Python lanes — `python-lint`, the five
# `python-unit-shard` legs, and the four `python-integration-shard` legs —
# skip via their own job-level `if:` (skipped-by-`if:` == Success per
# #2140), so a changelog roll / guide edit / README fix finishes CI in
# minutes instead of paying the ~17-19-min Python tax for zero signal. The
# required `Python (ruff + mypy + pytest)` and `Python (integration
# testcontainers)` fan-ins still RUN and report (their inspection steps
# treat the detect-driven skips as pass ONLY when `docs_only=true`). The cheap lanes
# (Go, Helm) and the security/secret/license scans keep running unchanged —
# docs can still leak secrets, and those lanes are already fast. The skip is
# an ALLOW-LIST that fails CLOSED: anything the detector cannot prove is
# docs-only runs the FULL matrix. See the `changes` job's SAFETY NOTE.
#
# No-backend path (#5296): on a PR that changes no file under `backend/`
# (apart from `.md` files) and does not change this file, the `changes`
# detector sets `backend_python=false`. The same heavy Python lanes skip.
# One short job, `python-outside-backend` (GitHub-hosted runner), runs only
# the backend tests that read files outside `backend/` (the Helm chart, the Go
# CLI, the workflows, the docs). The fan-in requires that job to pass on this
# path. push and merge_group always run everything.
#
# Out of scope (deliberately delegated to existing workflows; do not
# duplicate here):
#   * Backplane image build / push  -> .github/workflows/image.yml
#     (builds without pushing on PRs that touch `backend/**` or
#     `.github/workflows/image.yml` — path-filtered, see image.yml's
#     `on.pull_request.paths`). PRs that don't touch backend skip the
#     image build by design — the Dockerfile + dep-resolution gate only
#     needs to run when its inputs change. Repeating the build here
#     would double the cost for backend PRs and add zero signal for
#     non-backend PRs.
#   * Alembic backward-compat guard -> .github/workflows/migration-compat.yml
#     (path-scoped to backend/alembic/versions/**, runs only when
#     migrations change).
#   * Alembic single-head guard     -> .github/workflows/migration-heads.yml
#     (every PR + merge_group, seconds, no database; posts a fresh
#     check run on open migration PRs when a migration lands on
#     main — #4204).
#   * Chart publish / sign          -> .github/workflows/chart.yml
#     (publish runs only on main + tag pushes; chart.yml's `validate`
#     job runs on PRs too as a path-scoped gate. This workflow's
#     helm job exercises the same lint+template+kubeconform pass
#     unconditionally so a chart-touching regression also fails the
#     central CI check operators see in branch protection.)
#   * Dependency license scan       -> .github/workflows/dependency-license-check.yml
#     (path-scoped to manifest changes).
#   * Secret + supply-chain scans   -> secret-scan.yml + security-scan.yml.
#
# The workflow name is `CI` so it satisfies the `workflow_run:
# workflows: ["CI"]` dependency in quality-gate.yml (SonarCloud's
# Clean-as-You-Code gate). The dedicated `python-coverage` job (once a
# night, on the `schedule` trigger — #4910) uploads `coverage.xml` as a
# `python-coverage` artifact so the downstream SonarCloud scan can ingest
# it — quality-gate.yml's `actions/download-artifact` step references
# that exact name. The required unit lane (the `python-unit-shard` matrix
# behind the `python-unit-lane` fan-in) is intentionally NO-cov: see
# those jobs and #1982 — running the unit suite under coverage OOM-kills
# the memory-limited heavy runner, so coverage was split into its own
# non-required, continue-on-error job (#1987). It ran on every push to
# `main` until #4910 moved it to the nightly run: the 8 coverage shards
# took 12 heavy runners after each merge (about 3,000 heavy-runner
# minutes a day, most of it cancelled by the next merge), and the merge
# queue's unit shards then waited for a free runner or ran over their
# time budget.
#
# Fail-loud posture (per Goal #11 + devops_best_practices "no
# continue-on-error on linters or tests"): every step that asserts a
# contract is allowed to fail the job. The continue-on-error in this
# file is confined to coverage: the whole `python-coverage` job is
# job-level continue-on-error (a coverage OOM degrades to "no
# coverage for this night" and never fails the CI run conclusion —
# which would otherwise also suppress quality-gate.yml's
# workflow_run), and the artifact-upload step inside it is
# step-level continue-on-error. SonarCloud already guards its own
# download with continue-on-error.
#
# All third-party actions pinned to immutable SHAs with the
# human-readable tag in a trailing comment (devops_best_practices:
# SHA-pin every action). Same SHAs as the publish workflows where the
# action overlaps, so a single supply-chain audit covers all of CI.
#
# Merge queue (#769): the `merge_group` event fires when a PR is admitted
# to the GitHub merge queue. Required checks configured in the merge-queue
# ruleset run against the actual merge result (PR head + current main +
# any ahead-in-queue PRs), so a semantically-broken combination is caught
# before it reaches main — ending the inherited-red episodes from
# 2026-05-20/21. The concurrency group is intentionally NOT set to
# cancel-in-progress on merge_group runs: a cancelled queue check fails
# the merge attempt and defeats the queue's purpose. cancel-in-progress
# is scoped to pull_request / push refs only so PR force-pushes and rapid
# main pushes still cancel their predecessors cleanly.
#
# Merge-queue watchdog (#4732): the queue drops a group as soon as one of
# its required checks fails, or when it rebuilds the group behind a pull
# request it took out, and then deletes the group's branch. GitHub does not
# stop the group's CI run, so the run's jobs kept waiting for and using
# runners for up to three hours after the drop. The `merge-queue-watchdog`
# job (last in this file) runs only on `merge_group` events. It cancels its
# own run when a job that carries or feeds a required check has not passed,
# or when the queue branch is gone. It ends quietly once every job that
# carries or feeds a required check has finished, so a run that passed and
# merged is never cancelled.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Fires when a PR enters the merge queue. Runs the full check matrix
  # against the synthesised merge commit (PR + current main tip +
  # any ahead-in-queue PRs). This is the gate that prevents a
  # stale-but-green PR from landing a broken combination on main.
  merge_group:
  # Nightly full run on `main` (#4910). This is the only run that produces
  # the SonarCloud coverage artifact: the 8 `python-coverage` shards and
  # `python-coverage-combine` run here and on a PR with the
  # `ci-coverage-validate` label, not after every merge. quality-gate.yml
  # analyzes only this run. It starts at 02:17 UTC (#5429): between 00:00
  # and 04:59 UTC a job waits about 0.2 min for a heavy runner, between
  # 05:00 and 08:00 UTC it waits 7-12 min. Minute 17, not 0, because
  # GitHub delays scheduled runs at the start of every hour.
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  # On push to main: one in-flight CI run per ref so a fast follow-up
  # commit cancels its predecessor. On PRs: scoped per PR ref so an
  # author force-push cancels its own prior CI run cleanly. Mirrors
  # the pattern used by image.yml, chart.yml, and cli-release.yml.
  #
  # IMPORTANT: already-running merge_group jobs must NEVER be cancelled.
  # A cancelled queue check causes the merge attempt to fail and the PR
  # falls out of the queue — defeating the whole point of the merge queue.
  # The conditional below restricts cancel-in-progress to pull_request /
  # push contexts only. Queued (not-yet-started) merge_group runs can
  # still be displaced by newer queue entries; that is expected behaviour.
  # The nightly `schedule` run has its own group (`ci-<ref>-schedule`), so
  # a merge during the run does not cancel it.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  changes:
    name: Detect migration + docs-only changes
    # Single change-detector for TWO downstream gates, both #2140-shaped
    # (job-level `if:` on this job's outputs, NEVER `on.paths`):
    #
    #   migrations — `true` when a PR touches migration-related files, so the
    #                required `python-migration-tests` job runs only then.
    #   docs_only  — `true` when a PR's diff is PURELY documentation (every
    #                changed path is under `docs/` or ends in `.md`), so the
    #                heavy Python lanes (`python-lint`, the `python-unit-shard`
    #                matrix, and the `python-integration-shard` matrix) skip
    #                via their own `if:` and report success-by-skip (#3252).
    #   backend_python — `false` when a PR changes no file under `backend/`
    #                (except `.md`) and does not change this file (#5296). The
    #                same heavy Python lanes skip. The job
    #                `python-outside-backend` runs instead: only the backend
    #                tests that read files outside `backend/`. Fails CLOSED
    #                like `docs_only`: it starts `true`, and push, merge_group
    #                and any diff problem keep it `true` (full run).
    #
    # WHY a `changes`-job + job-level `if:` and NOT `on.paths` (#2140):
    # GitHub treats a job skipped by its own `if:` as **Success** (it
    # satisfies a required status check), whereas a whole workflow / job
    # skipped by a path filter stays **Pending** and blocks merge. For a
    # *required* test check the `if:` gate is the only shape that skips
    # cleanly. chart.yml uses `on.pull_request.paths` (fine for a publish
    # workflow, wrong for a required test lane).
    #
    # SAFETY NOTE — docs_only fails CLOSED, and this is load-bearing.
    # The classifier is an ALLOW-LIST: `docs_only` starts `false` and only a
    # positive, COMPLETE match (every changed path is docs) flips it to
    # `true`. Any unrecognised path — code, a test, a workflow, a config,
    # anything under `cli/` or `deploy/` — and any inability to compute the
    # diff leaves `docs_only=false` (full run). A required lane that skipped
    # on a *code* diff would let an untested change land green; so the ONLY
    # thing allowed to skip the heavy lanes is a diff we can PROVE is
    # docs-only. `--no-renames` makes a rename appear as delete(old)+add(new)
    # so a code→`*.md` (or `*.md`→code) rename can never smuggle a non-docs
    # path past the allow-list. merge_group / push NEVER fast-path (a queue
    # batch may mix docs + code; a push to `main` must always run the full
    # matrix) — they emit `docs_only=false` unconditionally.
    #
    #   single_connector — the connector name when a PR changes only one
    #                connector folder (plus its tests and docs), else empty
    #                (#5297). The `python-unit-shard` matrix then runs ONE
    #                job with that connector's tests and a fixed contract
    #                set instead of the five shards. Same fail-closed rule as
    #                docs_only: backend/tests/_unit_connector_select.py says
    #                which diffs qualify, and any doubt, any error, and every
    #                merge_group / push run give empty (the full run).
    #
    # Same fork-PR guard as the other jobs; the dependent jobs re-check
    # head.repo in their own `if:`.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      migrations: ${{ steps.detect.outputs.migrations }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      backend_python: ${{ steps.detect.outputs.backend_python }}
      single_connector: ${{ steps.detect.outputs.single_connector }}
    steps:
      - name: Checkout
        # On a PR, HEAD is the test merge: the PR on top of the newest
        # `main`. Its first parent (HEAD^1) is that `main` commit, so
        # depth 2 is enough for the diff below.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
      - name: Detect migration-related + docs-only changes
        id: detect
        run: |
          set -euo pipefail
          # Fail-safe defaults: RUN the migration gate, and DO NOT take the
          # docs-only fast path. Only a positive classification flips either.
          migrations=true
          docs_only=false
          backend_python=true
          single_connector=
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push / merge_group: never fast-path; always the full matrix.
            echo "non-PR event (${{ github.event_name }}) -> migrations=${migrations}, docs_only=${docs_only}, backend_python=${backend_python} (full run)"
          # HEAD^1, not `github.event.pull_request.base.sha`: the event's
          # base sha is `main` as of when the PR was opened. Once `main`
          # moves, a diff against it also lists other PRs' files and a
          # docs-only PR loses the fast path (#4657).
          # core.quotePath=false: git prints a path with non-ASCII bytes
          # (e.g. `café.json`) as is. By default git wraps such a path in
          # double quotes and escapes the bytes, and the classifiers below
          # would not match it (#5310).
          elif ! changed="$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD)"; then
            # Diff unavailable -> keep fail-safe defaults (full run + migration gate on).
            echo "git diff failed -> migrations=${migrations}, docs_only=${docs_only} (fail-safe full run)"
          elif [ -z "${changed}" ]; then
            # No file changes (e.g. an empty / branch-only PR) -> full run, fail-safe.
            echo "empty diff -> migrations=${migrations}, docs_only=${docs_only} (fail-safe full run)"
          elif grep -q '^"' <<<"${changed}"; then
            # git still quotes a path that holds a double quote, a backslash
            # or a control character. The classifiers below work line by
            # line and cannot read such a path -> keep fail-safe defaults.
            printf 'changed files (HEAD^1..HEAD):\n%s\n' "${changed}"
            echo "quoted path in the diff -> migrations=${migrations}, docs_only=${docs_only}, backend_python=${backend_python} (fail-safe full run)"
          else
            printf 'changed files (HEAD^1..HEAD):\n%s\n' "${changed}"
            # --- migration classification (#2140, unchanged) ---
            # Files that make the migration suite meaningful to run: the
            # alembic tree, the relocated migration test suite, the db
            # migrate/migrations modules under test, the compat script, and
            # the workflows that define this gate.
            if printf '%s\n' "${changed}" | grep -qE '^(backend/alembic/|backend/tests/migrations/|backend/src/meho_backplane/db/(migrations|migrate)\.py$|scripts/ci/(check_migration_(compat|heads)|recheck_migration_prs)\.py$|\.github/workflows/(ci|migration-compat|migration-heads)\.yml$)'; then
              migrations=true
              echo "migration-related change detected -> migrations=true"
            else
              migrations=false
              echo "no migration-related change -> migrations=false"
            fi
            # --- docs-only classification (allow-list; #3252) ---
            # docs-only IFF every changed path matches the allow-list:
            #   ^docs/   any file under docs/
            #   \.md$    any Markdown file anywhere (covers CHANGELOG.md,
            #            README.md, docs/**/*.md, backend/README.md, ...)
            # `grep -qvE` exits 0 iff SOME line does NOT match the allow-list
            # — that line is a non-docs path (code / tests / workflows /
            # configs / cli/ / deploy/ ...) and forces the full run. Only when
            # grep finds no such line (exit 1) is the diff proven docs-only.
            if printf '%s\n' "${changed}" | grep -qvE '(^docs/|\.md$)'; then
              docs_only=false
              echo "non-docs file(s) present -> docs_only=false (full run)"
            else
              docs_only=true
              echo "all changed files are docs/*.md -> docs_only=true (fast path)"
            fi
            # --- backend Python classification (#5296) ---
            # backend_python=false only when no changed path, apart from
            # `.md` files, is under backend/ or is this workflow file.
            # grep exits 1 when it selects no line (every file is `.md`);
            # any other non-zero exit is an error and keeps the full run.
            rc=0
            non_md="$(grep -vE '\.md$' <<<"${changed}")" || rc=$?
            if [ "${rc}" -gt 1 ]; then
              echo "could not filter the changed files -> backend_python=true (fail-safe full run)"
            elif grep -qE '^(backend/|\.github/workflows/ci\.yml$)' <<<"${non_md}"; then
              echo "backend/ or ci.yml change detected -> backend_python=true (full run)"
            else
              backend_python=false
              echo "no backend/ change -> backend_python=false (only the tests that read outside backend/)"
            fi
            # --- one-connector classification (#5297) ---
            # An error in the tool leaves single_connector empty (full run).
            if [ "${docs_only}" = "false" ]; then
              single_connector="$(printf '%s\n' "${changed}" | python3 backend/tests/_unit_connector_select.py detect)" || single_connector=
              echo "single_connector=${single_connector:-<empty>} (empty -> five unit shards)"
            fi
          fi
          {
            echo "migrations=${migrations}"
            echo "docs_only=${docs_only}"
            echo "backend_python=${backend_python}"
            echo "single_connector=${single_connector}"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Required unit lane, sharded (#3251). The pre-#3251 monolithic
  # `python-lint-test` job (ruff + ruff format + mypy + the whole ~13k-test
  # unit sweep, serial, ~19-min wall) was the single biggest contributor to
  # PR wall-time. It is now three cooperating jobs, mirroring the #3172/#3177
  # coverage-sweep shape (deterministic file-level matrix + fan-in):
  #
  #   python-lint       — ruff check + ruff format --check + mypy. Whole-tree,
  #                       unshardable-by-file, ~1-2 min; runs ONCE on the light
  #                       pool. Non-required check.
  #   python-unit-shard — the pytest unit sweep as a 5-way matrix; the test
  #                       files are split by measured time so every shard
  #                       takes about as long (heavy pool, in parallel).
  #                       Non-required checks (`Python unit shard N/5`).
  #   python-unit-lane  — FAN-IN carrying the EXACT branch-protection required
  #                       context `Python (ruff + mypy + pytest)`; fails iff
  #                       python-lint or ANY shard did not pass. Branch
  #                       protection / the ruleset are UNTOUCHED — the required
  #                       name simply moved from the old monolithic job to this
  #                       fan-in (the `python-coverage-combine` shape #3177 used
  #                       to keep quality-gate.yml's contract byte-identical).
  #
  # Only pytest fans out: ruff + ruff format + mypy are whole-tree checks that
  # cannot be split by test file and cost ~1-2 min, so duplicating them per
  # shard would be pure waste — they run exactly once in python-lint.
  # ---------------------------------------------------------------------------
  python-lint:
    name: Python lint + typecheck (ruff + mypy)
    # Non-required check — the branch-protection required context lives on the
    # python-unit-lane fan-in below. Whole-tree ruff + ruff format + mypy: none
    # of it is shardable by test file, none of it needs testcontainers / the
    # vendor spec-shelf / the embedding or spaCy models, and it is CPU-cheap
    # (~1-2 min), so it runs ONCE here on a GitHub-hosted runner rather than N
    # times inside every pytest shard. Nothing in it needs the internal network
    # (#4626). Same fork-PR guard as every other job,
    # plus the #3252 docs-only skip: a proven docs-only PR skips this job (and
    # the shards) so the required unit-lane fan-in reports success-by-skip.
    # `needs: changes` makes `docs_only` readable here; if the detect job
    # fails, this job skip-cascades and the fan-in fails the required context
    # CLOSED (it asserts `needs.changes.result == 'success'`). It also skips
    # when `backend_python` is `false` (#5296): ruff and mypy read only
    # backend/.
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       needs.changes.outputs.docs_only != 'true' &&
       needs.changes.outputs.backend_python != 'false')
    runs-on: ubuntu-latest
    # Twice the ~1-2 min observed cost, per the file's per-job cap convention.
    timeout-minutes: 10
    defaults:
      run:
        # backend/ is the only Python project today; pyproject.toml
        # and uv.lock both live here.
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        # uv is the project's canonical Python toolchain (pyproject.toml locks
        # a uv.lock). enable-cache keys the uv download cache on uv.lock, shared
        # with every sibling Python job.
        #
        # `version` pins uv itself. Without it, setup-uv installs the newest
        # uv, so a uv release can break CI with no change on our side: uv
        # 0.13.0 made Python 3.15 its default, and the sync below failed
        # because onnxruntime has no 3.15 wheels yet. Raise this pin by hand,
        # in every setup-uv step (ci.yml, eval-gate.yml, docs-site.yml).
        #
        # The Python version comes from backend/.python-version (3.14, the
        # same as the image's python:3.14-slim). uv reads that file for every
        # uv command in CI: they all run in backend/ or pass --project backend.
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Sync Python environment (locked)
        # --locked refuses to update uv.lock; if pyproject.toml drifted from the
        # lock, CI fails here rather than silently bumping deps. --all-groups
        # pulls the dev tools (ruff, mypy) declared in [dependency-groups.dev].
        run: uv sync --locked --all-groups

      - name: Ruff check (lint)
        # ruff config lives in backend/pyproject.toml [tool.ruff.lint].
        # Targets the src/ + tests/ trees the project ships.
        run: uv run ruff check src/ tests/

      - name: Ruff format --check
        # Format gate — non-zero exit if any file would be reformatted.
        # Authors run `uv run ruff format` locally before pushing.
        run: uv run ruff format --check src/ tests/

      - name: Mypy (strict)
        # [tool.mypy] in pyproject.toml is `strict = true` against
        # files = ["src"]. Per-dep ignores (authlib, hvac, requests)
        # are already declared there.
        run: uv run mypy src/

  python-unit-shard:
    name: ${{ needs.changes.outputs.single_connector != '' && format('Python unit tests for connector {0}', needs.changes.outputs.single_connector) || format('Python unit shard {0}/5', matrix.shard) }}
    # One-connector run (#5297): when `changes` sets single_connector, the
    # matrix below has ONE leg, and the pytest step runs that connector's
    # tests plus the contract set (tests/_unit_connector_select.py) instead
    # of a quarter of the suite. Only a pull request can get there; the
    # merge queue and pushes to `main` always run the five shards.
    #
    # Non-required checks (one per matrix leg: `Python unit shard 1/5`
    # to `.../5/5`) — the required context is carried by
    # the python-unit-lane fan-in below. This is the pytest half of the old
    # required lane, split into a deterministic 5-way file-level matrix
    # (#3251, 3 shards; #4655 raised it to 4 when the 3 shards reached the
    # 660 s budget; #4809 split by measured file time instead of every
    # 4th file; #5433 raised it to 5) so its serial wall runs as parallel shards.
    #
    # Fork-PR guard: never execute project code from a fork on the self-hosted
    # runner pool. Same stance as the old lane — job-level so no step ever
    # starts on a fork PR. On a fork PR all five legs skip (→ reported
    # Success), which the fan-in's own fork guard mirrors. Plus the #3252
    # docs-only skip (identical shape to python-lint): a proven docs-only PR
    # skips all five legs → the fan-in reports success-by-skip. `needs:
    # changes` makes `docs_only` readable; a detect-job failure skip-cascades
    # these legs and the fan-in fails the required context CLOSED. The legs
    # also skip when `backend_python` is `false` (#5296); the job
    # `python-outside-backend` then runs the tests that read outside backend/.
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       needs.changes.outputs.docs_only != 'true' &&
       needs.changes.outputs.backend_python != 'false')
    # The heavy runner pool (#761); its sizes live outside this repo. Only the
    # pytest sweep is CPU/memory-bound enough to want the extra cores;
    # ruff/mypy run once in python-lint on a GitHub-hosted runner.
    runs-on: meho-runners-ci-heavy
    strategy:
      # 5 shards (#3251 started with 3; #4655 raised it to 4 after the
      # slowest shard reached the 660 s budget; #5433 raised it to 5 when all
      # four shards took 780-930 s on busy runners, and fresh file times
      # alone would still leave them near 850 s — measure, then rebalance,
      # do not raise the budget). fail-fast: false — one shard's red tests must NOT
      # cancel the others, so a broad breakage surfaces every failing shard in
      # one run (the fan-in still fails if ANY leg fails). To change the shard
      # count, edit BOTH the matrix and the `TOTAL` in the pytest step, in
      # lockstep. To rebalance the shards, refresh the measured file times
      # (tests/_unit_shard_durations.json, see tests/_unit_shard_split.py).
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.single_connector != '' && '[1]' || '[1, 2, 3, 4, 5]') }}
    # 20-min cap: hang backstop only. Expected job wall is ~8 min (setup ~2 min
    # + pytest ~6 min); the perf-budget step below is the PR-level early-warning
    # gate that fires well before this cap. The pre-shard lane's 25-min cap
    # covered a ~18-min serial pytest wall; a ~6-min shard needs far less. The
    # old lane's OOM/heartbeat history (why the whole-suite lane dropped --cov
    # and pinned -n 3) is preserved verbatim in the pytest step comment below.
    timeout-minutes: 20
    env:
      # Surfaced as a job-level env var purely so the Docker Hub login
      # step can test it in an `if:`. The `secrets` context is NOT
      # available in a step-level `if:` (GitHub's context-availability
      # table allows it in `with:` / `env:` / `run:` only), so reading
      # the secret through `env` is what makes the guard evaluatable.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # Route testcontainers pulls through the in-cluster Harbor proxy
      # cache (claude-rdc-hetzner-dc#463; project `dockerhub-proxy` public,
      # anonymous consumer auth, wired into runner DinD via
      # meho-internal#75). The test code reads these env vars with a
      # docker.io short-name default — see backend/tests/test_db_engine.py
      # `MEHO_TEST_PGVECTOR_IMAGE`, backend/tests/test_broadcast_client.py
      # `MEHO_TEST_VALKEY_IMAGE`, backend/tests/integration/
      # test_connectors_vmware_rest_vcsim.py `MEHO_TEST_VCSIM_IMAGE` —
      # so the env-only swap requires no source-code changes.
      # `docker/login-action` below stays load-bearing until #78's Half
      # B sees a green cache-hit week and retires it.
      MEHO_TEST_PGVECTOR_IMAGE: harbor.evba.lab/dockerhub-proxy/pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
      MEHO_TEST_VALKEY_IMAGE: harbor.evba.lab/dockerhub-proxy/valkey/valkey:8
      # vcsim pinned to an explicit release tag (same rule as the
      # pgvector/valkey/Vault rows — never `:latest`) so the
      # vmware-rest acceptance tests are reproducible and an upstream
      # image push can't break or silently alter CI without a commit.
      # v0.55.1 is what `:latest` resolved to at pin time
      # (digest sha256:fcca7b87bfb16c3f7b8c8aa94d9d95855891c86fcb216bd6d8dc7b27af385085).
      MEHO_TEST_VCSIM_IMAGE: harbor.evba.lab/dockerhub-proxy/vmware/vcsim:v0.55.1
      # Vault dev-mode container for the G3.3-T7 kv/sys/auth e2e suite
      # (backend/tests/integration/test_connectors_vault_dev_e2e.py).
      # Same env-knob shape as the rows above: the test reads this with
      # a docker.io short-name default (`hashicorp/vault:1.18`), so the
      # Harbor-proxy swap is config-only — no source change. Pinned to
      # the 1.18 LTS minor (not `:latest`) so an upstream Vault release
      # never breaks an unrelated PR.
      MEHO_TEST_VAULT_IMAGE: harbor.evba.lab/dockerhub-proxy/hashicorp/vault:1.18
      # #2949 — vendor vCenter spec-shelf wiring (see the checkout step
      # below + docs/decisions/vendor-spec-ci-provisioning.md).
      # SPEC_SHELF_TOKEN_PRESENT surfaces *presence* of the
      # SPEC_SHELF_TOKEN secret as a job-level boolean so the shelf
      # checkout step can gate on it — the `secrets` context is NOT
      # available in a step-level `if:` (same constraint the
      # DOCKERHUB_USERNAME row above works around). Unlike that row,
      # only the presence flag is surfaced, never the token value, so
      # the secret is not exported into every step's environment.
      SPEC_SHELF_TOKEN_PRESENT: ${{ secrets.SPEC_SHELF_TOKEN != '' }}
      # Points the vCenter spec resolvers (tests/acceptance/
      # _vcenter_spec.py + tests/integration/test_operations_ingest_
      # vcenter.py) at the spec-shelf checkout. Set UNCONDITIONALLY:
      # when the shelf checkout was skipped (secret absent — fork PRs,
      # Dependabot runs, not-yet-provisioned repos) the directory does
      # not exist, the resolvers return None, and the spec-backed lanes
      # pytest.skip exactly as they did before #2949. When the checkout
      # ran, the seconds-cheap reconcile lanes run for real in this job;
      # the G0.7 canary's full-ingest tests are opted out here and run
      # armed in python-integration-shard instead (#2980 — see this job's
      # MEHO_SKIP_SPEC_INGEST_TESTS env row). The docs-root form (not
      # MEHO_VCENTER_OPENAPI_VCENTER / _VI_JSON) is deliberate: it is
      # the only single setting that lights every spec lane, because
      # test_operations_ingest_vcenter.py predates the explicit
      # per-file env vars and reads only the legacy var or this root.
      MEHO_CONSUMER_DOCS_ROOT: ${{ github.workspace }}/spec-shelf/docs
    defaults:
      run:
        # backend/ is the only Python project today; pyproject.toml
        # and uv.lock both live here.
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Start memory sampling
        # Feeds the "Print peak memory" step at the end of this job. A small
        # background loop reads this container's cgroup v2 memory files once a
        # second and keeps the highest values until that step stops it. It
        # never fails the job.
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          set +e
          cg=/sys/fs/cgroup
          if [ ! -r "${cg}/memory.current" ] || [ ! -r "${cg}/memory.stat" ]; then
            echo "No cgroup v2 memory files here, so no sampling."
            exit 0
          fi
          sample() {
            total_max=0; ws_max=0; anon_max=0; n=0
            while :; do
              read -r total < "${cg}/memory.current"
              anon=0; inactive_file=0
              while read -r key value; do
                case "${key}" in
                  anon) anon=${value} ;;
                  inactive_file) inactive_file=${value} ;;
                esac
              done < "${cg}/memory.stat"
              total=${total:-0}
              ws=$(( total - inactive_file ))
              if [ "${total}" -gt "${total_max}" ]; then total_max=${total}; fi
              if [ "${ws}" -gt "${ws_max}" ]; then ws_max=${ws}; fi
              if [ "${anon}" -gt "${anon_max}" ]; then anon_max=${anon}; fi
              n=$(( n + 1 ))
              echo "${total_max} ${ws_max} ${anon_max} ${n}" > "${RUNNER_TEMP}/memory-samples.tmp"
              mv -f "${RUNNER_TEMP}/memory-samples.tmp" "${RUNNER_TEMP}/memory-samples.txt"
              sleep 1
            done
          }
          sample </dev/null >/dev/null 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/memory-sampler.pid"
          echo "Memory sampling started: one sample per second."

      - name: Checkout vendor spec-shelf (secret-gated, #2949; nsx #2981)
        # The vendor OpenAPI specs (vSphere: vcenter.yaml ~961 paths +
        # vi-json.yaml ~2,195 paths; NSX: the manager-served
        # nsx_api / nsx_policy_api pair, ~3,510 paths) are
        # Broadcom/VMware vendor-licensed and deliberately NOT
        # committed to this public repo — they live in the operator's
        # private spec-shelf repo. This step fetches ONLY the pinned
        # shelf directories into the ephemeral runner workspace so the
        # real-spec ingest/reconcile lanes stop skipping. Licensing
        # record + provisioning runbook (secret scope, signoff gate):
        # docs/decisions/vendor-spec-ci-provisioning.md. The specs are
        # never committed, never uploaded as artifacts (the
        # upload-artifact steps in this workflow enumerate exact
        # coverage files only), and never printed to logs.
        #
        # SPEC_SHELF_TOKEN is a fine-grained PAT: Contents read-only on
        # the single private shelf repo, nothing else. Secret absent →
        # this step skips → the spec lanes pytest.skip exactly as
        # before this step existed. Fork PRs never reach this step (the
        # job-level fork guard skips the whole job) and would not see
        # the secret anyway (GitHub withholds secrets from fork-PR
        # runs). Dependabot runs read the Dependabot secret store,
        # where this secret is deliberately not mirrored, so they skip
        # too.
        #
        # Sharded (#3251): every shard runs this checkout, because each
        # shard's file set may include the spec-backed reconcile
        # lanes; the cone-mode sparse + blob:none filter keeps it cheap
        # (~0.4 MB argocd-3.3 + … a few tens of MB total), and the
        # SPEC_SHELF_TOKEN PAT is read-only, so the parallel fetches are
        # safe.
        if: env.SPEC_SHELF_TOKEN_PRESENT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: evoila-bosnia/claude-rdc-hetzner-dc
          token: ${{ secrets.SPEC_SHELF_TOKEN }}
          path: spec-shelf
          # Cone-mode sparse checkout of the shelf directories only +
          # lazy blob filter: the runner materialises just the pinned
          # spec files (~0.4 MB argocd-3.3 + ~9.8 MB azure-arm-2026.10 +
          # ~0.1 MB cloud-builder-5.0 / -5.1 / -5.2 +
          # ~13 MB esxi-9.0 + ~0.2 MB
          # hetzner-robot-2026-04 + ~33 MB nsx-9.0 +
          # ~0.1 MB salt-raas-8.18 + ~2 MB sddc-manager-9.0 +
          # ~38 MB vcenter-8.0 + ~18 MB
          # vcenter-9.0 + ~3 MB vcf-automation-9.0 + ~0.4 MB each
          # vcf-automation-9.0-reference / -9.1 / -9.1.1 + ~0.4 MB
          # vcf-installer-9.0 + ~0.4 MB vcf-installer-9.1 + ~5 MB
          # vcf-operations-9.0 + ~0.1 MB vcf-operations-orchestrator-9.0
          # / -9.1 + ~1.3 MB vcf-protection-and-recovery-9.1
          # + ~0.4 MB vks-9.0 + ~6 MB vmware-cloud-director-10.6), not the
          # whole consumer repo. No
          # `ref:` pin — the shelf's default branch IS the
          # operator-curated pin (the directories are version-named),
          # matching the local-dev contract documented in
          # tests/acceptance/_vcenter_spec.py + tests/_spec_shelf.py.
          # Keep the list sorted.
          sparse-checkout: |
            docs/argocd-3.3
            docs/azure-arm-2026.10
            docs/cloud-builder-5.0
            docs/cloud-builder-5.1
            docs/cloud-builder-5.2
            docs/esxi-9.0
            docs/fleet-lcm-9.0
            docs/harbor-2.12
            docs/hetzner-robot-2026-04
            docs/keycloak-26.3
            docs/loki-3.7
            docs/nsx-9.0
            docs/proxmox-8.4
            docs/rabbitmq-4.3
            docs/salt-raas-8.18
            docs/sddc-manager-9.0
            docs/sddc-manager-9.1
            docs/vcenter-8.0
            docs/vcenter-9.0
            docs/vcf-automation-9.0
            docs/vcf-automation-9.0-reference
            docs/vcf-automation-9.1
            docs/vcf-automation-9.1.1
            docs/vcf-installer-9.0
            docs/vcf-installer-9.1
            docs/vcf-operations-9.0
            docs/vcf-operations-orchestrator-9.0
            docs/vcf-operations-orchestrator-9.1
            docs/vcf-protection-and-recovery-9.1
            docs/vks-9.0
            docs/vmware-cloud-director-10.6
          filter: blob:none
          # Read-only consumer; never pushes. Don't leave the token in
          # the shelf clone's local git config after checkout.
          persist-credentials: false

      - name: Verify spec-shelf provisioned the pinned specs
        # Fail-loud layout guard: once the secret exists, a shelf
        # layout move (or a sparse-checkout typo here) must fail THIS
        # job — otherwise the resolvers would return None and the spec
        # lanes would silently go back to skipping, undetected (the
        # exact regression #2949 closes). Without the secret this step
        # skips and lane-skip stays the documented degraded mode.
        # Prints file *presence* only — never spec content.
        if: env.SPEC_SHELF_TOKEN_PRESENT == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for f in \
            spec-shelf/docs/argocd-3.3/argocd-swagger.json \
            spec-shelf/docs/azure-arm-2026.10/specification/resources/resource-manager/Microsoft.Resources/subscriptions/stable/2022-12-01/subscriptions.json \
            spec-shelf/docs/cloud-builder-5.0/cloud-builder-5.0.0-reference-operations.tsv \
            spec-shelf/docs/cloud-builder-5.1/cloud-builder-5.1.0-reference-operations.tsv \
            spec-shelf/docs/cloud-builder-5.1/cloud-builder-5.1.1-reference-operations.tsv \
            spec-shelf/docs/cloud-builder-5.2/cloud-builder-5.2.0-reference-operations.tsv \
            spec-shelf/docs/cloud-builder-5.2/cloud-builder-5.2.1-reference-operations.tsv \
            spec-shelf/docs/cloud-builder-5.2/cloud-builder-5.2.2-reference-operations.tsv \
            spec-shelf/docs/cloud-builder-5.2/cloud-builder-5.2.3-reference-operations.tsv \
            spec-shelf/docs/cloud-builder-5.2/cloud-builder-5.2.4-reference-operations.tsv \
            spec-shelf/docs/esxi-9.0/wsdl/vim/vim.wsdl \
            spec-shelf/docs/fleet-lcm-9.0/fleet-lcm-openapi.yaml \
            spec-shelf/docs/harbor-2.12/harbor-swagger.yaml \
            spec-shelf/docs/hetzner-robot-2026-04/webservice-en.md \
            spec-shelf/docs/keycloak-26.3/keycloak-admin-openapi.json \
            spec-shelf/docs/loki-3.7/loki-http-api.md \
            spec-shelf/docs/nsx-9.0/nsx_api.openapi3.json \
            spec-shelf/docs/nsx-9.0/nsx_policy_api.openapi3.json \
            spec-shelf/docs/proxmox-8.4/apidata.js \
            spec-shelf/docs/rabbitmq-4.3/http-api-index.md \
            spec-shelf/docs/rabbitmq-4.3/rabbit_shovel_mgmt_shovels.erl \
            spec-shelf/docs/salt-raas-8.18/salt-raas-8.18-reference-operations.tsv \
            spec-shelf/docs/sddc-manager-9.0/sddc-manager-openapi.json \
            spec-shelf/docs/sddc-manager-9.1/sddc-manager-openapi.json \
            spec-shelf/docs/vcenter-8.0/vcenter.yaml \
            spec-shelf/docs/vcenter-8.0/vi-json-8.0u1.yaml \
            spec-shelf/docs/vcenter-8.0/vi-json-8.0u2.yaml \
            spec-shelf/docs/vcenter-8.0/vi-json-8.0u3.yaml \
            spec-shelf/docs/vcenter-8.0/vsan/8.0u1/vsan-8.0u1-methods.txt \
            spec-shelf/docs/vcenter-8.0/vsan/8.0u1/vsanmgmtObjects.py \
            spec-shelf/docs/vcenter-8.0/vsan/8.0u2/vsan-8.0u2-methods.txt \
            spec-shelf/docs/vcenter-8.0/vsan/8.0u2/vsanmgmtObjects.py \
            spec-shelf/docs/vcenter-9.0/vcenter.yaml \
            spec-shelf/docs/vcenter-9.0/vi-json.yaml \
            spec-shelf/docs/vcf-automation-9.0/swagger-vra-sdk-go-v0.6.5/vra-iaas.json \
            spec-shelf/docs/vcf-automation-9.0-reference/vcf-automation-9.0-provider-infrastructure-apis-reference-operations.tsv \
            spec-shelf/docs/vcf-automation-9.1/vcf-automation-9.1-provider-infrastructure-apis-reference-operations.tsv \
            spec-shelf/docs/vcf-automation-9.1.1/vcf-automation-9.1.1-provider-infrastructure-apis-reference-operations.tsv \
            spec-shelf/docs/vcf-installer-9.0/vcf-installer-openapi.json \
            spec-shelf/docs/vcf-installer-9.1/vcf-installer-openapi.json \
            spec-shelf/docs/vcf-operations-9.0/vcf-operations-for-logs-openapi.json \
            spec-shelf/docs/vcf-operations-9.0/vcf-operations-openapi.ingestable.json \
            spec-shelf/docs/vcf-operations-orchestrator-9.0/vcf-operations-orchestrator-9.0-reference-operations.tsv \
            spec-shelf/docs/vcf-operations-orchestrator-9.1/vcf-operations-orchestrator-9.1-reference-operations.tsv \
            spec-shelf/docs/vcf-protection-and-recovery-9.1/recovery-srm-v2.yaml \
            spec-shelf/docs/vcf-protection-and-recovery-9.1/replication-vr-v2.yaml \
            spec-shelf/docs/vks-9.0/vks-paths-from-vcenter.txt \
            spec-shelf/docs/vmware-cloud-director-10.6/cloudapi-39.2.json; do
            if [ ! -f "$f" ]; then
              echo "::error title=Spec-shelf layout drift::${f} missing after the spec-shelf checkout — the real-spec lanes would silently skip. Fix the shelf layout or this workflow's sparse-checkout path."
              exit 1
            fi
          done
          echo "spec-shelf OK: argocd-swagger.json present under spec-shelf/docs/argocd-3.3/; the Azure Resource Manager specs (subscriptions.json and the rest) present under spec-shelf/docs/azure-arm-2026.10/; the Cloud Builder reference lists present under spec-shelf/docs/cloud-builder-5.0/ + spec-shelf/docs/cloud-builder-5.1/ + spec-shelf/docs/cloud-builder-5.2/; vim.wsdl present under spec-shelf/docs/esxi-9.0/wsdl/vim/; fleet-lcm-openapi.yaml present under spec-shelf/docs/fleet-lcm-9.0/; harbor-swagger.yaml present under spec-shelf/docs/harbor-2.12/; webservice-en.md present under spec-shelf/docs/hetzner-robot-2026-04/; keycloak-admin-openapi.json present under spec-shelf/docs/keycloak-26.3/; loki-http-api.md present under spec-shelf/docs/loki-3.7/; nsx_api.openapi3.json + nsx_policy_api.openapi3.json present under spec-shelf/docs/nsx-9.0/; apidata.js present under spec-shelf/docs/proxmox-8.4/; http-api-index.md + rabbit_shovel_mgmt_shovels.erl present under spec-shelf/docs/rabbitmq-4.3/; salt-raas-8.18-reference-operations.tsv present under spec-shelf/docs/salt-raas-8.18/; sddc-manager-openapi.json present under spec-shelf/docs/sddc-manager-9.0/ + spec-shelf/docs/sddc-manager-9.1/; vcenter.yaml + vi-json-8.0u1.yaml + vi-json-8.0u2.yaml + vi-json-8.0u3.yaml + vsan/8.0u1/vsan-8.0u1-methods.txt + vsan/8.0u2/vsan-8.0u2-methods.txt + the two vsanmgmtObjects.py present under spec-shelf/docs/vcenter-8.0/; vcenter.yaml + vi-json.yaml present under spec-shelf/docs/vcenter-9.0/; vra-iaas.json present under spec-shelf/docs/vcf-automation-9.0/swagger-vra-sdk-go-v0.6.5/; the provider-infrastructure-apis reference list present under spec-shelf/docs/vcf-automation-9.0-reference/ + spec-shelf/docs/vcf-automation-9.1/ + spec-shelf/docs/vcf-automation-9.1.1/; vcf-installer-openapi.json present under spec-shelf/docs/vcf-installer-9.0/ + spec-shelf/docs/vcf-installer-9.1/; vcf-operations-openapi.ingestable.json + vcf-operations-for-logs-openapi.json present under spec-shelf/docs/vcf-operations-9.0/; the orchestrator reference list present under spec-shelf/docs/vcf-operations-orchestrator-9.0/ + spec-shelf/docs/vcf-operations-orchestrator-9.1/; recovery-srm-v2.yaml + replication-vr-v2.yaml present under spec-shelf/docs/vcf-protection-and-recovery-9.1/; vks-paths-from-vcenter.txt present under spec-shelf/docs/vks-9.0/; cloudapi-39.2.json present under spec-shelf/docs/vmware-cloud-director-10.6/"

      - name: Docker Hub login (for testcontainers pulls)
        # Pulls inside the DinD daemon (testcontainers PostgresContainer
        # spinning up pgvector/pgvector:pg16 for test_db_engine.py /
        # test_migration_rollback.py / tests/integration/*, plus
        # vmware/vcsim for the G3.1-T8 vmware-rest acceptance tests
        # under tests/acceptance/test_vmware_rest_*.py) share the
        # ARC cluster's NAT egress IP, which exhausts Docker Hub's
        # 100/6h anonymous bucket. Authenticated Personal-tier doubles
        # it to 200/6h
        # (https://docs.docker.com/docker-hub/usage/pulls/). Same
        # org-level secrets security-scan.yml uses, provisioned at
        # the evoila org level (visibility `all`) with 1Password
        # vault custody — see meho-internal#74 for the regression
        # context this addresses, and meho-internal
        # `docs/dockerhub-ci-credential-custody.md` for where the
        # credential actually lives and how to rotate it (the vault
        # and item names stay in the internal repo; this one is
        # public). Long-term, the in-cluster proxy cache from
        # claude-rdc-hetzner-dc#463 retires this step.
        #
        # The `if:` guard is what keeps Dependabot PRs green. A
        # Dependabot-triggered run reads the *Dependabot* secret store,
        # not the Actions one, so `secrets.DOCKERHUB_USERNAME` is empty
        # there — and `docker/login-action` hard-fails with "Username and
        # password required" instead of no-opping, which failed this job
        # (and every other job carrying this step) on all 19 open
        # Dependabot PRs. Skipping the login is safe: every image above
        # resolves through the harbor.evba.lab proxy cache, so an
        # unauthenticated run still pulls — it only gives up the Docker
        # Hub rate-limit headroom the login buys.
        #
        # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN have since been mirrored
        # into the *org-level* Dependabot secret store (visibility
        # `all`, 2026-07-30), so on a Dependabot run this guard now
        # evaluates true and the login proceeds as it does anywhere
        # else. Keep the guard regardless: it is what stops a missing
        # or rotated secret from hard-failing an entire job instead of
        # degrading to unauthenticated pulls. If this step starts
        # *skipping* on Dependabot PRs again, the org Dependabot secret
        # is gone or expired — check there before touching the workflow.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install uv
        # uv is the project's canonical Python toolchain (pyproject.toml
        # locks a uv.lock, not a requirements.txt). enable-cache: true
        # opts into the action's built-in cache for the uv download
        # cache directory, keyed by uv.lock — repeat installs on the
        # same lockfile are near-instant, so the five shards share one
        # warm uv cache. `version` pins uv; see the python-lint job for
        # why, and for where the Python version comes from.
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Sync Python environment (locked)
        # --locked refuses to update uv.lock; if pyproject.toml drifted
        # from the lock, CI fails here rather than silently bumping
        # deps. --all-groups pulls dev tools (ruff, mypy, pytest, etc.)
        # declared in [dependency-groups.dev].
        run: uv sync --locked --all-groups

      - name: Cache fastembed model (drift-guard + slow-lane)
        # The drift-guard below downloads the ~67 MB default ONNX model
        # from HuggingFace. Without this cache every run re-fetches it
        # unauthenticated over the cluster's shared NAT egress (HF
        # rate-limits anonymous pulls) — pure repeated cost on the
        # slowest required job. Key on uv.lock: fastembed's version is
        # pinned there, so a fastembed bump (which can remap the HF
        # source/filename) misses the cache and the model re-downloads
        # exactly once, then re-saves. restore-keys lets an unrelated
        # lock change still reuse the prior model blob. All five shards
        # share this one cache entry (same key), so steady-state only the
        # first cold run pays the download.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.fastembed-cache
          key: fastembed-model-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            fastembed-model-${{ runner.os }}-

      - name: Embedding-model drift guard (evoila/meho#574)
        # Regression guard for #574: actually instantiate
        # TextEmbedding(DEFAULT_EMBEDDING_MODEL) + run one real embed,
        # so a fastembed<->model-repo drift (the model repo dropping
        # `model_optimized.onnx`, fastembed remapping the HF source,
        # an incompatible fastembed bump, …) fails THIS PR instead of
        # CrashLooping in production on a clean deploy. Green ci.yml on
        # a runtime-fetched model cannot catch this; this step does.
        # The image build runs the same module to BAKE the model
        # (backend/Dockerfile); here we only assert, into the cached
        # workspace dir (the runner sandbox can't write `/opt`).
        # HF_TOKEN (if the secret is configured) authenticates the
        # download for higher HF rate limits + faster pulls; absent →
        # empty → anonymous (current behaviour, no regression).
        env:
          MEHO_WARM_CACHE_DIR: ${{ github.workspace }}/.fastembed-cache
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python -m meho_backplane.retrieval.warm

      - name: Provision spaCy NLP model for Presidio Tier-2 (#1072)
        # G11.4-T3 (#1072) ships the Tier-2 Presidio NER adapter
        # (capability-flagged per policy). The acceptance gate
        # (``Tier-2 redacts a free-text field containing a person
        # name / IP / FQDN``) requires a spaCy model on the host;
        # spaCy ships no model out of the box and Presidio's
        # AnalyzerEngine raises ``Tier2NotAvailableError`` without one.
        # ``en_core_web_sm`` (~12 MB) is the fast-CI choice; production
        # Docker images bake ``en_core_web_lg`` (~560 MB, the Presidio
        # documented default for higher NER recall). The acceptance
        # tests in tests/test_redaction_presidio.py and the Tier-2
        # middleware test gate on ``spacy.util.is_package(...)``,
        # accepting either model -- so this step suffices for the
        # unit lane's correctness signal without paying the ``lg``
        # download wall every run. Each shard provisions the sm model
        # (its file set may include the Tier-2 lanes); the ~12 MB
        # download is cheap enough to not warrant caching.
        #
        # ``MEHO_REDACTION_SPACY_MODEL`` is the runtime override the
        # presidio.py adapter reads; setting it here pins the unit
        # job's engine to the ``sm`` model regardless of the
        # adapter's default. Production deployments leave the env
        # unset and let the adapter pick the documented default.
        run: |
          uv run python -m spacy download en_core_web_sm
          # Smoke-test the import path so a presidio<->spacy model-
          # version mismatch fails THIS PR, not the integration lane.
          MEHO_REDACTION_SPACY_MODEL=en_core_web_sm \
            uv run python -c "from meho_backplane.redaction import get_engines; get_engines('en')"

      - name: Install Helm
        # The chart render tests (tests/test_chart_*.py) call `helm
        # template`. Without helm they skip, so a broken chart test could
        # stay hidden on main. Same pinned action and Helm version as
        # chart.yml and the helm-lint-template job below. Every shard
        # needs it: the file split can put a chart test file in any shard.
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.16.4

      - name: Install PHP CLI
        # The pfSense user-write tests
        # (tests/test_connectors_pfsense_user_write_ops.py) run the
        # `pfSsh.php playback` fragment with the php command-line
        # interpreter against a synthetic config. Without php they skip,
        # so a fragment that changes the wrong user could stay hidden on
        # main. Same `sudo -n apt-get` pattern as the Go lane's C-toolchain
        # step below. Every shard needs it: the file split can put the
        # test file in any shard.
        #
        # `apt-get update` exits 100 when any one package index fails to
        # download, even one that php-cli does not need. The runner image
        # carries the git-core PPA (it installs a newer git from there), and
        # that mirror answered 503 in a merge-queue run (#4759), which
        # dropped the pull request from the queue. apt had already retried
        # the file three times in that run, so more retries alone do not
        # help. So a failed update is a warning, not the end of the step:
        # apt keeps the indexes it did download, and the install below
        # fails on its own when the Ubuntu indexes are missing.
        shell: bash
        run: |
          set -euo pipefail
          if command -v php >/dev/null 2>&1; then
            echo "php ready: $(php --version | head -1)"
            exit 0
          fi
          if ! sudo -n DEBIAN_FRONTEND=noninteractive apt-get update -y; then
            echo "::warning::apt-get update could not refresh every package index; installing php-cli from the indexes that did download"
          fi
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends php-cli
          php --version | head -1

      - name: Pytest (unit shard ${{ matrix.shard }}/5)
        # `shell: bash` for `mapfile` + arrays (and the pipefail/-e the
        # default self-hosted shell does not enable — #2865). Under -e a
        # failing `uv run pytest` exits the step immediately, so the
        # perf-budget check below can never mask a red suite.
        shell: bash
        env:
          # The chart render tests FAIL (not skip) when helm is missing,
          # so losing the Install Helm step above cannot hide them again.
          MEHO_REQUIRE_HELM: "1"
          # Same for the pfSense fragment tests and the Install PHP CLI
          # step above: FAIL (not skip) when php is missing.
          MEHO_REQUIRE_PHP: "1"
          # Pin Tier-2's spaCy model to the unit-lane choice so the
          # acceptance tests in test_redaction_presidio.py + the
          # tier2 path in test_redaction_middleware.py exercise the
          # real engine path instead of skipping. The integration
          # lane stays on the adapter's documented default
          # (en_core_web_lg) once that lane provisions the heavier
          # model.
          MEHO_REDACTION_SPACY_MODEL: en_core_web_sm
          # Lane placement (#2980): opt this sweep out of the G0.7
          # canary's full-ingest spec tests. With the spec shelf armed
          # (#2949/#2966) each of those tests re-runs the full two-spec
          # ingest (~3,470 ops through parse + register + embedding +
          # grouping — the fixture is function-scoped by design), which
          # took the whole sweep from 478 s (2026-08-17 16:57Z, canary
          # still erroring fast) past this job's cap. Per this
          # workflow's perf-budget discipline (#898/#793/#827): the slow
          # path is relocated, not the cap raised. The canary's
          # full-ingest tests run armed in the python-integration-shard job
          # (which selects the file explicitly, see its Pytest step);
          # its fixture-less self-checks and every seconds-cheap
          # reconcile lane stay in this sweep. Honored by a
          # collection-time skipif marker in tests/acceptance/
          # test_g07_vsphere_canary.py (fixture-level backstop in
          # vcenter_spec_path); rule of record in
          # docs/decisions/spec-reconcile-guards-standard.md. The
          # canary module lands in exactly one shard, so this opt-out
          # must stay on every shard.
          MEHO_SKIP_SPEC_INGEST_TESTS: "1"
          # #5297: set only on a pull request that changes one connector.
          SINGLE_CONNECTOR: ${{ needs.changes.outputs.single_connector }}
        # PARALLELIZED two ways now (#3251): by test FILE across shards
        # (this matrix) AND pytest-xdist WITHIN each shard. #585 unblocked
        # xdist by adding process-wide global-registry snapshot/restore +
        # deterministic MCP-module import in tests/conftest.py, eliminating
        # the cross-module isolation leaks that made `-n auto` red.
        # File-level sharding is strictly COARSER than what xdist
        # --dist loadscope already does across workers (whole modules stay
        # together, conftest semantics are identical to a full run), so a
        # suite that is xdist-safe is shard-safe — proven live by the
        # #3172/#3177 python-coverage sweep, which runs a file-level
        # split (over a superset of these files) green.
        # Worker count is -n 3 (lowered -n 6 → -n 4 per #1901 for CPU starvation,
        # then -n 4 → -n 3 for MEMORY headroom when the whole-suite lane OOM-killed
        # the pod — see #1982). Kept at -n 3 per shard: a shard runs ~1/4 the
        # tests so its base memory is well under the pod limit even without --cov,
        # and -n 3 stays inside the #1983 heartbeat-safe worker count on the
        # heavy runner's core cap. History: -n auto was inconsistent on the
        # shared 4-core pool (cgroup detection drift), so #726 pinned -n 3.
        # RULE — pytest-xdist -n vs runner CPU (#1983): -n must stay BELOW
        # the runner container's usable cores, leaving at least one core for
        # the GHA agent + xdist coordinator. The fix for "runner lost
        # communication" / heartbeat starvation is burst headroom on the
        # runner's CPU *limit* (the heavy pool's sizes live outside this
        # repo), not a smaller -n. Do not raise -n above the current value
        # to chase wall-clock; raise the CPU *limit* instead.
        # --dist loadscope: a module's tests stay on one worker so
        # module-/session-scoped fixtures (testcontainers PG, embedding
        # service) instantiate per worker, not per test. --maxfail=1
        # preserves the old `-x` fast-fail per shard (xdist ignores `-x`);
        # with fail-fast: false one red shard still lets the others run,
        # so a broad breakage surfaces every failing shard at once.
        # COVERAGE stays OUT of this required gate (was `COVERAGE_CORE=sysmon
        # ... --cov=meho_backplane --cov-report=xml`): the xdist coverage combine
        # peaked the whole-suite pytest tree at 13.67 GiB (vs 7.86 GiB without),
        # OOM-killing the heavy runner. Coverage is produced by the dedicated,
        # non-blocking, sharded `python-coverage` + `python-coverage-combine`
        # jobs below (#1982/#1987/#3172).
        run: |
          # Deterministic split by measured file time (#4809; #3251 used
          # every TOTAL-th file of the sorted list, which put the slow
          # files unevenly: shard 4 ran 613 s against 465 s for shard 2).
          # tests/_unit_shard_split.py sorts the files slowest first and
          # gives each file to the shard with the least time so far, using
          # the seconds in tests/_unit_shard_durations.json; a file without
          # a measurement counts as the median. File-level split keeps
          # conftest / loadscope semantics identical to a full run, and the
          # five shards partition the full set exactly (every file lands in
          # one shard; tests/test_unit_shard_split.py pins that).
          # tests/integration stays out (→ python-integration-shard) and
          # tests/migrations stays out (→ python-migration-tests), matching
          # the pre-shard lane's `--ignore` of both. The splitter prints
          # the file count and the predicted seconds per shard on stderr.
          TOTAL=5
          SHARD="${{ matrix.shard }}"
          if [ -n "${SINGLE_CONNECTOR}" ]; then
            # One-connector run (#5297): one job, no split. The tool exits
            # non-zero (and fails this step) if the short run is not safe.
            TOTAL=1
            find tests -name 'test_*.py' -not -path 'tests/integration/*' -not -path 'tests/migrations/*' | sort | uv run python tests/_unit_connector_select.py select --connector "${SINGLE_CONNECTOR}" > "${RUNNER_TEMP}/unit-files.txt"
          else
            find tests -name 'test_*.py' -not -path 'tests/integration/*' -not -path 'tests/migrations/*' | sort | uv run python tests/_unit_shard_split.py --shard "${SHARD}" --total "${TOTAL}" > "${RUNNER_TEMP}/unit-files.txt"
          fi
          mapfile -t SHARD_FILES < "${RUNNER_TEMP}/unit-files.txt"
          echo "shard ${SHARD}/${TOTAL}: ${#SHARD_FILES[@]} test files"
          if [ "${#SHARD_FILES[@]}" -eq 0 ]; then
            echo "::error::shard ${SHARD} selected 0 test files — shard split broken"
            exit 1
          fi
          # Per-shard perf-budget guard — early warning for CI-perf creep (the
          # #898 / G3.6 timeout class), scaled from the pre-shard 1320 s
          # whole-suite budget to a per-shard wall (then ~1/3 the suite). #4655
          # kept 660 s when the shard count went 3 → 4: the 3 shards had
          # reached 580-660 s; the #4655 measurement put the slowest of 4
          # shards at ~470 s with the same budget. The budget still fires below the
          # 20-min job `timeout-minutes` hang backstop. This step measures the
          # pytest wall, always prints it (trend visibility), and FAILS at the
          # budget so a regression is caught at the PR that causes it.
          # MEASURE before raising budget_s (see #793/#827/#898): re-run with
          #   MEHO_FIXTURE_TIMING_FILE=/tmp/fixt MEHO_LIFESPAN_TIMING=/tmp/lifespan
          # then `uv run python tests/_perf_timing_report.py` to attribute the wall.
          # If ONE shard consistently trips while the others are comfortable, the
          # measured file times are stale — refresh tests/_unit_shard_durations.json
          # (see tests/_unit_shard_split.py) rather than bumping only this budget.
          # Add a shard (matrix + TOTAL) only when all shards are near the budget.
          # #5433 did both: on busy runners all four shards took 780-930 s, and
          # fresh file times alone would still leave them near 850 s, so the
          # matrix went from 4 to 5 shards.
          # 900 s (was 660 s): when every heavy runner is busy (2 jobs per
          # node), shards that pass every test can take 674-710 s, and 660 s
          # dropped good pull requests from the merge queue.
          budget_s=900
          start=$(date +%s)
          # Per-test hang guard (#4270): --timeout=180 arms a per-test SIGALRM
          # in each xdist worker, so a test that stops making progress fails
          # on its own after 180 s with its name and a stack dump of every
          # thread, instead of sitting silent (one dot per test, no names)
          # until the 20-min job cap. The shard then still lands inside the
          # 900 s budget below. Mirrors the python-coverage job's guard;
          # --timeout-method=signal (NOT thread) is load-bearing under xdist:
          # thread calls os._exit(), which xdist reads as a worker crash and
          # whose stack dump it swallows. 180 s is ~3x the slowest honest
          # unit tests (the Alembic upgrade/downgrade round-trips, ~55 s on
          # a loaded 3-worker box); raise it only with a --durations
          # measurement showing a legitimate test near it.
          # --junitxml (#4809): the per-test times of this shard, uploaded
          # by the step below. They are the input for refreshing
          # tests/_unit_shard_durations.json (see tests/_unit_shard_split.py).
          # xunit1, not the default xunit2, because only xunit1 writes the
          # test file name on every test case.
          uv run pytest -n 3 --dist loadscope --maxfail=1 \
            --timeout=180 --timeout-method=signal \
            -o junit_family=xunit1 --junitxml=pytest-unit-shard.xml "${SHARD_FILES[@]}"
          dur=$(( $(date +%s) - start ))
          echo "::notice title=Unit pytest wall (shard ${SHARD}/${TOTAL})::${dur}s (budget ${budget_s}s per shard; hard cap = job timeout-minutes)"
          if [ "$dur" -gt "$budget_s" ]; then
            echo "::error title=Unit perf budget exceeded (shard ${SHARD}/${TOTAL})::shard pytest ${dur}s > per-shard budget ${budget_s}s. Early-warning gate for CI-perf creep (#898 / G3.6 class). MEASURE the slow path before raising budget_s (MEHO_FIXTURE_TIMING_FILE + MEHO_LIFESPAN_TIMING + tests/_perf_timing_report.py — #793/#827). Amortize the cost or rebalance the shards; do not just bump the budget."
            exit 1
          fi

      - name: Upload per-test times (input for the shard split)
        # #4809: tests/_unit_shard_split.py balances the shards with the
        # seconds in tests/_unit_shard_durations.json. Refresh that file
        # from these artifacts (one per shard) of a green run; the module
        # docstring has the commands. Uploaded whenever the file exists, so
        # a shard that ran over the budget still shows where the time went.
        # continue-on-error + timeout-minutes: a failed or hung upload must
        # never fail or hold the shard.
        # Not on a one-connector run (#5297): its times cover only some
        # files, so they must not be mixed into a refresh.
        if: always() && hashFiles('backend/pytest-unit-shard.xml') != '' && needs.changes.outputs.single_connector == ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-unit-shard-junit-${{ matrix.shard }}
          path: backend/pytest-unit-shard.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Print peak memory
        # Prints how much memory this job's runner container used and how many
        # CPUs it had, so a change to the heavy runner pool can be checked
        # against real numbers. Reads the cgroup files (v2 first, else v1) and
        # the samples from "Start memory sampling". The kernel's peak also
        # counts file cache: copies of files that the kernel keeps in memory
        # and frees when memory runs short. So the sampled working set and
        # program memory show better what the job really needs. A missing
        # file is skipped; this step never fails the job.
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          set +e
          cg=/sys/fs/cgroup
          mib() { case "$1" in max) echo "none" ;; ''|*[!0-9]*) echo "${1:-unknown}" ;; *) echo "$(( $1 / 1048576 )) MiB" ;; esac; }
          if [ -r "${RUNNER_TEMP}/memory-sampler.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/memory-sampler.pid")" 2>/dev/null
          fi
          if [ -r "${RUNNER_TEMP}/memory-samples.txt" ]; then
            read -r total_max ws_max anon_max samples < "${RUNNER_TEMP}/memory-samples.txt"
          fi
          if [ -r "${cg}/memory.peak" ]; then
            peak="$(mib "$(cat "${cg}/memory.peak")") (kernel count)"
          elif [ -r "${cg}/memory/memory.max_usage_in_bytes" ]; then
            peak="$(mib "$(cat "${cg}/memory/memory.max_usage_in_bytes")") (kernel count, cgroup v1)"
          elif [ -n "${total_max}" ]; then
            peak="$(mib "${total_max}") (highest sample; no kernel peak file here)"
          else
            peak="not available"
          fi
          echo "Memory and CPU of this job's runner container (1 MiB = 1,048,576 bytes):"
          echo "- Peak memory: ${peak}. The most the container held at one time, file cache included."
          echo "- Highest working set: $(mib "${ws_max}"). Memory in use without the file cache that the kernel frees first (kubectl top shows this)."
          echo "- Highest program memory: $(mib "${anon_max}"). Memory the programs asked for; the kernel cannot free it."
          echo "- Samples: ${samples:-none} (one per second)."
          if [ -r "${cg}/memory.current" ]; then
            echo "- Memory now: $(mib "$(cat "${cg}/memory.current")")."
          fi
          if [ -r "${cg}/memory.max" ]; then
            echo "- Memory limit: $(mib "$(cat "${cg}/memory.max")")."
          fi
          if [ -r "${cg}/memory.events" ]; then
            echo "- Out-of-memory kills: $(awk '$1 == "oom_kill" { print $2 }' "${cg}/memory.events")."
          fi
          echo "- CPUs this job can see (nproc): $(nproc)."
          if [ -r "${cg}/cpu.max" ]; then
            echo "- CPU limit: $(awk '{ if ($1 == "max") print "none"; else printf "%.1f CPUs", $1 / $2 }' "${cg}/cpu.max")."
          fi
          echo "::notice title=Peak memory (unit shard ${{ matrix.shard }}/5)::peak ${peak}; working set $(mib "${ws_max}"); program memory $(mib "${anon_max}"); nproc $(nproc)"
          exit 0

  python-outside-backend:
    name: Python tests that read files outside backend
    # #5296. Runs only on a pull request that changes no file under backend/
    # (`backend_python` is `false`) and is not docs-only. On such a pull
    # request python-lint, the five unit shards and python-integration skip.
    # Some backend tests still read files outside backend/: the Helm chart,
    # the Go CLI, the workflows, the docs and the examples. This job runs
    # exactly those test files, from the list in
    # backend/tests/_outside_backend_tests.py. The guard test
    # tests/test_outside_backend_tests.py keeps the list complete.
    #
    # Non-required check. The python-unit-lane fan-in fails the required
    # context when this job does not pass on such a pull request.
    #
    # GitHub-hosted runner: the listed tests need public tools only (uv, Helm,
    # jq, Docker for the chart's own PostgreSQL image). A short job must not
    # wait for a slot on the internal pools.
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.backend_python == 'false' &&
      needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # About 2 minutes of pytest plus setup; the cap is a hang backstop.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        # Same pinned uv as the other Python jobs (see python-lint).
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Sync Python environment (locked)
        run: uv sync --locked --all-groups

      - name: Install Helm
        # The tests/test_chart_*.py files render the chart with helm. Same pin
        # as the unit shards; MEHO_REQUIRE_HELM=1 below makes them fail, not
        # skip, when helm is missing.
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.16.4

      - name: Pytest (tests that read files outside backend)
        shell: bash
        env:
          MEHO_REQUIRE_HELM: "1"
        run: |
          set -euo pipefail
          mapfile -t FILES < <(uv run python tests/_outside_backend_tests.py)
          echo "${#FILES[@]} test files read files outside backend/"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::the list of tests that read outside backend/ is empty"
            exit 1
          fi
          uv run pytest -n 3 --dist loadscope \
            --timeout=180 --timeout-method=signal "${FILES[@]}"

  python-unit-lane:
    name: Python (ruff + mypy + pytest)
    # FAN-IN carrying the branch-protection required context (#3251). This job
    # name is the EXACT string pinned in the `main` ruleset's
    # required_status_checks, so branch protection / the ruleset are UNTOUCHED
    # by this change — the required name simply moved off the old monolithic
    # `python-lint-test` job onto this fan-in (the `python-coverage-combine`
    # shape #3172/#3177 used to keep the downstream contract byte-identical).
    #
    # It depends on the change-detector (`changes`), python-lint (ruff + ruff
    # format + mypy), and every python-unit-shard leg, and PASSES iff all of
    # them passed OR were skipped for a PROVEN docs-only diff. Three
    # correctness properties this shape must have:
    #
    #  1. NOT fail-open. A required aggregation gate that just `needs:` the
    #     shards would be SKIPPED when a shard fails (GitHub's default
    #     skip-on-needs-failure), and a skipped required check counts as
    #     Success (#2140) — i.e. a red shard would let the PR merge. `always()`
    #     forces this job to RUN regardless of upstream results, and the step
    #     below inspects `needs.*.result` and FAILS on anything not permitted.
    #     A shard that hangs → its own timeout-minutes → `cancelled` leg →
    #     aggregate result `cancelled`/`failure` → this gate FAILS (not open).
    #     Verified reasoning, not luck.
    #  2. Clean fork-PR + skip behaviour. The fork guard is AND-ed in, so on a
    #     fork PR (and only then) this job — like python-lint / python-unit-
    #     shard — is skipped by its own `if:`, which reports the required
    #     context as Success exactly as the old single job did (#2140). On
    #     same-repo PRs / push / merge_group the guard is true and the gate
    #     evaluates the real results.
    #  3. Docs-only fast path WITHOUT weakening the code path (#3252). On a
    #     proven docs-only PR, python-lint + every shard skip via their own
    #     detect-gated `if:` and the step below must PASS on their `skipped`
    #     results. But `skipped` must mean pass ONLY because the diff is
    #     docs-only — never because a needed job was cancelled/failed. So the
    #     step reads `needs.changes.outputs.docs_only` (available because
    #     `changes` is in `needs`) and BRANCHES:
    #       * docs_only == 'true'  → accept success|skipped (fast path).
    #       * else (full run)      → require STRICT success (a skipped lint /
    #                                shard here is anomalous — these jobs' only
    #                                skip paths are fork-PR or docs-only, and we
    #                                are in neither — so treat it as failure and
    #                                fail CLOSED). This is STRICTER than the
    #                                pre-#3252 gate; the fork path is handled by
    #                                this job's own `if:` skip, not by this step.
    #     And FIRST: if `changes` did not itself succeed, the docs_only value is
    #     untrustworthy, so the gate fails CLOSED regardless.
    #
    # Concurrency: the shards, python-lint and this fan-in all share the
    # workflow-level concurrency group, so a PR force-push cancels the whole
    # in-flight run as a SET and a fresh run supersedes it — there is no
    # partial-cancel path that could leave this gate green on stale shards.
    # GitHub-hosted runner (#4626): this job does no setup and runs one bash
    # step, and it is the last job of every CI run — it must never wait for a
    # slot on the internal pool.
    #  4. No-backend path (#5296). When `backend_python` is `false`, lint and
    #     the shards skip by their own `if:`, and `python-outside-backend`
    #     must pass instead. On every other path that job is skipped.
    needs: [changes, python-lint, python-unit-shard, python-outside-backend]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert lint + typecheck + every pytest shard passed
        # needs.<job>.result is one of success / failure / cancelled / skipped.
        # For the matrix job, needs.python-unit-shard.result is the AGGREGATE:
        # success only if every leg succeeded, otherwise failure/cancelled.
        run: |
          detect='${{ needs.changes.result }}'
          docs_only='${{ needs.changes.outputs.docs_only }}'
          lint='${{ needs.python-lint.result }}'
          shards='${{ needs.python-unit-shard.result }}'
          backend_python='${{ needs.changes.outputs.backend_python }}'
          outside='${{ needs.python-outside-backend.result }}'
          echo "changes (detect): result=${detect}, docs_only=${docs_only}, backend_python=${backend_python}"
          echo "python-lint (ruff + ruff format + mypy): ${lint}"
          echo "python-unit-shard (aggregate of all 5 shard legs, or the one connector leg): ${shards}"
          echo "single_connector='${{ needs.changes.outputs.single_connector }}' (empty = five shards)"
          echo "python-outside-backend (tests that read outside backend/): ${outside}"

          # The detect job MUST have succeeded for its docs_only classification
          # to be trustworthy. If not (failure / cancelled / an unexpected
          # skip on a non-fork path), fail the required lane CLOSED — never
          # infer docs-only from a broken detector. On a fork PR the detect job
          # IS skipped, but so is THIS job via its own fork-guard `if:`, so this
          # step never runs there.
          if [ "${detect}" != "success" ]; then
            echo "::error title=Python unit lane — detector not green::the change-detector ('changes') result is '${detect}', so the docs-only classification cannot be trusted. Failing the required unit lane closed."
            exit 1
          fi

          fail=0
          if [ "${docs_only}" = "true" ]; then
            # DOCS-ONLY FAST PATH — python-lint + every shard were skipped by
            # their detect-gated `if:` (they never ran). Accept `skipped` (the
            # expected state) or `success` (defensive: if one somehow ran and
            # passed). Anything else — failure/cancelled — still FAILS closed.
            for r in "${lint}" "${shards}" "${outside}"; do
              case "${r}" in
                success|skipped) ;;
                *) fail=1 ;;
              esac
            done
          elif [ "${backend_python}" = "false" ]; then
            # NO-BACKEND PATH (#5296) — lint + every shard were skipped by
            # their `if:`; the tests that read outside backend/ must PASS.
            for r in "${lint}" "${shards}"; do
              case "${r}" in
                success|skipped) ;;
                *) fail=1 ;;
              esac
            done
            if [ "${outside}" != "success" ]; then
              fail=1
            fi
          else
            # FULL RUN — require STRICT success. A `skipped` lint/shard here is
            # anomalous (no skip-cascade is possible: `changes` succeeded above,
            # and their only other skip paths are fork-PR / docs-only, neither
            # of which holds), so treat skipped as a failure and fail CLOSED.
            for r in "${lint}" "${shards}"; do
              case "${r}" in
                success) ;;
                *) fail=1 ;;
              esac
            done
            # python-outside-backend skips on a full run; it must not fail.
            case "${outside}" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          fi

          if [ "${fail}" -ne 0 ]; then
            echo "::error title=Python unit lane red::ruff / ruff format / mypy, one or more pytest shards, or the tests that read files outside backend did not pass. This fan-in carries the branch-protection required context 'Python (ruff + mypy + pytest)'; open the 'Python lint + typecheck (ruff + mypy)' / 'Python unit shard N/5' / 'Python tests that read files outside backend' jobs above for the failing detail."
            exit 1
          fi

          if [ "${docs_only}" = "true" ]; then
            echo "Unit lane GREEN (docs-only fast path #3252) — lint + all 5 pytest shards skipped-by-detect; nothing to test for a pure docs/*.md diff."
          elif [ "${backend_python}" = "false" ]; then
            echo "Unit lane GREEN (no backend change, #5296) — lint + all 5 pytest shards skipped; the tests that read files outside backend/ passed."
          else
            echo "Unit lane GREEN — ruff + ruff format + mypy + all 5 pytest shards passed."
          fi

  python-coverage:
    name: Python coverage (SonarCloud, shard ${{ matrix.shard }}/8)
    # Restores the SonarCloud Clean-as-You-Code coverage artifact that #1982
    # had to drop from the required unit lane to stop the OOM kill. This job
    # is deliberately:
    #   * ONCE A NIGHT by default (`github.event_name == 'schedule'`, #4910) —
    #     not on push to `main`, not on PRs, not in the merge queue. PRs stay
    #     fast/no-cov; SonarCloud gets one analysis a day from the nightly
    #     run (it ran after every merge until #4910, when the 8 shards filled
    #     the 12-runner heavy pool after each merge and starved the merge
    #     queue's unit shards; see the header). The ONE
    #     exception is an opt-in `ci-coverage-validate` PR label: a PR carrying
    #     that label also runs this job, so a change to the coverage path
    #     itself can be proven green + artifact-producing on the real
    #     `meho-runners-ci-heavy` pod (where the OOM reproduces) BEFORE it
    #     merges — without paying the double-suite cost on every other PR.
    #     Remove the label once validated; routine PRs never carry it.
    #   * NON-REQUIRED + whole-job continue-on-error (#1987 AC5) — it is NOT
    #     in branch protection's required contexts, AND continue-on-error
    #     means a coverage-job FAILURE (OOM, red tests, step timeout) is
    #     absorbed: the job itself still reports conclusion `failure` (jobs
    #     API, observed on run 30925197316), but it never fails the overall
    #     CI run conclusion. That matters twice: a red coverage job must not
    #     block merge (it can't — the nightly run is not a PR check — but
    #     defence in depth), and it must not flip the CI run's `conclusion` to
    #     `failure`, which would suppress quality-gate.yml's `workflow_run`
    #     (it only runs on `conclusion == 'success'`).
    #     CAUTION (#2800): continue-on-error absorbs *failure* only —
    #     cancellation leaks through. A JOB-level `timeout-minutes` expiry
    #     CANCELS the job, and the `cancelled` conclusion propagated to the
    #     whole run (observed three times on 2026-08-04, run 30902356757),
    #     suppressing quality-gate.yml exactly like a `failure` would and
    #     tripping docs/RELEASING.md's "cancelled ≠ green" pre-flight.
    #     Hence the hang backstop lives on the pytest STEP (step timeout →
    #     step failure → job failure → absorbed); the job-level cap is only
    #     the outer backstop — see the timeout-minutes comment below.
    #
    # WHY OFFLINE COMBINE + LOW PARALLELISM (the memory story, measured for
    # #1987; methodology = #1982's: systemd-run --user --scope, cgroup
    # memory.peak, full unit suite, 8306 passed):
    #   | config                   | peak       | wall   |
    #   | no-cov -n 3 (#1982)      | 7.86 GiB   | 13:34  |
    #   | offline-cov -n 3        | 14.03 GiB  | 15:19  |
    #   | offline-cov -n 2        | 13.17 GiB  | 20:42  |
    #   | offline-cov -n 1        | 12.48 GiB  | 35:32  |
    # The coverage tax (~4.6 GiB even fully serial) is INTRINSIC — the
    # in-memory line-coverage map over the whole meho_backplane package
    # across 8306 tests — and barely shrinks with xdist worker count, so the
    # session-end combine is NOT the peak (offline combine alone did not
    # avoid the OOM at -n 3). The lever that actually fits the pod is dropping
    # base suite memory via low parallelism: -n 1 peaks at 12.48 GiB.
    # CORRECTION (#3172, 2026-08-27): the "<13.67 GiB pod limit" this job was
    # originally sized against NEVER existed — 13.67 GiB was #1982's measured
    # local peak, mistaken for the runner's cap. The live heavy-pool runner
    # container limit (rdc-gitops apps/rke2-ci/meho-runners-heavy) was 8Gi,
    # so the 12.48-GiB serial sweep never fit: every main-push run since
    # ~2026-06-20 died as an OOM runner-loss (absorbed job failure, null step
    # telemetry) or a memory-thrash wedge (pytest crawls to the 45-min step
    # cap, combine hangs on the debris — the v0.31.0 tag-gate blocker).
    # rdc-gitops#115 resizes the pool to 14Gi (request == limit,
    # node-exclusive by memory), giving the sweep ~1.5 GiB of real headroom
    # on this same runs-on label.
    # The "offline" shape (per-worker parallel data + `coverage combine`/`xml`
    # AFTER pytest exits, pytest invoked with `-p no:cov` so pytest-cov's
    # in-process combine never runs) keeps the combine memory-cheap regardless.
    # SHARDED (#3172, 2026-08-28): 13,311 collected tests put the -n 1
    # serial wall at ~57 min — past the 45-min step cap, the 55-min job cap,
    # and brushing the ~60-min external pod reap, so a monolithic sweep was
    # structurally out of road (proven by run 33149016521: healthy 14Gi pod,
    # steady progress, killed at 93%). The sweep now runs as 8 stride shards
    # of the sorted test-file list (~125 files each; #3172 started with 3,
    # #4748 went to 5, #4758 to 8), fanned into the python-coverage-combine
    # job below which merges all shards' parallel data and uploads the
    # single `python-coverage` artifact — the quality-gate.yml contract is
    # unchanged. A shard's memory grows with the number of tests in its one
    # pytest process, so more shards means less memory per shard. The
    # "Print peak memory" step at the end of each shard shows the real
    # numbers. 8 shards (#4758): 3 shards hit the 30-min step cap and lost
    # all their data; on the 7 GiB heavy runner, 5 shards of ~4,000-4,700
    # tests still ran 19-29 min of pytest and peaked at the memory limit.
    # ~2,700 tests per shard keeps each one near 15-20 min and ~4 GiB.
    # If a shard's wall approaches its 30-min step cap, or its memory nears
    # the runner's limit, raise the shard count — bump the matrix, TOTAL in
    # the pytest step AND the combine job's download steps, in lockstep
    # (tests/test_ci_coverage_shards.py pins the lockstep). This job stays
    # non-blocking; a shard OOM merely thins one shard's coverage.
    # A SHARD'S WORKER DATA FILE (#4758): the worker writes its coverage
    # data at interpreter exit, which the xdist controller can cut short
    # (it kills a worker 10 s after the worker reports finished). The
    # tests/conftest.py session-finish hook saves the worker's data before
    # that report, so a slow worker clean-up no longer loses a whole
    # shard's test coverage with every check green.
    # Runs on the nightly `schedule` run of `main`, OR on a PR explicitly
    # opted in via the `ci-coverage-validate` label (the on-runner validation
    # escape hatch described above). Never on `push` or `merge_group`. The
    # fork-PR guard still applies on the PR path so fork code never executes
    # on the self-hosted pool.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'ci-coverage-validate'))
    runs-on: meho-runners-ci-heavy
    strategy:
      # 8 stride shards (#3172 started with 3) — see the SHARDED paragraph in
      # the header comment. fail-fast off: one shard's red tests must not
      # cancel the other shards' coverage data (partial coverage beats none).
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # RESOLVED 2026-08-27 (#3172; formerly a TODO(ops) asking for a new
    # larger-memory pool + a runs-on move): the recurring ~47-min OOM /
    # runner-loss on this pool — which silently killed coverage on every main
    # push from 2026-06-20, collapsing SonarCloud coverage 65.8% -> ~24% (see
    # the memory table above and docs/codebase/sonarcloud.md) — was the pool's
    # 8Gi runner limit vs this job's 12.48-GiB serial sweep. Fixed IN PLACE by
    # rdc-gitops#115 (heavy pool resized to 14Gi request==limit); this
    # `runs-on:` label is correct and stays. An OOM would still only skip one
    # coverage upload (job stays non-blocking); quality-gate.yml makes that
    # skip fail-visible via an error annotation (#2513).
    # THREE-LAYER hang defense (#2800 → #2806 → #2865). Ordered inner→outer;
    # each layer catches what the one inside it structurally cannot:
    #   1. IN-PROCESS, per test — pytest-timeout `--timeout=300` (signal) on
    #      the Pytest step. A wedged test dies as a Failed carrying its own
    #      traceback, from INSIDE the pytest process, so it does NOT depend on
    #      the runner agent being healthy. This is the PRIMARY guard: #2865
    #      showed a pytest hang can outlive the step `timeout-minutes` when the
    #      runner itself is wedged — step 9 still `in_progress` at the ~60-min
    #      job kill on the v0.28.0 cut (run 31199593016, cancelled 2×) — so a
    #      runner-enforced timeout is not a reliable backstop for a pytest hang.
    #   2. STEP `timeout-minutes: 30` (~19-min per-shard wall + growth
    #      headroom, #3172) — runner-enforced backstop for a hang the per-test
    #      SIGALRM cannot reach (a stall during COLLECTION before any test
    #      item starts, or a GIL-locked C call that never returns to the main
    #      thread). A step timeout is a step FAILURE, absorbed by whole-job
    #      continue-on-error → run conclusion stays `success`.
    #   3. JOB `timeout-minutes: 55` — outer backstop for a wedged NON-pytest
    #      step (checkout / uv sync / model warm — never observed). Every
    #      post-pytest step in this shard job is step-capped too (#3172:
    #      shard-data upload 2, log upload 2, memory print 1 — the v0.31.0
    #      cut proved a hang CAN escape into a post-pytest step via the
    #      pytest step's debris), so the bounded-step worst case is
    #      30 + 2 + 2 + 1 = 35 min + pre-pytest setup (35–75 s observed)
    #      ≈ 36 — the step caps always fire before
    #      this job cap for any hang under a bounded step, and a job-level
    #      expiry (which CANCELS the job; `cancelled` leaks past
    #      continue-on-error into the run conclusion — the exact
    #      #2800/#2865/#3172 failure) is reserved for the never-observed
    #      wedged setup step. 55 also sits below the ~60-min external pod
    #      reap seen on the heavy pool, so GitHub's job timeout wins that
    #      race. (The combine + coverage.xml upload moved to the
    #      python-coverage-combine fan-in job below, with its own budget.)
    # Neither runner cap is a perf budget: the job is nightly and non-blocking,
    # so a long wall never gates a PR.
    timeout-minutes: 55
    continue-on-error: true
    env:
      # Surfaced as a job-level env var purely so the Docker Hub login
      # step can test it in an `if:`. The `secrets` context is NOT
      # available in a step-level `if:` (GitHub's context-availability
      # table allows it in `with:` / `env:` / `run:` only), so reading
      # the secret through `env` is what makes the guard evaluatable.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      MEHO_TEST_PGVECTOR_IMAGE: harbor.evba.lab/dockerhub-proxy/pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
      MEHO_TEST_VALKEY_IMAGE: harbor.evba.lab/dockerhub-proxy/valkey/valkey:8
      # vcsim release-tag pin — see the comment on the first
      # MEHO_TEST_VCSIM_IMAGE occurrence (backend-tests job) for why.
      MEHO_TEST_VCSIM_IMAGE: harbor.evba.lab/dockerhub-proxy/vmware/vcsim:v0.55.1
      MEHO_TEST_VAULT_IMAGE: harbor.evba.lab/dockerhub-proxy/hashicorp/vault:1.18
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Start memory sampling
        # Feeds the "Print peak memory" step at the end of this job. A small
        # background loop reads this container's cgroup v2 memory files once a
        # second and keeps the highest values until that step stops it. It
        # never fails the job.
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          set +e
          cg=/sys/fs/cgroup
          if [ ! -r "${cg}/memory.current" ] || [ ! -r "${cg}/memory.stat" ]; then
            echo "No cgroup v2 memory files here, so no sampling."
            exit 0
          fi
          sample() {
            total_max=0; ws_max=0; anon_max=0; n=0
            while :; do
              read -r total < "${cg}/memory.current"
              anon=0; inactive_file=0
              while read -r key value; do
                case "${key}" in
                  anon) anon=${value} ;;
                  inactive_file) inactive_file=${value} ;;
                esac
              done < "${cg}/memory.stat"
              total=${total:-0}
              ws=$(( total - inactive_file ))
              if [ "${total}" -gt "${total_max}" ]; then total_max=${total}; fi
              if [ "${ws}" -gt "${ws_max}" ]; then ws_max=${ws}; fi
              if [ "${anon}" -gt "${anon_max}" ]; then anon_max=${anon}; fi
              n=$(( n + 1 ))
              echo "${total_max} ${ws_max} ${anon_max} ${n}" > "${RUNNER_TEMP}/memory-samples.tmp"
              mv -f "${RUNNER_TEMP}/memory-samples.tmp" "${RUNNER_TEMP}/memory-samples.txt"
              sleep 1
            done
          }
          sample </dev/null >/dev/null 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/memory-sampler.pid"
          echo "Memory sampling started: one sample per second."

      - name: Docker Hub login (for testcontainers pulls)
        # Empty-secret guard — see the python-tests job's login step for
        # why Dependabot runs need it.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Pinned uv; see the python-lint job for why.
          version: "0.13.0"
          enable-cache: true

      - name: Sync Python environment (locked)
        run: uv sync --locked --all-groups

      - name: Cache fastembed model (drift-guard + slow-lane)
        # Same shared model cache the required lane uses — the unit suite this
        # job re-runs instantiates the embedding model, so it must be warm here
        # too. Keyed identically so the two jobs share one cache entry.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.fastembed-cache
          key: fastembed-model-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            fastembed-model-${{ runner.os }}-

      - name: Embedding-model drift guard (evoila/meho#574)
        env:
          MEHO_WARM_CACHE_DIR: ${{ github.workspace }}/.fastembed-cache
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python -m meho_backplane.retrieval.warm

      - name: Provision spaCy NLP model for Presidio Tier-2 (#1072)
        # Same model the unit lane provisions — the Tier-2 redaction tests in
        # the unit sweep need it, and this job re-runs that sweep.
        run: |
          uv run python -m spacy download en_core_web_sm
          MEHO_REDACTION_SPACY_MODEL=en_core_web_sm \
            uv run python -c "from meho_backplane.redaction import get_engines; get_engines('en')"

      - name: Pytest (unit) with offline coverage data
        # Runner-enforced STEP backstop (#2800/#2806) — layer 2 of the
        # three-layer defense documented on the job's `timeout-minutes`. A step
        # timeout is a step FAILURE (absorbed by whole-job continue-on-error),
        # never a cancellation. But #2865 proved a pytest hang can outlive it
        # when the runner is wedged, so the PRIMARY guard is the in-process
        # `--timeout` on the run below, not this cap.
        # 30 per shard (#3172): set when 3 shards ran ~19 min each (57-min
        # serial total / 3 shards at 13,311 tests). With 8 shards (#4758)
        # a shard runs ~15-20 min on the 7 GiB heavy runner, so 30 leaves
        # suite-growth headroom while keeping shard+combine far inside the
        # 55-min job cap. A shard that hits this cap loses ALL its coverage
        # data (its processes are killed before they write), so raise the
        # shard count before any shard gets near it.
        timeout-minutes: 30
        # Force bash so the run below gets pipefail + PIPESTATUS: the
        # self-hosted pool's default shell does NOT enable `pipefail`, which
        # let `pytest | tee` mask a hang's non-zero exit as step SUCCESS
        # (#2865 CI validation, run 32230484451). A masked hang still can't
        # cancel the run, but it must read as a step FAILURE, not a false green.
        shell: bash
        env:
          MEHO_REDACTION_SPACY_MODEL: en_core_web_sm
          # Same lane-placement opt-out as the required unit lane's
          # Pytest step (#2980) — this job re-runs that sweep, serially
          # and under a 30-min per-shard step cap, so the canary's full-ingest
          # tests are opted out here for the same budget reason. Today
          # this is belt-and-suspenders (this job has no spec-shelf
          # checkout, so those tests skip on shelf absence anyway);
          # it keeps a future shelf-arming of this job from silently
          # re-importing the multi-minute ingest wall.
          MEHO_SKIP_SPEC_INGEST_TESTS: "1"
          # Each xdist worker is a subprocess; coverage's a1_coverage.pth hook
          # calls coverage.process_startup() when COVERAGE_PROCESS_START points
          # at a config, so every worker writes its OWN parallel data file
          # (.coverage.<host>.<pid>.<rand>). pytest itself runs with -p no:cov
          # below, so pytest-cov's memory-spiking in-process session-end combine
          # never runs — the combine is deferred to a standalone step after
          # this one, by which point all workers are dead and their memory freed.
          COVERAGE_PROCESS_START: .coveragerc.ci
          # sysmon (PEP 669) is the faster tracer; line counts match the C
          # tracer exactly (SonarCloud parity), and it does not raise the peak
          # vs the C tracer in measurement.
          COVERAGE_CORE: sysmon
        # Same unit sweep as the required lane (--ignore=tests/integration), but
        # -n 1 (serial) to keep the coverage-inflated peak under the pod limit
        # (see the memory table in this job's header). --dist loadscope keeps a
        # module's tests on one worker so session-scoped fixtures instantiate
        # once. No --maxfail: a coverage run wants the whole suite measured even
        # if one test is flaky; redness here is non-blocking anyway.
        #
        # PRIMARY hang guard (#2865): --timeout=300 arms a per-test SIGALRM, so a
        # wedged test dies IN-PROCESS as a pytest-timeout Failed carrying the
        # offending test's traceback (the "where it hung" diagnostic) after 300 s
        # — independent of runner health, unlike the step/job `timeout-minutes`
        # a wedged runner never reached on the v0.28.0 cut (run 31199593016).
        # --timeout-method=signal (NOT thread) is load-bearing under -n 1 xdist:
        # thread's os._exit() reads to xdist as a worker CRASH, which it re-runs
        # up to --max-worker-restart times (~5×: one 300 s hang balloons to
        # ~25 min → job-cap CANCEL) and whose stack dump xdist swallows. signal
        # raises in the worker's main thread → one clean Failed, traceback kept,
        # no re-run. --max-worker-restart=0 then caps ANY other worker death
        # (segfault / OOM-kill) at zero retries, so a single failure can never
        # multiply into a job-cap overrun. 300 s sits well above the slowest
        # honest test yet far below the 30-min step cap. tee preserves the full
        # log for the hang-diagnostic artifact below; `exit ${PIPESTATUS[0]}`
        # propagates pytest's OWN exit (not tee's) so a hang reads as a step
        # FAILURE the job's continue-on-error absorbs — `shell: bash` above
        # guarantees PIPESTATUS + pipefail on this self-hosted pool.
        run: |
          # Deterministic stride shard (#3172): the sorted test-file list,
          # every 8th file to this shard. File-level split keeps conftest
          # semantics identical to a full run; stride (vs contiguous
          # blocks) spreads the heavyweight suites across shards. The
          # eight shards partition the full set exactly (NR mod 8 hits
          # each residue once); integration stays excluded by the find,
          # matching the old --ignore.
          TOTAL=8
          SHARD="${{ matrix.shard }}"
          mapfile -t SHARD_FILES < <(find tests -name 'test_*.py' -not -path 'tests/integration/*' | sort | awk -v s="${SHARD}" -v t="${TOTAL}" 'NR % t == s - 1')
          echo "shard ${SHARD}/${TOTAL}: ${#SHARD_FILES[@]} test files"
          if [ "${#SHARD_FILES[@]}" -eq 0 ]; then
            echo "::error::shard ${SHARD} selected 0 test files — stride selection broken"
            exit 1
          fi
          uv run pytest -n 1 --dist loadscope -p no:cov \
            --timeout=300 --timeout-method=signal --max-worker-restart=0 \
            "${SHARD_FILES[@]}" 2>&1 | tee pytest-coverage.log
          exit "${PIPESTATUS[0]}"

      - name: Upload shard coverage data (parallel files)
        # Raw per-worker parallel data files (`.coverage.<host>.<pid>.<rand>`)
        # for THIS shard — the python-coverage-combine job below merges every
        # shard's set and writes the single coverage.xml quality-gate.yml
        # consumes (#3172). `.coveragerc.ci` sets relative_files=true, so
        # data from eight different runners combines cleanly.
        # include-hidden-files: upload-artifact v4+ excludes dotfiles by
        # default, and every coverage data file is a dotfile.
        # timeout-minutes (#3172): same job-cap-cancel hole as every
        # post-pytest step — a hung upload must degrade to an absorbed step
        # failure.
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-coverage-data-shard-${{ matrix.shard }}
          path: backend/.coverage.*
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn

      - name: Upload coverage-job pytest log (hang diagnostic)
        # #2865: a coverage-job hang now dies as a pytest-timeout FAILURE with
        # the offending test's traceback in this log (see the Pytest step's
        # --timeout). Uploaded whenever the log exists so the NEXT hang says
        # WHERE it hung, not just that the job ran long. continue-on-error is
        # belt-and-suspenders on top of the whole-job continue-on-error.
        if: always() && hashFiles('backend/pytest-coverage.log') != ''
        continue-on-error: true
        # timeout-minutes (#3172): same job-cap-cancel hole as the combine
        # step — a hung upload must degrade to an absorbed step failure.
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-pytest-log-shard-${{ matrix.shard }}
          path: backend/pytest-coverage.log
          retention-days: 7
          if-no-files-found: warn

      - name: Print peak memory
        # Prints how much memory this job's runner container used and how many
        # CPUs it had, so a change to the heavy runner pool can be checked
        # against real numbers. Reads the cgroup files (v2 first, else v1) and
        # the samples from "Start memory sampling". The kernel's peak also
        # counts file cache: copies of files that the kernel keeps in memory
        # and frees when memory runs short. So the sampled working set and
        # program memory show better what the job really needs. A missing
        # file is skipped; this step never fails the job.
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          set +e
          cg=/sys/fs/cgroup
          mib() { case "$1" in max) echo "none" ;; ''|*[!0-9]*) echo "${1:-unknown}" ;; *) echo "$(( $1 / 1048576 )) MiB" ;; esac; }
          if [ -r "${RUNNER_TEMP}/memory-sampler.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/memory-sampler.pid")" 2>/dev/null
          fi
          if [ -r "${RUNNER_TEMP}/memory-samples.txt" ]; then
            read -r total_max ws_max anon_max samples < "${RUNNER_TEMP}/memory-samples.txt"
          fi
          if [ -r "${cg}/memory.peak" ]; then
            peak="$(mib "$(cat "${cg}/memory.peak")") (kernel count)"
          elif [ -r "${cg}/memory/memory.max_usage_in_bytes" ]; then
            peak="$(mib "$(cat "${cg}/memory/memory.max_usage_in_bytes")") (kernel count, cgroup v1)"
          elif [ -n "${total_max}" ]; then
            peak="$(mib "${total_max}") (highest sample; no kernel peak file here)"
          else
            peak="not available"
          fi
          echo "Memory and CPU of this job's runner container (1 MiB = 1,048,576 bytes):"
          echo "- Peak memory: ${peak}. The most the container held at one time, file cache included."
          echo "- Highest working set: $(mib "${ws_max}"). Memory in use without the file cache that the kernel frees first (kubectl top shows this)."
          echo "- Highest program memory: $(mib "${anon_max}"). Memory the programs asked for; the kernel cannot free it."
          echo "- Samples: ${samples:-none} (one per second)."
          if [ -r "${cg}/memory.current" ]; then
            echo "- Memory now: $(mib "$(cat "${cg}/memory.current")")."
          fi
          if [ -r "${cg}/memory.max" ]; then
            echo "- Memory limit: $(mib "$(cat "${cg}/memory.max")")."
          fi
          if [ -r "${cg}/memory.events" ]; then
            echo "- Out-of-memory kills: $(awk '$1 == "oom_kill" { print $2 }' "${cg}/memory.events")."
          fi
          echo "- CPUs this job can see (nproc): $(nproc)."
          if [ -r "${cg}/cpu.max" ]; then
            echo "- CPU limit: $(awk '{ if ($1 == "max") print "none"; else printf "%.1f CPUs", $1 / $2 }' "${cg}/cpu.max")."
          fi
          echo "::notice title=Peak memory (coverage shard ${{ matrix.shard }}/8)::peak ${peak}; working set $(mib "${ws_max}"); program memory $(mib "${anon_max}"); nproc $(nproc)"
          exit 0

  python-coverage-combine:
    name: Python coverage combine (SonarCloud artifact)
    # Fan-in for the sharded python-coverage matrix above (#3172): downloads
    # every shard's raw parallel coverage data, merges it, and uploads the
    # single `python-coverage` artifact (backend/coverage.xml) — the
    # quality-gate.yml contract is byte-identical to the old monolithic
    # producer; only the producer topology changed. Same trigger + absorption
    # posture as the shard job: the nightly `schedule` run (or the
    # `ci-coverage-validate` PR label), never `push` or `merge_group`,
    # non-required, whole-job continue-on-error. `always()` keeps
    # the fan-in merging partial data when a shard failed its tests or died —
    # per-download continue-on-error tolerates a shard that never produced an
    # artifact, and the combine step's ls guard exits cleanly when none did.
    # Runs on the main (non-heavy) pool: combine is seconds of CPU and a few
    # hundred MB — it needs no 14Gi node.
    needs: python-coverage
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'ci-coverage-validate')))
    runs-on: meho-runners-ci
    # 26 > the 22 min of bounded step caps below + ~1-2 min of honest
    # checkout/uv/sync — the step caps always fire before this job cap, so
    # a stall degrades to an absorbed step failure, never a run-level
    # cancellation (the #2800/#3172 leak).
    timeout-minutes: 26
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Pinned uv; see the python-lint job for why.
          version: "0.13.0"
          enable-cache: true

      - name: Sync Python environment (locked)
        # The combine/xml pass needs only the coverage binary from the locked
        # env; a warm uv cache makes this seconds.
        run: uv sync --locked --all-groups

      - name: Download shard 1 coverage data
        # Same pinned download-artifact as quality-gate.yml. Eight explicit
        # name-addressed downloads (not a pattern match) keep the step free
        # of newer-action feature dependencies; continue-on-error tolerates
        # a shard that produced no artifact (see the job header).
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-coverage-data-shard-1
          path: backend

      - name: Download shard 2 coverage data
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-coverage-data-shard-2
          path: backend

      - name: Download shard 3 coverage data
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-coverage-data-shard-3
          path: backend

      - name: Download shard 4 coverage data
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-coverage-data-shard-4
          path: backend

      - name: Download shard 5 coverage data
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-coverage-data-shard-5
          path: backend

      - name: Download shard 6 coverage data
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-coverage-data-shard-6
          path: backend

      - name: Download shard 7 coverage data
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-coverage-data-shard-7
          path: backend

      - name: Download shard 8 coverage data
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-coverage-data-shard-8
          path: backend

      - name: Combine coverage + write XML (offline, all shards)
        # Runs in this fan-in job with every shard's pytest long gone, so
        # `coverage combine` merges the downloaded per-worker parallel data
        # files standalone (cheap). Uses .coveragerc.ci (relative_files=true)
        # so paths are repo-relative across the eight shard runners and for
        # SonarCloud cross-job mapping (#1987 AC6).
        #
        # `if: always()` + the ls guard: combine whatever shards delivered —
        # a missing shard artifact (OOM before any data file) thins coverage
        # rather than zeroing it. Partial coverage beats none; this whole job
        # is non-blocking, and SonarCloud merging slightly incomplete
        # new-code coverage is far better than a "no data" gap. The guard
        # keeps the step from erroring with "No data to combine" when NO
        # shard produced data (→ the upload step's hashFiles guard then
        # skips cleanly).
        #
        # timeout-minutes (#3172): combine takes seconds when healthy, but the
        # v0.31.0 cut proved a hang that outlives the pytest step's SIGALRM
        # guard leaves debris this step then hangs on — and an UNBOUNDED step
        # rides into this job's cap, whose timeout is a CANCELLATION that
        # whole-job continue-on-error does NOT absorb (it absorbs failures),
        # flipping the run conclusion to `cancelled` and blocking the
        # RELEASING.md tag gate. A step cap converts that hang into an
        # absorbed step FAILURE — run stays `success`, coverage degrades to
        # "none for this run", the documented lossy contract. This fan-in
        # job's budget: downloads 8 x 2 + this step 4 + upload 2 = 22 min
        # of bounded steps + checkout/uv/sync (~1-2 min honest) under the
        # 26-min job cap, so step caps always fire first.
        if: always()
        timeout-minutes: 4
        run: |
          if ! ls .coverage.* >/dev/null 2>&1; then
            echo "::warning::no per-worker coverage data files — pytest produced no coverage (crash before first test?); skipping combine"
            exit 0
          fi
          uv run coverage combine --rcfile=.coveragerc.ci
          uv run coverage xml --rcfile=.coveragerc.ci -o coverage.xml
          # Sanity: the file must exist and carry the empty <source></source>
          # that quality-gate.yml's sed rewrites to <source>backend</source>.
          test -f coverage.xml
          grep -q '<source></source>' coverage.xml \
            || echo "::warning::coverage.xml has no empty <source> — SonarCloud path mapping may not resolve"

      - name: Upload Python coverage artifact
        # Consumed by quality-gate.yml (`workflow_run` -> SonarCloud) under this
        # exact name. Lossy: a missing upload degrades the SonarCloud signal to
        # "no coverage for this run" but never invalidates anything.
        # continue-on-error here is belt-and-suspenders on top of the whole-job
        # continue-on-error.
        if: always() && hashFiles('backend/coverage.xml') != ''
        continue-on-error: true
        # timeout-minutes (#3172): same job-cap-cancel hole as the combine
        # step — a hung upload must degrade to an absorbed step failure.
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-coverage
          path: backend/coverage.xml
          retention-days: 7
          if-no-files-found: warn


  python-integration-shard:
    name: Python integration shard ${{ matrix.shard }}/4
    # Non-required checks (one per matrix leg: `Python integration shard
    # 1/4` ... `4/4`). The required context `Python (integration
    # testcontainers)` is carried by the python-integration fan-in below,
    # the same shape as python-unit-shard + python-unit-lane (#5384).
    # Holds the container-heavy tests/integration/ subtree
    # (pgvector/valkey/k3d/vcsim testcontainers) plus the G0.7 vSphere
    # canary module. Kept apart from the unit shards so the required
    # lint+mypy+unit gate stays fast while integration runs on every PR.
    # The fan-in has been a required merge gate since 2026-05-20 (#698):
    # it was the structural corrective to the v0.2 / G3.4
    # green-but-hollow incidents (#634 / #697) — the lane that
    # exercises real connector dispatch, k3d / bind9-container /
    # vcsim / federated-write acceptance, must be merge-blocking so
    # red integration cannot ship to ``main`` again.
    #
    # Why shards (#5384): the serial job grew to ~28 min of pytest and
    # finished last in every merge-queue run. Each leg now runs one part of
    # the test files, split by measured time (see the pytest step), so the
    # wall is about the slowest shard instead of the sum.
    #
    # #3252 docs-only skip — SAME shape as the python-migration-tests gate
    # below (plain `needs: changes` + an `if:` that ANDs in the detect
    # output), deliberately NOT `always()`: these are HEAVY legs, so keeping
    # cancel-in-progress (a force-push must cancel them) matters. If the
    # detect job hard-CRASHES, `needs: changes` skip-cascades these legs to
    # `skipped`, and the fan-in fails the required context CLOSED (it
    # checks that `changes` succeeded). The CLASSIFIER itself is fail-safe:
    # only a proven-docs-only diff sets `docs_only=true`, so a code PR is
    # never skipped here.
    #
    # #5296: the legs also skip when `backend_python` is `false` (a PR that
    # changes no file under backend/ and not this file), and the fan-in
    # accepts the skipped legs on that path. A few integration tests read
    # files outside backend/ (the Keycloak sub-chart, examples/, the CLI);
    # they need containers, so on such a PR only the merge queue runs them.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       needs.changes.outputs.docs_only != 'true' &&
       needs.changes.outputs.backend_python != 'false')
    needs: changes
    # The normal internal pool, not the heavy one: the tests run serially
    # (no xdist) and mostly wait on containers.
    runs-on: meho-runners-ci
    strategy:
      # fail-fast: false — one shard's red test must NOT cancel the others,
      # so a broad breakage shows every failing shard in one run (the fan-in
      # still fails if ANY leg fails). To change the shard count, edit BOTH
      # the matrix and the `TOTAL` in the pytest step, in lockstep
      # (tests/test_unit_shard_split.py checks that they match).
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # 30-min cap: hang backstop only. The slowest shard is one file
    # (test_connectors_k8s_k3d.py, ~9-10 min) plus ~2 min of setup; the
    # serial job had a 60-min cap for ~30 min of work.
    timeout-minutes: 30
    env:
      # Surfaced as a job-level env var purely so the Docker Hub login
      # step can test it in an `if:`. The `secrets` context is NOT
      # available in a step-level `if:` (GitHub's context-availability
      # table allows it in `with:` / `env:` / `run:` only), so reading
      # the secret through `env` is what makes the guard evaluatable.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      MEHO_TEST_PGVECTOR_IMAGE: harbor.evba.lab/dockerhub-proxy/pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
      MEHO_TEST_VALKEY_IMAGE: harbor.evba.lab/dockerhub-proxy/valkey/valkey:8
      # vcsim release-tag pin — see the comment on the first
      # MEHO_TEST_VCSIM_IMAGE occurrence (backend-tests job) for why.
      MEHO_TEST_VCSIM_IMAGE: harbor.evba.lab/dockerhub-proxy/vmware/vcsim:v0.55.1
      MEHO_TEST_VAULT_IMAGE: harbor.evba.lab/dockerhub-proxy/hashicorp/vault:1.18
      # G3.2-T6 (#326) — k3s container fixture for the K8s typed-connector
      # E2E acceptance harness (tests/integration/test_connectors_k8s_e2e.py
      # and the existing tests/integration/test_connectors_k8s_k3d.py).
      # Pinned to the same minor the k3d/k3s fixture's in-code default
      # uses (rancher/k3s:v1.32.5-k3s1) so the Harbor proxy serves the
      # exact tag the testcontainers fixture asks for, without a docker.io
      # round-trip.
      MEHO_TEST_K3S_IMAGE: harbor.evba.lab/dockerhub-proxy/rancher/k3s:v1.32.5-k3s1
      # G11.2-T7 (#1098) — Keycloak 26.x container fixture for the
      # live-IdP integration test
      # (backend/tests/integration/test_auth_keycloak_client_credentials.py).
      # Unlike the rows above this one has **no docker.io short-name
      # default** in the fixture: the Keycloak image is ~600 MB and an
      # unauthenticated docker.io pull would reliably exhaust the
      # cluster's shared NAT egress bucket, so the fixture skips when
      # MEHO_TEST_KEYCLOAK_IMAGE is unset rather than falling back. The
      # Harbor-proxied tag is the only path that runs the suite to
      # pass; everywhere else (local dev sandboxes, agent sandboxes,
      # any future fork PR job that doesn't see this env) the test
      # skips cleanly with a clear remediation message.
      MEHO_TEST_KEYCLOAK_IMAGE: harbor.evba.lab/dockerhub-proxy/keycloak/keycloak:26.0
      # #2949 — vendor vCenter spec-shelf wiring; this job runs the
      # tests/integration real-spec ingest lanes
      # (test_operations_ingest_vcenter.py / _vi_json.py). See the
      # comment on the python-unit-shard job's occurrence of these two
      # rows for the full rationale (presence-flag gating; the
      # unconditional docs-root that degrades to lane-skip when the
      # shelf checkout was skipped).
      SPEC_SHELF_TOKEN_PRESENT: ${{ secrets.SPEC_SHELF_TOKEN != '' }}
      MEHO_CONSUMER_DOCS_ROOT: ${{ github.workspace }}/spec-shelf/docs
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout vendor spec-shelf (secret-gated, #2949; nsx #2981)
        # Same secret-gated sparse checkout as the python-unit-shard
        # job's spec-shelf step — see that step's comment for the
        # licensing pointer (docs/decisions/vendor-spec-ci-
        # provisioning.md), the secret scope, and the fork/Dependabot
        # degrade-to-skip analysis.
        if: env.SPEC_SHELF_TOKEN_PRESENT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: evoila-bosnia/claude-rdc-hetzner-dc
          token: ${{ secrets.SPEC_SHELF_TOKEN }}
          path: spec-shelf
          sparse-checkout: |
            docs/argocd-3.3
            docs/azure-arm-2026.10
            docs/cloud-builder-5.0
            docs/cloud-builder-5.1
            docs/cloud-builder-5.2
            docs/esxi-9.0
            docs/fleet-lcm-9.0
            docs/harbor-2.12
            docs/hetzner-robot-2026-04
            docs/keycloak-26.3
            docs/loki-3.7
            docs/nsx-9.0
            docs/proxmox-8.4
            docs/rabbitmq-4.3
            docs/salt-raas-8.18
            docs/sddc-manager-9.0
            docs/sddc-manager-9.1
            docs/vcenter-8.0
            docs/vcenter-9.0
            docs/vcf-automation-9.0
            docs/vcf-automation-9.0-reference
            docs/vcf-automation-9.1
            docs/vcf-automation-9.1.1
            docs/vcf-installer-9.0
            docs/vcf-installer-9.1
            docs/vcf-operations-9.0
            docs/vcf-operations-orchestrator-9.0
            docs/vcf-operations-orchestrator-9.1
            docs/vcf-protection-and-recovery-9.1
            docs/vks-9.0
            docs/vmware-cloud-director-10.6
          filter: blob:none
          persist-credentials: false

      - name: Verify spec-shelf provisioned the pinned specs
        # Fail-loud layout guard — same rationale as the
        # python-unit-shard job's occurrence.
        if: env.SPEC_SHELF_TOKEN_PRESENT == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for f in \
            spec-shelf/docs/argocd-3.3/argocd-swagger.json \
            spec-shelf/docs/azure-arm-2026.10/specification/resources/resource-manager/Microsoft.Resources/subscriptions/stable/2022-12-01/subscriptions.json \
            spec-shelf/docs/cloud-builder-5.0/cloud-builder-5.0.0-reference-operations.tsv \
            spec-shelf/docs/cloud-builder-5.1/cloud-builder-5.1.0-reference-operations.tsv \
            spec-shelf/docs/cloud-builder-5.1/cloud-builder-5.1.1-reference-operations.tsv \
            spec-shelf/docs/cloud-builder-5.2/cloud-builder-5.2.0-reference-operations.tsv \
            spec-shelf/docs/cloud-builder-5.2/cloud-builder-5.2.1-reference-operations.tsv \
            spec-shelf/docs/cloud-builder-5.2/cloud-builder-5.2.2-reference-operations.tsv \
            spec-shelf/docs/cloud-builder-5.2/cloud-builder-5.2.3-reference-operations.tsv \
            spec-shelf/docs/cloud-builder-5.2/cloud-builder-5.2.4-reference-operations.tsv \
