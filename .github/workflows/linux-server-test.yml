# Tests of the form-2 scripts in deploy/linux-server/: the install script
# (#4733), its host firewall (#4635), RKE2's CIS profile (#4636), and the
# scripts that build and check the download (#4734).
#
# shellcheck checks every shell script there: the *.sh files and any file
# that starts with a shell shebang, so a script without an extension (for
# example meho-host) is checked too. The unit tests are Python unittest
# suites. They run install.sh against a fake machine (stub commands on PATH
# and a temporary root folder), and the functions of packaging/ against
# stub registry tools and small image archives built in Python. They need
# no root, no RKE2 and no network. One step checks that the upstream
# local-path manifest the tests compare against is the real v0.0.37 file.
# Another checks the copies of RKE2's CIS files against the source of the
# pinned RKE2 version, and that this version lets traffic in to Traefik
# under the CIS profile.
#
# The firewall tests also check the MEHO nftables file with the real nft
# and kernel, in a new user and network namespace, so the runner's own
# firewall stays as it is. MEHO_REQUIRE_NFT_CHECK=1 makes those tests fail,
# not skip, when the runner cannot run them.
#
# The chart is a trigger too: a test checks that every image repository of
# the chart has a licence line for the download
# (deploy/linux-server/packaging/image-sources.txt), and a test renders the
# chart with values-single-node.yaml and the place values install.sh
# writes, with the Helm version the download ships (#4735).
#
# Advisory (non-required) and path-scoped, like plugin-test.yml: a required
# check would need the `changes`-job + job-`if:` shape ci.yml uses.

name: linux-server-test

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/linux-server/**'
      - 'deploy/charts/meho/**'
      - '.github/workflows/linux-server-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-server-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run shellcheck and the install script tests
    # Untrusted-PR runner isolation (F06, meho-internal#268). The job runs
    # PR-controlled scripts. It needs no internal route, deployment
    # credential or build cache, so a fork PR runs on a disposable
    # GitHub-hosted runner, and same-repo PRs stay on the internal pool.
    # See docs/codebase/devops.md "Untrusted pull-request isolation".
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'meho-runners-ci' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'

      - name: Install shellcheck
        # Pinned version and checksum. The checksum is the sha256 digest that
        # GitHub records for the release file. The install target is
        # $HOME/.local/bin because the meho-runners-ci pool runs as a
        # non-root user (same pattern as kubeconform in chart.yml).
        run: |
          set -euo pipefail
          SC_VER=v0.11.0
          SC_SHA=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          SC_TAR="${RUNNER_TEMP}/shellcheck.tar.gz"
          curl -fsSL -o "${SC_TAR}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SC_VER}/shellcheck-${SC_VER}.linux.x86_64.tar.gz"
          echo "${SC_SHA}  ${SC_TAR}" | sha256sum -c -
          tar -xzf "${SC_TAR}" -C "${RUNNER_TEMP}" "shellcheck-${SC_VER}/shellcheck"
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${RUNNER_TEMP}/shellcheck-${SC_VER}/shellcheck" "${HOME}/.local/bin/shellcheck"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/shellcheck" --version

      - name: Install helm
        # The Helm the download ships. deploy/linux-server/packaging/common.sh
        # pins the same version and checksum for bin/helm.
        run: |
          set -euo pipefail
          HELM_VER=v3.16.4
          HELM_SHA=fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179
          HELM_TAR="${RUNNER_TEMP}/helm.tar.gz"
          curl -fsSL -o "${HELM_TAR}" "https://get.helm.sh/helm-${HELM_VER}-linux-amd64.tar.gz"
          echo "${HELM_SHA}  ${HELM_TAR}" | sha256sum -c -
          tar -xzf "${HELM_TAR}" -C "${RUNNER_TEMP}" linux-amd64/helm
          install -m 0755 "${RUNNER_TEMP}/linux-amd64/helm" "${HOME}/.local/bin/helm"
          "${HOME}/.local/bin/helm" version --short

      - name: Run shellcheck on every script
        run: |
          set -euo pipefail
          mapfile -t scripts < <(
            {
              find deploy/linux-server -type f -name '*.sh'
              grep -rlE --exclude-dir=tests '^#!(/usr/bin/env |/bin/)(ba)?sh' deploy/linux-server || true
            } | sort -u
          )
          printf 'checking %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

      - name: Check that the test fixture is the upstream local-path manifest
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml \
            | cmp - deploy/linux-server/tests/fixtures/local-path-storage-v0.0.37.yaml

      - name: Check the CIS fixtures and the Traefik rule of the pinned RKE2
        # The install's pod security file is RKE2's own file for its CIS
        # profile plus one namespace, and its kernel settings file is RKE2's
        # own (#4636). The tests compare against copies in tests/fixtures/.
        # RKE2 keeps the pod security file in Go source (pkg/rke2/psa.go),
        # so this step cuts it out of the source of the RKE2 version that
        # packaging/common.sh pins. It also checks that this version still
        # creates the network policy that lets traffic from every address
        # in to Traefik's ports web and websecure under the profile
        # (pkg/rke2/np.go). Without it the console does not load.
        run: |
          set -euo pipefail
          version=$(sed -n 's/^readonly RKE2_VERSION=//p' deploy/linux-server/packaging/common.sh)
          base="https://raw.githubusercontent.com/rancher/rke2/${version//+/%2B}"
          fixtures=deploy/linux-server/tests/fixtures
          work=$(mktemp -d)
          for file in pkg/rke2/psa.go pkg/rke2/np.go bundle/share/rke2/rke2-cis-sysctl.conf; do
            curl -fsSL -o "${work}/${file##*/}" "${base}/${file}"
          done
          awk '/psRestrictedConfig := `/ { on = 1; sub(/.*`/, ""); print; next }
               on && /`/ { sub(/`.*/, ""); print; exit }
               on { print }' "${work}/psa.go" \
            | cmp - "${fixtures}/rke2-pod-security-cis.yaml"
          cmp "${work}/rke2-cis-sysctl.conf" "${fixtures}/rke2-cis-sysctl.conf"
          policy=$(awk '/name: *"default-network-traefik-policy"/ { on = 1 }
                        on && /name: *"/ && !/traefik-policy/ { exit }
                        on { print }' "${work}/np.go")
          for fact in '"app.kubernetes.io/name": "rke2-traefik"' 'StrVal: "web"' 'StrVal: "websecure"'; do
            if ! grep -qF -- "${fact}" <<<"${policy}"; then
              echo "::error::RKE2 ${version} has no CIS network policy for Traefik with ${fact} (pkg/rke2/np.go)"
              exit 1
            fi
          done
          if grep -qF 'From:' <<<"${policy}"; then
            echo "::error::RKE2 ${version} lets only some sources reach Traefik under the CIS profile (pkg/rke2/np.go)"
            exit 1
          fi

      - name: Install nftables for the firewall file check
        # Same `sudo -n apt-get` pattern as the php-cli step in ci.yml. A
        # failed index refresh is a warning: the install below fails on its
        # own when the Ubuntu indexes are missing. nft is in /usr/sbin, which
        # the PATH of a non-root runner user may not hold.
        run: |
          set -euo pipefail
          if ! command -v nft >/dev/null 2>&1 && [ ! -x /usr/sbin/nft ]; then
            if ! sudo -n DEBIAN_FRONTEND=noninteractive apt-get update -y; then
              echo "::warning::apt-get update could not refresh every package index; installing nftables from the indexes that did download"
            fi
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nftables
          fi
          case ":${PATH}:" in
            *:/usr/sbin:*) ;;
            *)
              echo /usr/sbin >> "${GITHUB_PATH}"
              PATH="/usr/sbin:${PATH}"
              ;;
          esac
          nft --version

      - name: Run the unit tests
        env:
          # The chart render test must run here, not skip.
          MEHO_REQUIRE_HELM: "1"
          MEHO_REQUIRE_NFT_CHECK: '1'
        run: python -m unittest discover -s deploy/linux-server/tests -v
