apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: golden-postgres
  labels:
    helm.sh/chart: postgres-0.1.0
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "17"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: database
spec:
  # One replica: copies of the database on other nodes (HA) are out of
  # scope for the single-node core.
  replicas: 1
  serviceName: golden-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: golden
  template:
    metadata:
      annotations:
        # The scripts are read at start. A changed ConfigMap restarts the
        # pod on upgrade.
        checksum/config: 76d34c60ebea48cb0d1ab3bfef95a7847dc183b01a37014ab5d288f2d9e4fa2d
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: golden
    spec:
      automountServiceAccountToken: false
      # No `<SERVICE>_PORT` variables from other Services in the namespace
      # in the PostgreSQL environment.
      enableServiceLinks: false
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d"
          imagePullPolicy: IfNotPresent
          env:
            # A sub-directory of the mount, not the mount itself: initdb
            # needs an empty directory it owns, whatever the volume root
            # holds (lost+found) and whatever user id the pod runs as.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # Read once by initdb, on an empty disk only. Nothing uses the
            # superuser password over the network.
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/core-postgres/secrets/superuser/password
            # TCP logins from inside the pod (127.0.0.1, for example through
            # `kubectl port-forward`) need a password too. The local socket
            # keeps initdb's `trust` line; the reconcile sidecar uses it.
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256"
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          # All probes use TCP, not the socket: the temporary server that
          # runs the initdb script listens on the socket only, so a socket
          # probe would pass while the first setup still runs. The startup
          # probe gives a first setup on a slow disk 5 minutes before the
          # liveness probe may restart the container.
          startupProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              cpu: "1"
              ephemeral-storage: 1Gi
              memory: 1Gi
            requests:
              cpu: 250m
              ephemeral-storage: 128Mi
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: config
              mountPath: /etc/core-postgres/config
              readOnly: true
            - name: superuser
              mountPath: /etc/core-postgres/secrets/superuser
              readOnly: true
            - name: meho
              mountPath: /etc/core-postgres/secrets/meho
              readOnly: true
            - name: meho-app
              mountPath: /etc/core-postgres/secrets/meho-app
              readOnly: true
            - name: keycloak
              mountPath: /etc/core-postgres/secrets/keycloak
              readOnly: true
        # Re-applies core.sql over the shared socket directory whenever a
        # mounted password changes (see reconcile.sh in the ConfigMap). It
        # has no access to the superuser Secret.
        - name: reconcile
          image: "pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/etc/core-postgres/config/reconcile.sh"]
          resources:
            limits:
              cpu: 100m
              ephemeral-storage: 64Mi
              memory: 64Mi
            requests:
              cpu: 10m
              ephemeral-storage: 16Mi
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/core-postgres/config
              readOnly: true
            - name: meho
              mountPath: /etc/core-postgres/secrets/meho
              readOnly: true
            - name: meho-app
              mountPath: /etc/core-postgres/secrets/meho-app
              readOnly: true
            - name: keycloak
              mountPath: /etc/core-postgres/secrets/keycloak
              readOnly: true
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: config
          configMap:
            name: golden-postgres-config
            defaultMode: 0555
