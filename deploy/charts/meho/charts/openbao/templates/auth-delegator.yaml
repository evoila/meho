{{- if .Values.authDelegator -}}
# Only with `authDelegator: true`: OpenBao may then ask the cluster to check
# service-account tokens (the TokenReview API), which a Kubernetes login
# method needs. Its own account, so the `default` account of the namespace
# does not get the right too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "coreVault.fullname" . }}
  labels:
    {{- include "coreVault.labels" . | nindent 4 }}
---
# The chart's only cluster-wide object. Its name holds the namespace,
# because cluster-wide names must be unique across namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-auth-delegator" .Release.Namespace (include "coreVault.fullname" .) }}
  labels:
    {{- include "coreVault.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "coreVault.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
