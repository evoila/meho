{{- if include "meho.core.enabled" . }}
{{- /*
The built-in core's `secrets` Job (#4041; core design §3): makes every
`<release>-core-*` Secret that is missing, before the ConfigMap (-20), the
migration Job (-10) and every release resource. It never changes an
existing Secret and prints no value. Details: docs/codebase/core-secrets.md.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-core-secrets" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "meho.labels" . | nindent 4 }}
    app.kubernetes.io/component: core-secrets
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    # Same policy as the migration Job: a re-run replaces the old Job, a
    # successful one is removed, a failed one stays for `kubectl logs`.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # Same retry and clean-up settings as the migration Job.
  ttlSecondsAfterFinished: {{ .Values.migrationJob.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  template:
    metadata:
      labels:
        # Deliberately not `meho.selectorLabels`: the backplane's
        # NetworkPolicy selects pods by those labels and allows no egress
        # to the Kubernetes API, which this Job needs.
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: core-secrets
    spec:
      # `Never`, not the migration Job's `OnFailure`: with `OnFailure`
      # Kubernetes removes the pod once `backoffLimit` is reached, and its
      # log holds the one sentence that says what to fix.
      restartPolicy: Never
      serviceAccountName: {{ include "meho.core.hookName" . }}
      # The only token this Job carries is the hook account's own.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: secrets
          # The backplane image, with the same digest pin as the Deployment.
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "meho_backplane.core.secrets"]
          # The failure sentence also shows in `kubectl describe pod`.
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Names, kinds and hosts only; the values are made in the Job.
            - name: MEHO_CORE_SECRETS_PLAN
              value: {{ include "meho.core.secretsPlan" . | quote }}
          resources:
            {{- toYaml .Values.migrationJob.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
