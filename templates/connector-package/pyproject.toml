# A made-up connector package: the start for your own. Rename the made-up
# names (see README.md) before you build it.
#
# The wheel holds one folder, meho_backplane/connectors/example_widget/.
# MEHO finds the connector there when it starts.
#
# The one dependency is the connector kit range: the kit versions this
# package fits. The overlay build and MEHO's start check it.

[project]
name = "example-connectors"
version = "0.1.0"
description = "A made-up connector package: one connector for a made-up widget API."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = ["meho-connector-kit>=1.0,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["meho_backplane/connectors/example_widget"]
