# TruffleHog secret scanning.
#
# Runs on every push and PR. Scans full git history (fetch-depth: 0) for
# leaked secrets — verified findings AND unknown/likely findings (the
# `--results=verified,unknown` default that catches new patterns).
#
# Required status check in branch protection. continue-on-error is NOT
# set: any finding fails the workflow and blocks merge. Fresh-repo policy:
# the new project starts with a zero-finding baseline rather than
# inheriting MEHO.X's continue-on-error tolerance.

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Fires when a PR enters the GitHub merge queue. Required so the
  # `TruffleHog Secret Scan` status context — a required check in
  # branch protection — reports against the synthesised merge commit,
  # not just the PR head. Without this, merge-queue runs would never
  # receive the secret-scan signal and queued PRs would hang on the
  # missing required context. Same rationale as ci.yml's merge_group
  # trigger (#769).
  merge_group:

permissions:
  contents: read

concurrency:
  # Mirrors ci.yml's pattern (#769): event-suffixed group key so
  # pull_request / push / merge_group runs don't collide, and
  # cancel-in-progress is scoped OFF for merge_group because a
  # cancelled queue check fails the merge attempt and defeats the
  # queue. Workflow-name-specific group prefix so this workflow's
  # cancellation domain stays distinct from ci.yml's.
  group: secret-scan-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: meho-runners-ci
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Warm the TruffleHog image cache
        # The trufflesecurity/trufflehog action runs the scan by shelling
        # out to `docker run ghcr.io/trufflesecurity/trufflehog:latest`
        # (its action.yml, pinned at the SHA on the scan step below, ends in
        # `docker run ... "${IMAGE}:${VERSION}"` with those two defaults).
        # `docker run`'s default `--pull missing` policy means that when the
        # image is ALREADY in the local daemon no registry round-trip
        # happens — so pre-pulling it here, with bounded exponential
        # backoff, turns a transient ghcr.io TLS-handshake timeout under
        # concurrent CI load (#3310 — the same shared-runner-egress class as
        # the codeload 429s the action-archive cache already addressed) into
        # a short delay instead of an exit-125 failure that ejects the PR
        # from the merge queue on this required check.
        #
        # This does NOT weaken the gate: the scan step below is unchanged
        # and still runs `--results=verified,unknown --fail` against the
        # same base..head range on every push, PR and merge_group ref
        # (#3308). This step only isolates the flaky part (the network pull)
        # from the deterministic part (the scan) and retries the pull. The
        # `image:tag` here must match the action's `${IMAGE}:${VERSION}`
        # defaults exactly, or the subsequent `docker run` misses the warm
        # image and pulls again.
        env:
          IMAGE: ghcr.io/trufflesecurity/trufflehog:latest
        shell: bash
        run: |
          set -euo pipefail
          attempts=5
          delay=5
          attempt=1
          while [ "$attempt" -le "$attempts" ]; do
            echo "::group::docker pull ${IMAGE} (attempt ${attempt}/${attempts})"
            if timeout 180 docker pull "$IMAGE"; then
              echo "::endgroup::"
              echo "Warmed ${IMAGE} on attempt ${attempt}."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq "$attempts" ]; then
              echo "::error::docker pull ${IMAGE} failed after ${attempts} attempts (see #3310)." >&2
              exit 1
            fi
            echo "Pull failed (attempt ${attempt}/${attempts}); retrying in ${delay}s..."
            sleep "$delay"
            delay=$(( delay * 2 ))
            if [ "$delay" -gt 60 ]; then delay=60; fi
            attempt=$(( attempt + 1 ))
          done

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b  # v3.97.1
        with:
          # Pin the scan range on merge_group refs. The action derives its
          # BASE/HEAD from the event payload, but its dispatch only handles
          # push / pull_request / workflow_dispatch / schedule — there is NO
          # merge_group branch. On a merge_group event COMMIT_IDS is [] and
          # both inputs stay empty, so the action falls back to a
          # full-filesystem scan of the whole tree; with
          # --results=verified,unknown below that surfaces pre-existing
          # UNVERIFIED findings living in repo test fixtures and --fail exits
          # non-zero, ejecting every merge-queue entry `failed_checks` (#3307;
          # the #3253 merge_group trigger made the context report but not pass).
          #
          # Passing base/head from the merge_group payload scopes the scan to
          # the base..head diff — matching PR semantics, so those historical
          # fixture findings are out of scope. On pull_request / push
          # github.event.merge_group is null so both expressions are empty and
          # the action keeps its own derivation: PR/push behaviour is identical.
          base: ${{ github.event.merge_group.base_sha }}
          head: ${{ github.event.merge_group.head_sha }}
          extra_args: --results=verified,unknown
