apiVersion: v1
kind: Service
metadata:
  name: {{ include "corePostgres.fullname" . }}
  labels:
    {{- include "corePostgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    # Fixed at 5432: the generated DATABASE_URL and Keycloak's database
    # settings name this port.
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "corePostgres.selectorLabels" . | nindent 4 }}
