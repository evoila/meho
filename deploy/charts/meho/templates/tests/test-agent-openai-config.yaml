{{- /*
  #5851 — helm test for the OpenAI-compatible model endpoint settings.
  It checks that the values reach a container in the right shape:

    * `OPENAI_API_KEY` comes from a `secretKeyRef` (never a plain value),
      from the same Secret and key as the backplane Deployment.
    * `OPENAI_BASE_URL` and `OPENAI_DEFAULT_MODEL` are present when set.

  Renders only when `agent.openai.enabled: true`. Run with
  `helm test <release>`. The Pod does not call the model endpoint; it only
  checks its own env. Kubernetes refuses to start a Pod whose
  `secretKeyRef` does not resolve, so a passing check proves the Secret
  and key exist. The values are never printed.
*/}}
{{- if .Values.agent.openai.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "meho.fullname" . }}-test-agent-openai-config
  labels:
    {{- include "meho.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "meho.serviceAccountName" . }}
  {{- with include "meho.core.imagePullSecrets" . }}
  imagePullSecrets:
    {{- . | nindent 4 }}
  {{- end }}
  containers:
    - name: agent-openai-env-check
      image: {{ include "meho.core.image" (dict "image" (dict "repository" "busybox" "tag" "1.37" "digest" "sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e") "global" .Values.global) }}
      imagePullPolicy: IfNotPresent
      env:
        # Same wiring as the backplane Deployment.
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "meho.agentOpenaiSecretName" . | quote }}
              key: {{ .Values.agent.openai.secretKey | quote }}
        {{- with .Values.agent.openai.baseUrl }}
        - name: OPENAI_BASE_URL
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.agent.openai.defaultModel }}
        - name: OPENAI_DEFAULT_MODEL
          value: {{ . | quote }}
        {{- end }}
      command:
        - sh
        - -c
        - |
          set -eu
          printenv OPENAI_API_KEY >/dev/null \
            || { echo "FAIL: OPENAI_API_KEY not resolved (chart secretKeyRef wiring regressed)"; exit 1; }
          {{- if .Values.agent.openai.baseUrl }}
          printenv OPENAI_BASE_URL >/dev/null \
            || { echo "FAIL: OPENAI_BASE_URL not resolved"; exit 1; }
          {{- end }}
          {{- if .Values.agent.openai.defaultModel }}
          printenv OPENAI_DEFAULT_MODEL >/dev/null \
            || { echo "FAIL: OPENAI_DEFAULT_MODEL not resolved"; exit 1; }
          {{- end }}
          echo "OK: OpenAI-compatible endpoint env vars resolved"
      resources:
        limits:
          cpu: 100m
          memory: 32Mi
        requests:
          cpu: 10m
          memory: 16Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
{{- end }}
