apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: golden-core-bootstrap
  labels:
    helm.sh/chart: meho-chart-0.2.0
    app.kubernetes.io/name: meho
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: core-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,post-install,post-upgrade
    helm.sh/hook-weight: "-40"
rules:
  # Kubernetes cannot limit `create` to names. Creating a Secret whose name
  # already exists fails with 409 and changes nothing, so an operator's
  # Secret is never overwritten.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Read and patch exactly the `<release>-core-*` Secrets. No `list`, no
  # `watch`, nothing cluster-wide.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames:
      - "golden-core-postgres-superuser"
      - "golden-core-postgres-meho"
      - "golden-core-postgres-meho-app"
      - "golden-core-postgres-keycloak"
      - "golden-core-keycloak-bootstrap"
      - "golden-core-keycloak-admin"
      - "golden-core-ui-auth"
      - "golden-core-check-runner"
      - "golden-core-approval-handoff"
      - "golden-core-params-hash"
      - "golden-core-web-push"
      - "golden-core-broadcast-auth"
      - "golden-core-tls"
      - "golden-core-first-login"
      - "golden-core-console-admin"
      - "golden-core-ci-login"
