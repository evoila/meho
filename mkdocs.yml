# MEHO published documentation site (#2670).
#
# Sources live in `docs-site/` — deliberately NOT `docs/`, which is the
# contributor-facing tree (codebase walkthroughs, ADRs, runbooks) and
# stays where it is. Selected contributor files can be embedded into
# site pages without moving them via the `pymdownx.snippets` extension
# (its `base_path` includes the repo root, so a page can do
# `--8<-- "docs/deploying.md"` when a sibling task promotes content).
#
# Versioning is mike-managed (one docs version per minor, `latest`
# alias); `.github/workflows/docs-site.yml` deploys on `v*` tag push
# and runs `mkdocs build --strict` on PRs. `strict: true` below makes
# every build — including mike's — fail on warnings (broken links,
# pages missing from nav), so docs rot turns into a red build.

site_name: MEHO
site_description: >-
  Governance backplane for AI agents acting on infrastructure —
  policy-gated, audit-grade, MCP-native.
site_url: https://evoila.github.io/meho/
repo_url: https://github.com/evoila/meho
repo_name: evoila/meho
edit_uri: edit/main/docs-site/
docs_dir: docs-site
copyright: Copyright &copy; 2026 evoila Group — Apache 2.0

strict: true

theme:
  name: material
  palette:
    # Light / dark toggle, following the OS preference on first visit.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.footer
    - navigation.top
    - content.code.copy
    - content.action.edit

nav:
  - Start here:
      - index.md
      - Reference architecture: architecture.md
      - Deployment shapes: deployment-shapes.md
  - Install & operate:
      - The install trail: install/index.md
      - Credential backends: install/credential-backends.md
      - Keycloak realm setup: install/keycloak-realm.md
      - TLS and ingress: install/tls-ingress.md
      - Upgrades: install/upgrades.md
      - Local kind quickstart: install/kind-quickstart.md
  - Connect clients:
      - clients/index.md
      - MCP surface and scopes: clients/mcp-surface-and-scopes.md
      - The meho CLI: clients/cli.md
      - Claude Desktop: clients/claude-desktop.md
      - Claude Code: clients/claude-code.md
      - Other MCP clients (mcp-remote shim): clients/mcp-remote-shim.md
      - Troubleshooting auth walls: clients/troubleshooting.md
  - Do real work:
      - guides/index.md
      - guides/targets-and-secrets.md
      - guides/first-operations.md
      - guides/sensors-quickstart.md
      - Approvals and break-glass: guides/approvals-and-break-glass.md
      - Topology: guides/topology.md
      - Broadcast: guides/broadcast.md
      - Memory and knowledge: guides/memory-and-knowledge.md
      - Audit forensics: guides/audit-forensics.md
      - Flight recorder: guides/flight-recorder.md
      - Runbooks: guides/runbooks.md
      - Scheduler: guides/scheduler.md
      - Event ingestion: guides/event-ingestion.md
      - Satellite gateway: guides/satellite-gateway.md
      - Windows estate and in-guest execution: guides/windows-and-guest-execution.md
      - Add-ons: guides/add-ons.md
  - Reference:
      - reference/index.md
      - What's new: reference/whats-new.md
      # Generated from the connector registry + MCP tool registry by
      # backend/scripts/generate_reference_docs.py; freshness is enforced
      # by backend/tests/test_reference_docs_drift.py.
      - Connectors: reference/connectors.md
      - MCP tools: reference/mcp-tools.md
      # Generated from the cobra command tree by cli/cmd/docgen; freshness
      # is enforced by the cli-api-snapshot-freshness CI job.
      - CLI: reference/cli.md
      # Generated from the feature-maturity registry by
      # backend/scripts/generate_maturity_index.py (#2678); freshness
      # is enforced by backend/tests/test_maturity_surface_drift.py.
      - reference/maturity.md
  - Project: project/index.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  # The mermaid custom fence is the documented Material way to render
  # ```mermaid blocks natively (theme-aware, no external JS):
  # https://squidfunk.github.io/mkdocs-material/reference/diagrams/
  # The `!!python/name:` tag is mkdocs-specific YAML — see the
  # check-yaml exclude in .pre-commit-config.yaml.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      # Repo root first so site pages can embed selected contributor
      # files (e.g. `docs/deploying.md`) in place, without moving them.
      base_path:
        - .
        - docs-site
      check_paths: true

plugins:
  - search
  - mike

extra:
  version:
    # Renders Material's version selector, fed by mike's version index
    # on the gh-pages branch.
    provider: mike
