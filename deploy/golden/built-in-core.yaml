# Source: meho-chart/templates/core-bootstrap-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: golden-core-bootstrap
  labels:
    helm.sh/chart: meho-chart-0.2.0
    app.kubernetes.io/name: meho
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: core-bootstrap
  annotations:
    # After every release resource is up: Keycloak must serve the realm.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    # Same policy as the secrets Job: a re-run replaces the old Job, a
    # successful one is removed, a failed one stays for `kubectl logs`.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        # Not `meho.selectorLabels`: the backplane NetworkPolicy allows no
        # egress to the Kubernetes API, which this Job needs.
        app.kubernetes.io/instance: golden
        app.kubernetes.io/component: core-bootstrap
    spec:
      # `Never`: a failed pod keeps its log, which says what to fix.
      restartPolicy: Never
      serviceAccountName: golden-core-bootstrap
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          # The backplane image, with the same digest pin as the Deployment.
          image: "ghcr.io/evoila/meho:test"
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "meho_backplane.core.bootstrap", "keycloak"]
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Names and addresses only; every secret below comes by reference.
            - name: MEHO_CORE_KEYCLOAK_PLAN
              value: "{\"admin_username\":\"admin\",\"approver_username\":\"approver\",\"ci\":{\"enabled\":false,\"secret_name\":\"golden-core-ci-login\",\"tenant_id\":\"\"},\"console_admin_secret\":\"golden-core-console-admin\",\"console_admin_username\":\"console-admin\",\"first_login_secret\":\"golden-core-first-login\",\"keycloak_url\":\"http://golden-keycloak:8080/auth\",\"realm_file\":\"/opt/meho/realm/meho-realm.json\",\"tenants\":[]}"
            # Values for the `${...}` placeholders of the realm file, the
            # same ones the Keycloak pod gets.
            - name: MEHO_REALM_PUBLIC_URL
              value: "https://meho.test"
            - name: MEHO_REALM_TENANT_ID
              value: "00000000-0000-4000-8000-000000000001"
            - name: MEHO_REALM_TENANT_NAME
              value: "main"
            - name: MEHO_REALM_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: golden-core-keycloak-admin
                  key: client_secret
            - name: MEHO_REALM_WEB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: golden-core-ui-auth
                  key: client_secret
            - name: MEHO_REALM_CHECK_RUNNER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: golden-core-check-runner
                  key: client_secret
            # The first-start account. Optional: once it is removed, the
            # Job logs in as meho-admin, and the Secret may go.
            - name: MEHO_CORE_BOOTSTRAP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: golden-core-keycloak-bootstrap
                  key: client_id
                  optional: true
            - name: MEHO_CORE_BOOTSTRAP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: golden-core-keycloak-bootstrap
                  key: client_secret
                  optional: true
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 256Mi
              memory: 512Mi
            requests:
              cpu: 50m
              ephemeral-storage: 64Mi
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: realm
              mountPath: /opt/meho/realm
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # The realm file the Keycloak pod imported at its first start.
        - name: realm
          configMap:
            name: golden-keycloak-realm
---
# Source: meho-chart/templates/core-secrets-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: golden-core-secrets
  labels:
    helm.sh/chart: meho-chart-0.2.0
    app.kubernetes.io/name: meho
    app.kubernetes.io/instance: golden
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: core-secrets
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    # Same policy as the migration Job: a re-run replaces the old Job, a
    # successful one is removed, a failed one stays for `kubectl logs`.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # Same retry and clean-up settings as the migration Job.
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        # Deliberately not `meho.selectorLabels`: the backplane's
        # NetworkPolicy selects pods by those labels and allows no egress
        # to the Kubernetes API, which this Job needs.
        app.kubernetes.io/instance: golden
        app.kubernetes.io/component: core-secrets
    spec:
      # `Never`, not the migration Job's `OnFailure`: with `OnFailure`
      # Kubernetes removes the pod once `backoffLimit` is reached, and its
      # log holds the one sentence that says what to fix.
      restartPolicy: Never
      serviceAccountName: golden-core-bootstrap
      # The only token this Job carries is the hook account's own.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secrets
          # The backplane image, with the same digest pin as the Deployment.
          image: "ghcr.io/evoila/meho:test"
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "meho_backplane.core.secrets"]
          # The failure sentence also shows in `kubectl describe pod`.
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Names, kinds and hosts only; the values are made in the Job.
            - name: MEHO_CORE_SECRETS_PLAN
              value: "{\"check\":[],\"make\":[{\"kind\":\"postgres-superuser\",\"name\":\"golden-core-postgres-superuser\"},{\"host\":\"golden-postgres\",\"kind\":\"postgres-meho\",\"name\":\"golden-core-postgres-meho\"},{\"host\":\"golden-postgres\",\"kind\":\"postgres-meho-app\",\"name\":\"golden-core-postgres-meho-app\"},{\"kind\":\"postgres-keycloak\",\"name\":\"golden-core-postgres-keycloak\"},{\"kind\":\"keycloak-bootstrap\",\"name\":\"golden-core-keycloak-bootstrap\"},{\"kind\":\"keycloak-admin\",\"name\":\"golden-core-keycloak-admin\"},{\"kind\":\"ui-auth\",\"name\":\"golden-core-ui-auth\"},{\"kind\":\"check-runner\",\"name\":\"golden-core-check-runner\"},{\"kind\":\"approval-handoff\",\"name\":\"golden-core-approval-handoff\"},{\"kind\":\"params-hash\",\"name\":\"golden-core-params-hash\"},{\"kind\":\"broadcast-auth\",\"name\":\"golden-core-broadcast-auth\"},{\"host\":\"meho.test\",\"kind\":\"tls\",\"name\":\"golden-core-tls\"}]}"
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 256Mi
              memory: 512Mi
            requests:
              cpu: 50m
              ephemeral-storage: 64Mi
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
