# Default values for the broadcast subchart (Valkey 9.x).
#
# The subchart ships as part of the umbrella `meho` chart; operators override
# values via the parent chart's `broadcast:` block. ADR 0005 locks the
# upstream image (Valkey, BSD-3-Clause) and the workload shape (single-
# replica Deployment, no PVC — broadcast streams are ephemeral in v0.1).

# -- Master switch for the subchart. The parent Chart.yaml's `dependencies`
# entry references this via `condition: broadcast.enabled`, so flipping to
# `false` skips all subchart resources at render time. Operators on
# clusters with an external Redis/Valkey can disable and (in v0.2+) point
# the backplane at the external endpoint.
enabled: true

image:
  # -- Image repository. Defaults to upstream Valkey OSS on Docker Hub.
  repository: valkey/valkey
  # -- Image tag. Pinned to a stable Valkey 9.x alpine variant; bump on
  # security advisories. ADR 0005 locked Valkey 9.x; the patch level is
  # operator-tunable.
  tag: "9.0-alpine"
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Number of broadcast replicas. v0.1 is capped at 1 — Valkey is run as a
# single-replica Deployment without persistence, and the activity-broadcast
# pillar's streams are ephemeral by design. HA via Sentinel/Cluster lands at
# v0.2+ per Goal #11 scope; raising this value in v0.1 will not produce a
# working HA topology (no Sentinel sidecar is shipped) and is therefore
# rejected by the schema.
replicas: 1

# -- Pod-level security context. Matches the umbrella chart's `runAsNonRoot`
# discipline; UID 999 is the upstream Valkey image's default user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. `readOnlyRootFilesystem: true` is
# safe because Valkey only writes to its configurable data directory; we
# mount that as an `emptyDir` so the read-only root invariant holds.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Container resources. Sized for v0.1 streams workload (small messages,
# low rate). Tune limits up if the broadcast traffic grows.
resources:
  limits:
    cpu: 500m
    memory: 512Mi
    # -- Node-pressure guard for the ephemeral streams data emptyDir +
    # logs (kubernetes:S6870). Subchart default; the parent chart's
    # `broadcast.resources` mirrors it.
    ephemeral-storage: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi
    ephemeral-storage: 128Mi

service:
  # -- Service type. ClusterIP is the only sensible choice for v0.1 — the
  # broadcast store is consumed by the in-cluster backplane only.
  type: ClusterIP
  # -- Service port (Redis-protocol default 6379).
  port: 6379

# -- Valkey `requirepass` authentication. Default on: the chart renders a
# Secret holding a password (or reuses `existingSecret`), the store starts
# with `requirepass`, and the backplane client authenticates with the same
# Secret value. `protected-mode` is kept on as defense in depth while auth
# is enabled. Disable only when an external, separately-secured store is
# used.
auth:
  enabled: true
  # -- Reference an operator-supplied Secret instead of a chart-managed one.
  # When set, the chart renders no Secret and both the store and the client
  # read the password from this Secret at `existingSecretPasswordKey`.
  existingSecret: ""
  # -- Key holding the requirepass value (in the chart-managed Secret, or in
  # `existingSecret` when supplied).
  existingSecretPasswordKey: requirepass
  # -- Explicit password. When empty and no `existingSecret` is set the
  # chart generates a 32-char alphanumeric password on first install and
  # preserves it across upgrades via a lookup of the existing Secret.
  password: ""

# -- The broadcast subchart's own ingress NetworkPolicy. Selects the
# broadcast Pod and admits tcp/<service.port> only from the backplane Pods
# (and any `extraAllowedSelectors`). Independent of the umbrella chart's
# NetworkPolicy so the store's isolation does not depend on the parent — a
# Pod is ingress-isolated only when some policy selects it, and the parent
# policy selects the backplane, not this store.
networkPolicy:
  enabled: true
  # -- Pod-selector labels identifying the backplane Pods admitted to the
  # store. Defaults to the umbrella chart's `meho.selectorLabels` name; the
  # `.Release.Name` instance label is appended automatically.
  backplanePodLabels:
    app.kubernetes.io/name: meho
  # -- Extra pod selectors (label maps) admitted to the store, for
  # explicitly-listed in-cluster consumers. Default empty.
  extraAllowedSelectors: []

# -- Pod-level annotations.
podAnnotations: {}

# -- Pod-level labels.
podLabels: {}

# -- Node selector.
nodeSelector: {}

# -- Tolerations.
tolerations: []

# -- Affinity rules.
affinity: {}
