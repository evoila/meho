{% from "_components.html" import button %}
{% set values = values | default({}) %}
{% set errors = errors | default({}) %}
{% set agents = agents | default([]) %}
<form class="space-y-4 max-w-xl" method="post" action="/ui/blocked-people" aria-label="Block a login">
  {% include "principal_blocks/_hidden.html" %}
  <label class="block space-y-1">
    <span class="text-sm font-medium">Agent</span>
    <select name="agent" class="select w-full font-mono{% if errors.get('agent') %} select-error{% endif %}" data-agent-pick>
      <option value="">Pick an agent</option>
      {% for name in agents %}
        <option value="{{ name }}"{% if values.get('agent') == name %} selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
    {% if errors.get('agent') %}<span class="block text-error text-xs" role="alert" data-error-for="agent">{{ errors['agent'] }}</span>{% endif %}
    <span class="block text-xs text-subtle">A block of an agent stops every token of that agent.</span>
  </label>
  <label class="block space-y-1">
    <span class="text-sm font-medium">Login id</span>
    <input type="text" name="sub" value="{{ values.get('sub', '') }}" maxlength="255" class="input w-full font-mono{% if errors.get('sub') %} input-error{% endif %}" />
    {% if errors.get('sub') %}<span class="block text-error text-xs" role="alert" data-error-for="sub">{{ errors['sub'] }}</span>{% endif %}
    <span class="block text-xs text-subtle">Or type the exact login id (the <span class="font-mono">sub</span>) of a login. MEHO stores the block, and it holds from the next request of this login.</span>
  </label>
  <label class="block space-y-1">
    <span class="text-sm font-medium">Reason</span>
    <textarea name="reason" required maxlength="500" rows="2" class="textarea w-full{% if errors.get('reason') %} textarea-error{% endif %}">{{ values.get('reason', '') }}</textarea>
    {% if errors.get('reason') %}<span class="block text-error text-xs" role="alert" data-error-for="reason">{{ errors['reason'] }}</span>{% endif %}
  </label>
  {{ button("Block login", variant="danger", size="md", type="submit") }}
</form>
