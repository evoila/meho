name: Quality Gate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Do not cancel a queue check or leave an older SHA's status pending.
concurrency:
  group: quality-gate-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - name: Bind analysis to the CI commit
        id: metadata
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            const supported = ['push', 'pull_request', 'merge_group'];
            if (!supported.includes(run.event)) throw new Error(`Unsupported CI event: ${run.event}`);
            if (run.event === 'push' && run.head_branch !== 'main') throw new Error('Only main pushes are supported');
            let pr = null;
            if (run.event === 'pull_request') {
              const {data: pulls} = await github.rest.repos.listPullRequestsAssociatedWithCommit({...repo, commit_sha: run.head_sha});
              pr = pulls.find(p => p.head.sha === run.head_sha && p.base.repo.full_name === `${repo.owner}/${repo.repo}` && p.base.ref === 'main');
              if (!pr) throw new Error('No matching PR head and main base for this CI commit');
            }
            core.setOutput('sha', run.head_sha);
            core.setOutput('pr', pr ? JSON.stringify({number: pr.number, head: pr.head.ref, base: pr.base.ref}) : '');
            core.setOutput('event', run.event);
            core.setOutput('branch', run.head_branch);
            await github.rest.repos.createCommitStatus({...repo, sha: run.head_sha, context: 'SonarCloud Quality Gate', state: 'pending', description: 'Checking the CI result and SonarCloud quality gate', target_url: `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`});
            if (run.conclusion !== 'success') throw new Error(`CI finished with ${run.conclusion}; analysis cannot pass`);
            if (run.event === 'merge_group') {
              // Read one consistent queue snapshot. Do not guess membership
              // from a branch name, commit message, or just the last PR.
              const data = await github.graphql(`query($owner:String!, $repo:String!) {
                repository(owner:$owner, name:$repo) {
                  defaultBranchRef { name target { oid } }
                  mergeQueue(branch:"main") { entries(first:100) {
                    pageInfo { hasNextPage }
                    nodes { position baseCommit { oid } headCommit { oid }
                      pullRequest { number headRefOid baseRefName } }
                  } }
                }
              }`, {owner: repo.owner, repo: repo.repo});
              const repository = data.repository;
              const entries = repository.mergeQueue?.entries;
              if (!entries || entries.pageInfo.hasNextPage || repository.defaultBranchRef.name !== 'main')
                throw new Error('Cannot read a complete main merge queue');
              const nodes = entries.nodes.sort((a, b) => a.position - b.position);
              const matches = nodes.filter(e => e.headCommit.oid === run.head_sha);
              if (matches.length !== 1) throw new Error('Queue commit is missing or ambiguous; rerun current queue CI');
              const members = nodes.filter(e => e.position <= matches[0].position);
              let base = repository.defaultBranchRef.target.oid;
              const seen = new Set();
              const {data: trustedWorkflow} = await github.rest.actions.getWorkflow(
                {...repo, workflow_id: 'quality-gate.yml'});

              for (const [index, entry] of members.entries()) {
                if (entry.position !== index + 1 || entry.baseCommit.oid !== base ||
                    entry.pullRequest.baseRefName !== 'main' || seen.has(entry.pullRequest.number))
                  throw new Error('Queue membership is stale or discontinuous');
                seen.add(entry.pullRequest.number);
                const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef,
                  {...repo, ref: entry.pullRequest.headRefOid, per_page: 100});
                const status = statuses.find(s => s.context === 'SonarCloud Quality Gate');
                if (!status || status.state !== 'success' || status.creator?.login !== 'github-actions[bot]')
                  throw new Error(`PR #${entry.pullRequest.number} lacks a passing gate on its exact head`);
                // Any same-repository PR workflow can publish a status. Trust
                // only a completed default-branch workflow_run execution with
                // a successful-scan artifact bound to this exact PR head.
                const url = new URL(status.target_url);
                const prefix = `/${repo.owner}/${repo.repo}/actions/runs/`;
                const runId = url.pathname.startsWith(prefix) ? url.pathname.slice(prefix.length) : '';
                if (url.origin !== context.serverUrl || url.search || url.hash || !/^\d+$/.test(runId))
                  throw new Error('Gate status has no trusted workflow run URL');
                const {data: scanRun} = await github.rest.actions.getWorkflowRun({...repo, run_id: Number(runId)});
                if (scanRun.workflow_id !== trustedWorkflow.id || scanRun.event !== 'workflow_run' ||
                    scanRun.head_branch !== 'main' || scanRun.conclusion !== 'success')
                  throw new Error('Gate status was not published by a successful trusted scan workflow');
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                  {...repo, run_id: Number(runId), per_page: 100});
                const proofs = artifacts.filter(a => a.name === `sonar-gate-${entry.pullRequest.headRefOid}` && !a.expired);
                if (proofs.length !== 1) throw new Error('Trusted scan proof is missing for the exact PR head');

                base = entry.headCommit.oid;
              }
              if (base !== run.head_sha || !members.length) throw new Error('Queue prefix does not reach analyzed SHA');
              core.info(`Verified exact Sonar gate results for ${members.length} member PRs. Queue commit itself is not Sonar-scanned.`);
            }


      # SECURITY: source and coverage are untrusted input. Never run repository
      # scripts, builds, package installers, or local actions in this job.
      # Use only fixed inline code and pinned scanner/action implementations.
      - if: steps.metadata.outputs.event != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.metadata.outputs.sha }}
          persist-credentials: false

      - name: Download complete Python coverage
        if: steps.metadata.outputs.event != 'merge_group'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-coverage
          path: backend
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Go coverage
        if: steps.metadata.outputs.event != 'merge_group'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: go-coverage
          path: cli
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare trusted scan settings
        if: steps.metadata.outputs.event != 'merge_group'
        env:
          TRUSTED_SHA: ${{ github.sha }}
          ANALYZED_SHA: ${{ steps.metadata.outputs.sha }}
          ANALYSIS_EVENT: ${{ steps.metadata.outputs.event }}
          ANALYSIS_BRANCH: ${{ steps.metadata.outputs.branch }}
          ANALYSIS_PR: ${{ steps.metadata.outputs.pr }}
        run: |
          set -euo pipefail
          # Read settings from the trusted default-branch workflow commit. A PR
          # cannot redirect SONAR_TOKEN or suppress its own findings via config.
          git show "${TRUSTED_SHA}:sonar-project.properties" > /tmp/sonar-trusted.properties
          git describe --tags --match 'v[0-9]*' --abbrev=0 "${ANALYZED_SHA}" > /tmp/sonar-release-version
          # Isolated mode ignores checkout modules and Python environment hooks.
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET

          report = Path('backend/coverage.xml')
          tree = ET.parse(report)
          sources = tree.findall('./sources/source')
          if len(sources) != 1:
              raise SystemExit('Expected one Python coverage source root')
          sources[0].text = 'backend'
          tree.write(report, encoding='utf-8', xml_declaration=True)
          if not Path('cli/coverage.out').stat().st_size:
              raise SystemExit('Go coverage report is empty')
          settings = Path('/tmp/sonar-trusted.properties').read_text()
          settings += '\nsonar.projectVersion=' + Path('/tmp/sonar-release-version').read_text().strip() + '\n'
          settings += 'sonar.scm.revision=' + os.environ['ANALYZED_SHA'] + '\n'
          settings += 'sonar.qualitygate.wait=true\nsonar.qualitygate.timeout=600\n'
          if os.environ['ANALYSIS_EVENT'] == 'pull_request':
              pr = json.loads(os.environ['ANALYSIS_PR'])
              settings += f"sonar.pullrequest.key={pr['number']}\nsonar.pullrequest.branch={pr['head']}\nsonar.pullrequest.base={pr['base']}\n"
          else:
              settings += 'sonar.branch.name=main\n'
          output = Path('.sonar-ci.properties')
          output.unlink(missing_ok=True)
          output.write_text(settings)
          PY

      - name: SonarCloud scan and gate result
        if: steps.metadata.outputs.event != 'merge_group'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
        with:
          args: -Dproject.settings=.sonar-ci.properties
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Record successful scan proof
        if: steps.metadata.outputs.event != 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/sonar-gate-proof.json`, JSON.stringify({sha: context.payload.workflow_run.head_sha}));

      - name: Upload successful scan proof
        if: steps.metadata.outputs.event != 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sonar-gate-${{ steps.metadata.outputs.sha }}
          path: ${{ runner.temp }}/sonar-gate-proof.json
          retention-days: 7
          if-no-files-found: error

      - name: Publish terminal gate status on the analyzed commit
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const passed = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({...context.repo, sha: run.head_sha, context: 'SonarCloud Quality Gate', state: passed ? 'success' : 'failure', description: passed ? (run.event === 'merge_group' ? 'Member PR heads passed; queue commit not Sonar-scanned' : 'SonarCloud quality gate passed') : 'CI, coverage, scan, or member PR gate failed; see workflow log', target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
