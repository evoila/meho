# actionlint configuration.
# Declares custom self-hosted runner labels used by this repo so actionlint
# stops emitting unknown-label warnings on the bare `runs-on: meho-runners-ci`
# (and the legacy `meho-runners` form during the migration window).
# Drop `meho-runners` here when the old pool is retired.
# The two heavy sets: `meho-runners-ci-heavy-queue` (merge-queue runs only)
# and `meho-runners-ci-heavy` (every other event).
# `meho-runners-ci-heavy-site2` is the second runner site (unit shards 4-6 of
# a pull request, and its smoke check). Only the job
# python-unit-shard-second-site in ci.yml and second-site-smoke.yml may name
# it; backend/tests/test_ci_second_runner_site.py checks every workflow file.
#
# Reference: https://github.com/rhysd/actionlint/blob/main/docs/config.md
self-hosted-runner:
  labels:
    - meho-runners
    - meho-runners-ci
    - meho-runners-ci-heavy
    - meho-runners-ci-heavy-queue
    - meho-runners-ci-heavy-site2
