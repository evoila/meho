          done
          echo "spec-shelf OK: argocd-swagger.json present under spec-shelf/docs/argocd-3.3/; the Azure Resource Manager specs (subscriptions.json and the rest) present under spec-shelf/docs/azure-arm-2026.10/; the Cloud Builder reference lists present under spec-shelf/docs/cloud-builder-5.0/ + spec-shelf/docs/cloud-builder-5.1/ + spec-shelf/docs/cloud-builder-5.2/; vim.wsdl present under spec-shelf/docs/esxi-9.0/wsdl/vim/; fleet-lcm-openapi.yaml present under spec-shelf/docs/fleet-lcm-9.0/; harbor-swagger.yaml present under spec-shelf/docs/harbor-2.12/; webservice-en.md present under spec-shelf/docs/hetzner-robot-2026-04/; keycloak-admin-openapi.json present under spec-shelf/docs/keycloak-26.3/; loki-http-api.md present under spec-shelf/docs/loki-3.7/; nsx_api.openapi3.json + nsx_policy_api.openapi3.json present under spec-shelf/docs/nsx-9.0/; apidata.js present under spec-shelf/docs/proxmox-8.4/; http-api-index.md + rabbit_shovel_mgmt_shovels.erl present under spec-shelf/docs/rabbitmq-4.3/; salt-raas-8.18-reference-operations.tsv present under spec-shelf/docs/salt-raas-8.18/; sddc-manager-openapi.json present under spec-shelf/docs/sddc-manager-9.0/ + spec-shelf/docs/sddc-manager-9.1/; vcenter.yaml + vi-json-8.0u1.yaml + vi-json-8.0u2.yaml + vi-json-8.0u3.yaml + vsan/8.0u1/vsan-8.0u1-methods.txt + vsan/8.0u2/vsan-8.0u2-methods.txt + the two vsanmgmtObjects.py present under spec-shelf/docs/vcenter-8.0/; vcenter.yaml + vi-json.yaml present under spec-shelf/docs/vcenter-9.0/; vra-iaas.json present under spec-shelf/docs/vcf-automation-9.0/swagger-vra-sdk-go-v0.6.5/; the provider-infrastructure-apis reference list present under spec-shelf/docs/vcf-automation-9.0-reference/ + spec-shelf/docs/vcf-automation-9.1/ + spec-shelf/docs/vcf-automation-9.1.1/; vcf-installer-openapi.json present under spec-shelf/docs/vcf-installer-9.0/ + spec-shelf/docs/vcf-installer-9.1/; vcf-operations-openapi.ingestable.json + vcf-operations-for-logs-openapi.json present under spec-shelf/docs/vcf-operations-9.0/; the orchestrator reference list present under spec-shelf/docs/vcf-operations-orchestrator-9.0/ + spec-shelf/docs/vcf-operations-orchestrator-9.1/; recovery-srm-v2.yaml + replication-vr-v2.yaml present under spec-shelf/docs/vcf-protection-and-recovery-9.1/; vks-paths-from-vcenter.txt present under spec-shelf/docs/vks-9.0/; cloudapi-39.2.json present under spec-shelf/docs/vmware-cloud-director-10.6/"

      - name: Docker Hub login (for testcontainers pulls)
        # Same rationale as python-unit-shard's login step — the
        # integration subtree is the heaviest testcontainers consumer
        # (pgvector/valkey/k3d/vcsim), so authenticated pulls are
        # load-bearing here in particular.
        # Empty-secret guard — see the python-tests job's login step for
        # why Dependabot runs need it. This job pulls the most images, so
        # it is the likeliest to feel the lost rate-limit headroom; that
        # is an argument for mirroring the Dependabot secrets, not for
        # letting the step hard-fail.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Go
        # test_keycloak_bootstrap_mcp_login.py (#4002) builds the meho CLI
        # and runs `meho admin keycloak bootstrap-clients` against the
        # Keycloak container. Same version + cache shape as the
        # go-lint-test lane.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: cli/go.sum

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Pinned uv; see the python-lint job for why.
          version: "0.13.0"
          enable-cache: true

      - name: Sync Python environment (locked)
        run: uv sync --locked --all-groups

      - name: Pytest (integration testcontainers, one shard)
        # The tests/integration/ subtree plus the G0.7 vSphere canary
        # module, split over the shards. No --cov here: coverage is emitted
        # by the python-coverage jobs. -x for fast-fail on the first broken
        # integration case in this shard. No xdist inside a shard: the
        # container-heavy fixtures were never checked under xdist; the
        # speed comes from the parallel shards instead (#5384).
        #
        # The canary module is selected here (#2980) because its
        # armed-shelf full-ingest tests need the container-heavy
        # budget: the ~164 s two-spec ingest runs ONCE per module
        # (module-scoped _canary_corpus fixture, amortised in PR #2995
        # after per-test ingests — 25 x ~164 s — timeout-killed the
        # serial job's 60-min cap on the first armed run; per-test ingests
        # had already blown the unit lane's 25-min cap the day the
        # shelf was armed). These shards are the canary's single armed
        # lane; the unit sweep opts out via
        # MEHO_SKIP_SPEC_INGEST_TESTS (see its Pytest step's env
        # comment). Shelf absent (fork/Dependabot/unprovisioned) → the
        # canary skips exactly as it always did; its fixture-less
        # self-checks also run (again) here — seconds, harmless. Lane
        # placement rule + amortisation pattern:
        # docs/decisions/spec-reconcile-guards-standard.md.
        # -rs prints the reason of every skipped test. The k3s tests skip
        # when the cluster cannot pull an image; without the reason a green
        # lane hides that nothing ran on the cluster.
        run: |
          # Split by measured file time, the same tool as the unit shards
          # (tests/_unit_shard_split.py) with the integration measurements
          # in tests/_integration_shard_durations.json. Every file lands in
          # exactly one shard; tests/test_unit_shard_split.py pins that and
          # checks this file list. The splitter prints the file count and
          # the predicted seconds per shard on stderr.
          TOTAL=4
          SHARD="${{ matrix.shard }}"
          mapfile -t SHARD_FILES < <({ find tests/integration -name 'test_*.py'; echo tests/acceptance/test_g07_vsphere_canary.py; } | sort | uv run python tests/_unit_shard_split.py --durations tests/_integration_shard_durations.json --shard "${SHARD}" --total "${TOTAL}")
          echo "shard ${SHARD}/${TOTAL}: ${#SHARD_FILES[@]} test files"
          if [ "${#SHARD_FILES[@]}" -eq 0 ]; then
            echo "::error::shard ${SHARD} selected 0 test files — shard split broken"
            exit 1
          fi
          # --junitxml: the per-test times of this shard, uploaded by the
          # step below, to refresh tests/_integration_shard_durations.json.
          # xunit1 because only xunit1 writes the test file name on every
          # test case.
          uv run pytest -x -rs -o junit_family=xunit1 \
            --junitxml=pytest-integration-shard.xml "${SHARD_FILES[@]}"

      - name: Upload per-test times (input for the shard split)
        # Refresh tests/_integration_shard_durations.json from these
        # artifacts (one per shard) of a green run; the docstring of
        # tests/_unit_shard_split.py has the commands. continue-on-error +
        # timeout-minutes: a failed or hung upload must never fail or hold
        # the shard.
        if: always() && hashFiles('backend/pytest-integration-shard.xml') != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-integration-shard-junit-${{ matrix.shard }}
          path: backend/pytest-integration-shard.xml
          retention-days: 14
          if-no-files-found: warn

  python-integration:
    name: Python (integration testcontainers)
    # FAN-IN carrying the branch-protection required context (#5384). This
    # job name is the EXACT string pinned in the `main` required checks, so
    # branch protection and the rulesets need no change: the name moved off
    # the old serial job onto this fan-in, the same way python-unit-lane
    # took over `Python (ruff + mypy + pytest)` (#3251).
    #
    # Same rules as python-unit-lane (read its comment for the full why):
    #  1. NOT fail-open. `always()` makes this job run even when a shard
    #     failed (a skipped required check counts as Success, #2140), and
    #     the step FAILS on any shard result that is not allowed. A hung
    #     shard hits its own timeout → `cancelled` → this gate fails.
    #  2. Fork PRs: this job skips by its own `if:`, which reports the
    #     required context as Success, exactly as the old serial job did.
    #  3. Docs-only PRs: every shard skips by its detect-gated `if:` and
    #     this step accepts `skipped` ONLY when `changes` succeeded and
    #     said docs_only=true. On every other run it needs strict success.
    #  4. No-backend PRs (#5296): the shards skip the same way when
    #     `backend_python` is `false`, and this step accepts `skipped` then
    #     too. The merge queue runs the shards on the merged result.
    # GitHub-hosted runner (#4626): one bash step, no setup; it must never
    # wait for a slot on the internal pool.
    needs: [changes, python-integration-shard]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every integration shard passed
        # needs.python-integration-shard.result is the AGGREGATE of the
        # matrix: success only if every leg succeeded.
        run: |
          detect='${{ needs.changes.result }}'
          docs_only='${{ needs.changes.outputs.docs_only }}'
          backend_python='${{ needs.changes.outputs.backend_python }}'
          shards='${{ needs.python-integration-shard.result }}'
          echo "changes (detect): result=${detect}, docs_only=${docs_only}, backend_python=${backend_python}"
          echo "python-integration-shard (aggregate of all 4 shard legs): ${shards}"

          if [ "${detect}" != "success" ]; then
            echo "::error title=Integration lane — detector not green::the change-detector ('changes') result is '${detect}', so the docs-only classification cannot be trusted. Failing the required integration lane closed."
            exit 1
          fi

          if [ "${docs_only}" = "true" ]; then
            case "${shards}" in
              success|skipped) echo "Integration lane GREEN (docs-only fast path #3252) — all 4 shards skipped-by-detect." ;;
              *) echo "::error title=Integration lane red::an integration shard did not pass (${shards}). Open the 'Python integration shard N/4' jobs above for the detail."; exit 1 ;;
            esac
          elif [ "${backend_python}" = "false" ]; then
            # NO-BACKEND PATH (#5296) — the shards were skipped by their
            # `if:`; the merge queue runs them on the merged result.
            case "${shards}" in
              success|skipped) echo "Integration lane GREEN (no backend change, #5296) — all 4 shards skipped-by-detect." ;;
              *) echo "::error title=Integration lane red::an integration shard did not pass (${shards}). Open the 'Python integration shard N/4' jobs above for the detail."; exit 1 ;;
            esac
          elif [ "${shards}" = "success" ]; then
            echo "Integration lane GREEN — all 4 integration shards passed."
          else
            echo "::error title=Integration lane red::one or more integration shards did not pass (${shards}). This fan-in carries the required context 'Python (integration testcontainers)'; open the 'Python integration shard N/4' jobs above for the failing detail."
            exit 1
          fi

  python-migration-tests:
    name: Python (database migrations)
    # Runs the relocated backend/tests/migrations/ suite: per-migration
    # data-transform assertions, the alembic upgrade/downgrade round-trip,
    # and the 3 pgvector-container forward-compat rollback tests. The
    # required unit lane (the python-unit-shard matrix) excludes
    # tests/migrations from its find, so this job carries the deep
    # per-migration coverage — but only on
    # migration-touching PRs, gated by the `changes` job.
    #
    # Safety net: the unit lane's session-scoped `_schema_template_db`
    # fixture still runs `alembic upgrade head` on every PR, so a broken
    # migration chain still fails every PR via fixture setup; only the
    # deep per-migration behavioural assertions defer to this job.
    #
    # REQUIRED CHECK: register the check context "Python (database
    # migrations)" in branches/main branch protection (manual ops step,
    # not code — #2140 acceptance item B.3).
    needs: changes
    # Run on any non-PR event (push / merge_group — never leave a required
    # check Pending), OR a same-repo PR that touched migration files. A
    # no-migration same-repo PR (and every fork PR) skips this job via
    # `if:`, which reports Success and satisfies the required check.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       needs.changes.outputs.migrations == 'true')
    runs-on: meho-runners-ci
    timeout-minutes: 45
    env:
      # Surfaced as a job-level env var purely so the Docker Hub login
      # step can test it in an `if:`. The `secrets` context is NOT
      # available in a step-level `if:` (GitHub's context-availability
      # table allows it in `with:` / `env:` / `run:` only), so reading
      # the secret through `env` is what makes the guard evaluatable.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # The 3 forward-compat rollback tests spin up pgvector via
      # testcontainers; route the pull through the Harbor proxy cache like
      # the sibling jobs (never `:latest`).
      MEHO_TEST_PGVECTOR_IMAGE: harbor.evba.lab/dockerhub-proxy/pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
      MEHO_TEST_VALKEY_IMAGE: harbor.evba.lab/dockerhub-proxy/valkey/valkey:8
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Docker Hub login (for testcontainers pulls)
        # Authenticated pulls avoid the shared-NAT Docker Hub anonymous
        # rate limit when the rollback tests spin up pgvector/pgvector:pg16.
        # Empty-secret guard — see the python-tests job's login step for
        # why Dependabot runs need it.
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Pinned uv; see the python-lint job for why.
          version: "0.13.0"
          enable-cache: true

      - name: Sync Python environment (locked)
        run: uv sync --locked --all-groups

      - name: Pytest (database migrations)
        run: uv run pytest tests/migrations/

  go-lint-test:
    name: Go (golangci-lint + go test)
    # Fork-PR guard mirrors the Python job — same rationale. Runs on a
    # GitHub-hosted runner since #4626: it needs only the Go toolchain and
    # public egress.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        # Same version + cache shape as cli-release.yml so a single
        # supply-chain audit covers both. cache-dependency-path keys
        # the Go module cache off cli/go.sum, the only Go module in
        # the tree today.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Tracks `cli/go.mod`'s `go 1.26.10` directive. golangci-lint
          # invokes `go/packages` which honors the go.mod-required Go
          # version; running an older Go than go.mod requires fails with
          # `go.mod requires go >= X` (CI run 25680051917).
          # Bumped from 1.25 → 1.26 because Go 1.25 gets no more
          # security fixes: nine standard-library CVEs (net/http,
          # crypto/tls, net/textproto) need go1.26.9 or newer, and
          # GO-2026-6809 (crypto/x509) needs go1.26.10 or newer.
          # '1.26' resolves the newest 1.26.x patch; go.mod's 1.26.10
          # floor (with GOTOOLCHAIN=local, which setup-go sets) makes
          # an older 1.26.x fail the build instead of shipping the CVEs.
          # check-latest: the runner image can cache an older 1.26.x
          # (it had 1.26.9 when go.mod moved to 1.26.10), and setup-go
          # uses a cached match unless asked to check for a newer one.
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: cli/go.sum

      - name: golangci-lint
        # v9.2.0: cli/.golangci.yml was migrated from v1 to v2 schema in
        # PR #640 (alongside the go 1.25 bump) so the action major upgrade
        # is now safe. golangci-lint must be built with a Go whose
        # language version (1.26) is not lower than the targeted one, or
        # it fails with "the Go language version used to build
        # golangci-lint is lower than the targeted Go version" (as v1.64.8,
        # built with Go 1.24, did once go-version was bumped to 1.25).
        # The v2.12.2 release binary is built with go1.26.2, so it
        # supports the Go 1.26 target without a bump.
        # golangci-lint-action v7+ refuses v1.x binaries; v9.2.0 requires
        # golangci-lint >= v2.x and fully supports the v2 config schema.
        # SHA pinned to v9.2.0 commit (devops_best_practices: pin to
        # immutable SHA). Dependabot ignore list updated to track v9.x
        # minor/patch bumps rather than the now-retired v6 pin.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.12.2
          working-directory: cli

      - name: Go build
        # Smoke build of every package — fails fast on a broken import
        # graph or a typo before the test gate touches anything. cwd is
        # cli/ so `./...` resolves to the CLI module's packages only.
        working-directory: cli
        run: go build ./...

      - name: govulncheck (Go dependency CVE scan)
        # Surfaces known CVEs in the CLI's Go dependency graph.
        # govulncheck does reachability analysis against the Go vuln DB
        # (https://vuln.go.dev): it exits non-zero only when a
        # vulnerable symbol is actually reachable from this module's
        # call graph, so the gate fails on real exposure instead of on
        # every transitive advisory. Placed after `go build` so a
        # broken import graph fails on the cheaper, clearer step first.
        # The tool version is pinned (same supply-chain rule as the
        # SHA-pinned actions above); Dependabot doesn't track
        # `go install` pins, so bump it deliberately alongside Go
        # toolchain bumps. v1.8.0 is the first release whose go.mod
        # targets Go 1.26 (bumped with the move to Go 1.26).
        working-directory: cli
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Ensure C toolchain is available (for cgo race runtime)
        # `go test -race` links the cgo-based race runtime, which needs
        # a working C toolchain — both `gcc` (or any cc) AND libc
        # development headers (`<stdlib.h>` etc.). The `meho-runners-ci`
        # self-hosted pool ships a minimal image without either, so
        # the race test would fail with one of:
        #   - `cgo: C compiler "gcc" not found` (no gcc), or
        #   - `_cgo_export.c:3:10: fatal error: stdlib.h: No such file
        #     or directory` (gcc installed, no libc6-dev — caught
        #     after the first iteration of this PR's CI).
        #
        # Install both as a unit. We check `<stdlib.h>` (not just
        # `gcc`) because a half-provisioned runner (gcc, no headers)
        # is exactly the state the previous fix iteration produced.
        # The probe compiles a one-liner via `cpp` so a future runner
        # with a non-gcc cc (e.g. clang) still passes the check.
        #
        # `sudo -n` keeps the step fail-fast on a runner that doesn't
        # grant passwordless sudo — that's a runner-pool config gap
        # better surfaced loudly here than buried in a confusing
        # later `cgo:` error. `--no-install-recommends` keeps the
        # install fast and minimal: gcc + libc6-dev only, no
        # editors/manpages/etc. The proper long-term fix is to bake
        # the C toolchain into the meho-runners-ci base image; until
        # then this step keeps PR CI green without expanding the
        # workflow's blast radius. On the GitHub-hosted runner this job
        # uses since #4626, gcc and libc6-dev are preinstalled, so the
        # probe passes and apt never runs; the step stays so the job can
        # move back to the internal pool without edits.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          have_cc=0
          if command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1; then
            have_cc=1
          fi
          have_headers=0
          if echo '#include <stdlib.h>' | cpp -E - >/dev/null 2>&1; then
            have_headers=1
          fi
          if [ "${have_cc}" = "1" ] && [ "${have_headers}" = "1" ]; then
            echo "C toolchain ready: $(gcc --version 2>/dev/null | head -1 || cc --version | head -1)"
            exit 0
          fi
          echo "C toolchain incomplete (cc=${have_cc} headers=${have_headers}); installing gcc + libc6-dev via apt..."
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc libc6-dev

      - name: Go test (race + coverage)
        # -race catches data races the CLI may hit when the
        # async-token-refresh code (internal/auth) is exercised from
        # parallel tests. -coverprofile writes a merged profile consumed
        # by the downstream SonarCloud scan (sonar.go.coverage.reportPaths)
        # so the Clean-as-You-Code new-code-coverage gate sees Go coverage,
        # not 0%. -covermode=atomic is required under -race.
        #
        # CGO_ENABLED=1 is required: `go test -race` is implemented in
        # the cgo-based race runtime and refuses to run otherwise
        # (`go: -race requires cgo; enable cgo by setting CGO_ENABLED=1`).
        # The `meho-runners-ci` self-hosted pool defaults to CGO_ENABLED=0,
        # so the flag must be set explicitly here. The preceding step
        # ensures `gcc` is on PATH so the race runtime can actually
        # link. Scoped to this step only — the build/lint steps work
        # fine with cgo off and don't need the C toolchain dependency.
        working-directory: cli
        env:
          CGO_ENABLED: '1'
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload Go coverage artifact
        # Consumed by quality-gate.yml (`workflow_run` -> SonarCloud).
        # Lossy like the Python sibling: a missing upload degrades the
        # SonarCloud signal to "no Go coverage for this run" but never
        # invalidates the test outcome. continue-on-error is appropriate
        # ONLY for this step.
        if: always() && hashFiles('cli/coverage.out') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: go-coverage
          path: cli/coverage.out
          retention-days: 7

  cli-api-snapshot-freshness:
    name: CLI API snapshot freshness
    # Fork-PR guard mirrors the other jobs (kept unchanged by #4626). Runs on
    # a GitHub-hosted runner: it needs only Go, uv and public egress.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # persist-credentials: false — this job only does a read-only
        # checkout + a working-tree `git diff`; it never pushes, so it
        # has no need for the checkout token persisted in local git config.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        # `make generate` runs the pinned oapi-codegen (installed by the
        # Makefile `tools` target) which needs Go. Same version + cache
        # shape as the go-lint-test lane.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: cli/go.sum

      - name: Ensure make is available
        # The minimal meho-runners-ci image ships no `make` (the Go lane
        # never needed it — it calls `go` directly). Install it via apt so
        # this job can drive the canonical Makefile targets rather than
        # duplicating their commands (which would drift from the Makefile).
        # Same `sudo -n apt-get` pattern as the go-lint-test C-toolchain
        # step; baking make into the base image is the long-term fix.
        # The GitHub-hosted runner this job uses since #4626 ships make,
        # so the step is a no-op there and stays for a possible move back.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if command -v make >/dev/null 2>&1; then
            echo "make ready: $(make --version | head -1)"
            exit 0
          fi
          echo "make missing; installing via apt..."
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends make

      - name: Install uv
        # `make snapshot-openapi` drives the backplane FastAPI app via
        # `uv run` (cli/api/snapshot-openapi.py imports meho_backplane.main
        # and calls app.openapi()), so the backend env must resolve. Same
        # action + cache shape as the Python lanes.
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Pinned uv; see the python-lint job for why.
          version: "0.13.0"
          enable-cache: true

      - name: Sync backend environment (locked)
        working-directory: backend
        run: uv sync --locked --all-groups

      - name: Regenerate OpenAPI snapshot + Go client + CLI reference doc
        # Run the same Make targets the maintainer runs so the drift check
        # compares like-for-like. snapshot-openapi writes cli/api/openapi.json
        # (downgrading OpenAPI 3.1->3.0 for oapi-codegen v2, see the script
        # header); generate (which depends on `tools`) rebuilds
        # cli/internal/api/client.gen.go from it; cli-docs re-renders the
        # committed docs-site/reference/cli.md from the cobra command tree
        # (cmd/docgen, discovery disabled — deterministic + offline). All
        # three regens are idempotent, so a clean tree means the committed
        # artifacts are already current.
        working-directory: cli
        run: |
          make snapshot-openapi
          make generate
          make cli-docs

      - name: Fail if the committed snapshot / client / CLI reference are stale
        # The snapshot, generated client, and CLI reference are checked-in
        # artifacts derived from the backend OpenAPI document and the cobra
        # command tree. If a backend route or a CLI command changed without
        # re-running the targets above, the working tree now differs from
        # HEAD — fail with the remediation command. Same rationale as a
        # `go mod tidy` / `uv.lock --locked` drift gate.
        run: |
          if ! git diff --exit-code -- cli/api/openapi.json cli/internal/api/client.gen.go docs-site/reference/cli.md; then
            echo "::error title=CLI artifacts stale::cli/api/openapi.json, cli/internal/api/client.gen.go, and/or docs-site/reference/cli.md are out of date. Run 'cd cli && make snapshot-openapi && make generate && make cli-docs' and commit the result."
            exit 1
          fi

  helm-lint-template:
    name: Helm (lint + template + kubeconform)
    # Fork-PR guard mirrors the other jobs. Runs on a GitHub-hosted runner
    # since #4626: helm + kubeconform need only public egress.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Helm
        # Same version pin as chart.yml's validate + publish jobs so
        # the central CI check exercises the same Helm binary the
        # publish pipeline uses. >=3.8 ships OCI helm push (irrelevant
        # here — this job never pushes — but kept aligned).
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.16.4

      - name: Install kubeconform
        # kubeconform validates rendered manifests against Kubernetes
        # JSON Schemas offline. Pin to v0.6.7 by SHA256 — same shape
        # chart.yml uses (devops_best_practices: no `curl|sh` of
        # unpinned binaries). Install to $HOME/.local/bin because the
        # self-hosted meho-runners-ci pool runs as a non-root user that
        # cannot write to /usr/local/bin (regression caught in PR #173
        # / CI run 25644668781). Appending to $GITHUB_PATH surfaces
        # the binary to subsequent steps without relying on the install
        # step's frozen PATH. $HOME/.local/bin works the same on the
        # GitHub-hosted runner this job uses since #4626.
        run: |
          set -euo pipefail
          KC_VER=v0.6.7
          KC_SHA=95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KC_VER}/kubeconform-linux-amd64.tar.gz"
          echo "${KC_SHA}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp/ kubeconform
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 /tmp/kubeconform "${HOME}/.local/bin/kubeconform"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/kubeconform" -v

      - name: Helm lint
        # The chart ships safe-by-default empty fields that
        # values.schema.json rejects at lint time on purpose; the same
        # override set chart.yml uses keeps the lint exercising the
        # typed schema end-to-end. Any drift between the CI override
        # set and chart.yml means one of the two is wrong — kept in
        # sync intentionally.
        run: |
          helm lint deploy/charts/meho/ \
            --set image.tag=test \
            --set ingress.host=meho.test \
            --set ingress.tls.secretName=meho-tls \
            --set postgres.credentialsSecret=meho-postgres \
            --set vault.address=https://vault.test \
            --set keycloak.issuer=https://keycloak.test/realms/meho \
            --set config.keycloakIssuerUrl=https://keycloak.test/realms/meho \
            --set config.keycloakAudience=meho-backplane \
            --set config.vaultAddr=https://vault.test \
            --set networkPolicy.postgresCIDR=10.0.1.0/24 \
            --set networkPolicy.vaultCIDR=10.0.2.0/24 \
            --set networkPolicy.keycloakCIDR=10.0.3.0/24

      - name: Helm template + kubeconform
        # Render then validate. -strict rejects unknown fields;
        # -kubernetes-version 1.28.0 matches the chart's kubeVersion
        # floor (also matches chart.yml). CRDs (ExternalSecret etc.)
        # are not validated upstream so -ignore-missing-schemas keeps
        # the gate from failing on missing CRD schemas while still
        # catching every core API drift.
        run: |
          helm template test deploy/charts/meho/ \
            --set image.tag=test \
            --set ingress.host=meho.test \
            --set ingress.tls.secretName=meho-tls \
            --set postgres.credentialsSecret=meho-postgres \
            --set vault.address=https://vault.test \
            --set keycloak.issuer=https://keycloak.test/realms/meho \
            --set config.keycloakIssuerUrl=https://keycloak.test/realms/meho \
            --set config.keycloakAudience=meho-backplane \
            --set config.vaultAddr=https://vault.test \
            --set networkPolicy.postgresCIDR=10.0.1.0/24 \
            --set networkPolicy.vaultCIDR=10.0.2.0/24 \
            --set networkPolicy.keycloakCIDR=10.0.3.0/24 \
            > /tmp/rendered.yaml

          kubeconform \
            -strict \
            -kubernetes-version 1.28.0 \
            -ignore-missing-schemas \
            -summary \
            /tmp/rendered.yaml

  # ---------------------------------------------------------------------------
  # Merge-queue watchdog (#4732). Stops a merge-queue CI run as soon as its
  # result no longer counts, so its runners go back to live runs.
  #
  # Why: the queue drops a group when a required check of the group fails,
  # or when it takes out a pull request ahead of the group and builds the
  # group again. It then deletes the group's branch. GitHub does not stop
  # the group's CI run. On 2026-10-21 a broken Go vulnerability scan failed
  # 31 queue runs in their first minute; the queue dropped every group
  # within about a minute, but the runs went on for a median of 131 more
  # minutes and held 73 percent of the heavy runner pool for most of the
  # morning. Almost half of that day's merge-queue runner time was spent on
  # runs whose result nobody could use.
  #
  # Why not `cancel-in-progress` for merge_group: each group has its own
  # branch, so a new group never replaces the run of an old group, and a
  # cancelled live check drops its group (see the `concurrency:` comment).
  #
  # What the job does, about once a minute, with 2 API calls per poll (3
  # on the one poll that finds the branch gone):
  #   1. Lists this run's jobs. If every job other than this one and the
  #      `CLI API snapshot freshness` job has finished, it ends with
  #      success — checked on two polls in a row, because a job that still
  #      waits on `needs` (the `Python (ruff + mypy + pytest)` fan-in) is
  #      not listed until its dependencies finish. This check runs BEFORE
  #      the branch check, so a run that passed and merged (which also
  #      deletes the queue branch) is never cancelled. The snapshot job is
  #      left out because the group can merge while it still runs: it is
  #      not required, so a run that merged with it still open must not be
  #      cancelled either.
  #   2. If a job other than `CLI API snapshot freshness` ended in failure,
  #      cancelled or timed_out, it cancels the run (rule a). Every other
  #      job of a merge-queue run either carries a required check or feeds
  #      the required fan-in, so its failure drops the group anyway. The
  #      snapshot job is not required: its failure alone keeps the group,
  #      so it must not cancel the run.
  #   3. Asks GitHub whether this run's queue branch (`github.ref_name`)
  #      still exists. Only a `404` can cancel the run (rule b). Any other
  #      answer or error (timeout, 403, 429, 5xx) keeps the run alive.
  #      Before it cancels, it lists the jobs once more: the last required
  #      job can pass, and the group can merge, between step 1 and step 3,
  #      and a merged run has lost its branch too. It cancels only when
  #      that second look still shows required work open (or a red job).
  #      If the second look fails, or shows every required job finished,
  #      the run stays alive.
  #
  # It never fails (the runner starts the step with `bash -e`, so every
  # call is checked; a failed or unreadable call only means "look again
  # next minute", and no branch check runs while the jobs' state is
  # unknown), it is not a required check, and
  # it runs on a GitHub-hosted runner so it never takes a slot from the
  # jobs it watches. The queue builds at most 4 groups at once, so at most
  # 4 watchdogs run at the same time: about 480 of the 1,000 API calls an
  # hour that the job token may make per repository, worst case.
  # ---------------------------------------------------------------------------
  merge-queue-watchdog:
    name: Merge queue watchdog
    # Only merge-queue runs. A pull-request run must still show every failing
    # job, and a push to `main` has no queue group that can be dropped.
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    # Backstop only: the loop below stops itself, with success, after 170
    # minutes. A green merge-queue run took at most 78 minutes (#4732), and
    # the queue itself gives up on a group long before this cap.
    timeout-minutes: 180
    # `actions: write` is what cancelling a run needs. Only this job gets it;
    # the workflow-wide default stays `contents: read`. `contents: read` is
    # listed again because a job-level block replaces the workflow-wide one.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel this run once the queue has dropped its group
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_BRANCH: ${{ github.ref_name }}
          # Must match this job's `name:` above — the jobs API lists display
          # names, and the loop has to leave itself out of "all other jobs".
          SELF_NAME: Merge queue watchdog
          # The one job that is not required and feeds no required fan-in.
          # Its failure does not drop the group, and the group can merge
          # while it still runs. Keep in sync with that job's `name:`.
          HARMLESS_JOB: CLI API snapshot freshness
        run: |
          set -uo pipefail
          api="repos/${GITHUB_REPOSITORY}"
          interval=60
          stop_after=$((170 * 60))
          quiet_polls=0

          cancel_run() {
            echo "::notice title=Merge queue watchdog::${1} Cancelling run ${GITHUB_RUN_ID}."
            if timeout 30 gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"; then
              echo "cancel request accepted; GitHub stops the other jobs and then this one"
              return 0
            fi
            echo "cancel request failed; the run keeps going and the next poll tries again"
            return 1
          }

          # Reads this run's jobs into `open` (jobs that carry or feed a
          # required check and are still queued or running) and `red` (such
          # jobs that did not pass). Returns 1 when the jobs cannot be listed
          # or read. The caller must then not cancel: a run that passed and
          # merged has lost its branch too, so the branch alone proves nothing.
          read_jobs() {
            local jobs
            if ! jobs="$(timeout 30 gh api "${api}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" 2>&1)"; then
              echo "jobs API did not answer (${jobs})"
              return 1
            fi
            # The runner starts this step with `bash -e`, so every jq call is
            # guarded: an unreadable answer must not end the watchdog.
            if ! open="$(jq --arg me "${SELF_NAME}" --arg ok "${HARMLESS_JOB}" \
                  '[.jobs[] | select(.name != $me and .name != $ok and .status != "completed")] | length' <<<"${jobs}")" \
               || ! red="$(jq -r --arg me "${SELF_NAME}" --arg ok "${HARMLESS_JOB}" \
                  '[.jobs[] | select(.name != $me and .name != $ok
                     and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out"))
                   | .name] | join(", ")' <<<"${jobs}")"; then
              echo "jobs API answer could not be read"
              return 1
            fi
          }

          echo "watching queue branch '${QUEUE_BRANCH}' for run ${GITHUB_RUN_ID}; one poll every ${interval} s"
          while [ "${SECONDS}" -lt "${stop_after}" ]; do
            # 1 + 2: this run's own jobs. Required ones done -> leave. One red -> cancel.
            # When the jobs cannot be listed or read, this poll ends here: the
            # branch check below must not run while the jobs' state is unknown.
            if ! read_jobs; then
              quiet_polls=0
              echo "keeping the run alive and looking again next minute"
              sleep "${interval}"
              continue
            fi
            if [ -n "${red}" ]; then
              cancel_run "A job that carries or feeds a required check did not pass (${red}), so the queue drops this group." && exit 0
            elif [ "${open}" -eq 0 ]; then
              quiet_polls=$((quiet_polls + 1))
              if [ "${quiet_polls}" -ge 2 ]; then
                echo "every job that carries or feeds a required check has finished; nothing left to watch"
                exit 0
              fi
              # Do not look at the branch on this poll: with no required job
              # running there is nothing worth freeing, and a run that just
              # merged has lost its branch for a good reason.
              echo "all listed required jobs have finished; one more poll in case a job was still waiting on 'needs'"
              sleep "${interval}"
              continue
            else
              quiet_polls=0
              echo "${open} required job(s) still queued or running"
            fi

            # 3: the queue branch. Only a clear 404 means the group is gone.
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/${api}/branches/${QUEUE_BRANCH}" 2>/dev/null)" || code="000"
            case "${code}" in
              200) echo "queue branch still exists" ;;
              404)
                # The last required job can pass, and the queue can merge the
                # group, between the jobs lookup above and this branch lookup.
                # A merged run has lost its branch too, so read the jobs once
                # more: only required work that is still open proves a drop.
                if ! read_jobs; then
                  quiet_polls=0
                  echo "the queue branch is gone, but the jobs could not be read again; keeping the run alive and looking again next minute"
                elif [ -n "${red}" ]; then
                  cancel_run "A job that carries or feeds a required check did not pass (${red}), so the queue drops this group." && exit 0
                elif [ "${open}" -eq 0 ]; then
                  quiet_polls=1
                  echo "the queue branch is gone, but every required job has finished since the last look, so the group may have merged; not cancelling"
                else
                  cancel_run "The queue branch '${QUEUE_BRANCH}' is gone while ${open} required job(s) still run: the queue has dropped this group and this run's result no longer counts." && exit 0
                fi ;;
              *)   echo "branch lookup answered '${code}', which is not conclusive; keeping the run alive" ;;
            esac
            sleep "${interval}"
          done
          echo "stopped watching after $((stop_after / 60)) minutes; the run goes on without a watchdog"
          exit 0
