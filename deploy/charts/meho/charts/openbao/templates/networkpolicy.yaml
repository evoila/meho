{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coreVault.fullname" . }}
  labels:
    {{- include "coreVault.labels" . | nindent 4 }}
spec:
  # Selects the OpenBao pod and admits port 8200 only from the backplane
  # pods of this release and the peers in `extraFrom`. Egress is not
  # limited here.
  podSelector:
    matchLabels:
      {{- include "coreVault.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.backplanePodLabels | nindent 14 }}
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
