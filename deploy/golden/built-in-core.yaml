          # The key goes from the file through `tr` (it drops white space,
          # such as the line break `echo` adds) into `key=-` (stdin): it is
          # never on a command line or in a shell variable, and nothing
          # keeps it between passes, so a deleted Secret takes effect on the
          # next pass. The unseal call's output is thrown away; only fixed
          # lines are logged.
          args:
            - |
              trap 'exit 0' TERM
              last=""
              while true; do
                bao status >/dev/null 2>&1
                rc=$?
