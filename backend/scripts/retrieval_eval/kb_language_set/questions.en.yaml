  - id: en-time-keywords
    question: GK-401-SKEW gkctl time-sync
    expect: de/anmeldung-scheitert-zeitabweichung.md
    kind: exact
  - id: en-logs-ticket
    question: The machine that collects our logs is almost out of space, and new lines no longer arrive there.
    expect: de/logserver-festplatte-voll.md
    kind: meaning
  - id: en-logs-keywords
    question: QL-DISK-90 Quill Rotation
    expect: de/logserver-festplatte-voll.md
    kind: exact
  - id: en-cert-ticket
    question: When I open our website, my browser shows a red page and says the connection is not private.
    expect: de/zertifikat-abgelaufen-proxy.md
    kind: meaning
  - id: en-cert-keywords
    question: RP-CERT-EXP relayctl
    expect: de/zertifikat-abgelaufen-proxy.md
    kind: exact
  - id: en-db-ticket
    question: The reports show numbers from half an hour ago, although everything has long been booked in the main system.
    expect: de/datenbank-replikation-verzoegert.md
    kind: meaning
  - id: en-db-keywords
    question: TDB-LAG-30 tarnctl
    expect: de/datenbank-replikation-verzoegert.md
    kind: exact
  - id: en-flap-ticket
    question: All night I get a red message, then a green one, again and again, for the same server.
    expect: en/monitoring-alert-flapping.md
    kind: meaning
  - id: en-flap-keywords
    question: Beacon Monitor BM-FLAP
    expect: en/monitoring-alert-flapping.md
    kind: exact
  - id: en-share-ticket
    question: Opening folders on the shared drive takes forever at the start of the week, but it is fine after lunch.
    expect: en/file-share-slow-monday-morning.md
