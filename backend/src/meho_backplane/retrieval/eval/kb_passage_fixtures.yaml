entries:
  - slug: nimbus-gateway-runbook
    language: en
    status: current
    body: |
      # Nimbus gateway runbook

      This runbook covers day-to-day work on the Nimbus storage gateway.
      It is written for operators who already know the basic setup.

      ## Overview

      The Nimbus gateway caches object storage for local clients. It runs
      as one service per host. Each gateway keeps a local cache disk and a
      small metadata database. The gateway forwards writes to the object
      store in the background.

      ## Install

      Install the package from the internal mirror. Start the service with
      the default profile first. Check that the service answers on the
      health endpoint before you add clients. Keep the default cache size
      until you have measured real traffic.

      ## Network ports

      Clients talk to the gateway on port 7443. The admin interface listens
      on port 7444 and must stay on the management network. The gateway
      opens outbound connections to the object store only.

      ## Certificate rotation

      The gateway certificate is valid for one year. Renew it with the
      command nimbus-ctl cert renew --days 90 and then reload the service
      with nimbus-ctl reload. Clients keep their sessions during a reload.
      Check the new expiry date with nimbus-ctl cert show.

      ## Monitoring

      The gateway exposes metrics on port 9310 under the path /metrics. The
      most useful values are cache hit ratio, upload queue length and disk
      free space. Alert when the upload queue grows for more than one hour.

      ## Upgrade

      Upgrade one gateway at a time. Drain clients first, then install the
      new package, then start the service. Read the release notes for
      changes to the cache format before you upgrade.

      ## Troubleshooting

      Most problems show up as slow uploads or rejected writes. Look at the
      service log first. Error E-417 means the cache disk is full. Free
      space under /var/nimbus/cache and the gateway resumes uploads on its
      own. Error E-503 means the object store is not reachable.

