      # Orbit backup team tips

      Tips shared in a team channel. Not reviewed.

      ## Retention policy

      Restore points are kept for 30 days by default. To change it, edit the
      setting keep_points in the agent config and run orbit-agent sync.
      There is no need to restart the agent.

  - slug: nimbus-gateway-betrieb
    language: de
    status: current
    body: |
      # Nimbus Gateway Betriebshandbuch

      Dieses Handbuch beschreibt den täglichen Betrieb des Nimbus Speicher
      Gateways. Es richtet sich an Betreiber, die die Grundeinrichtung
      bereits kennen.

      ## Überblick

      Das Nimbus Gateway hält Objektspeicher für lokale Clients im Cache.
      Pro Host läuft ein Dienst. Jedes Gateway hat eine lokale Cache Platte
      und eine kleine Metadaten Datenbank.

      ## Installation

      Installieren Sie das Paket aus dem internen Spiegel. Starten Sie den
      Dienst zuerst mit dem Standardprofil. Prüfen Sie den Health Endpunkt,
      bevor Sie Clients anbinden.

      ## Zertifikat erneuern

      Das Zertifikat des Gateways ist ein Jahr gültig. Erneuern Sie es mit
      dem Befehl nimbus-ctl cert renew --days 90 und laden Sie den Dienst
      danach mit nimbus-ctl reload neu. Clients behalten ihre Sitzungen.

      ## Überwachung

      Das Gateway liefert Metriken auf Port 9310 unter dem Pfad /metrics.
      Wichtig sind die Trefferquote des Caches, die Länge der Upload
      Warteschlange und der freie Plattenplatz.

      ## Aktualisierung

      Aktualisieren Sie immer nur ein Gateway gleichzeitig. Leiten Sie die
      Clients vorher um und lesen Sie die Versionshinweise.

      ## Fehlerbehebung

      Die meisten Probleme zeigen sich als langsame Uploads. Prüfen Sie
      zuerst das Dienstprotokoll. Der Fehler E-417 bedeutet, dass die Cache
      Platte voll ist. Geben Sie Platz unter /var/nimbus/cache frei, dann
      setzt das Gateway die Uploads selbst fort.

